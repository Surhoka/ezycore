<div x-data="productViewData()" x-init="init()" x-cloak>
  <template x-if="product">
    <div class="space-y-6">

      <!-- A. Product Overview -->
      <div class="grid md:grid-cols-[1fr_1.2fr] gap-6 bg-theme-secondary border border-theme-border rounded-xl p-4 md:p-6">

        <!-- LEFT: Images -->
        <div>
          <div class="bg-theme-primary border border-theme-border rounded-xl flex items-center justify-center h-64 md:h-80 mb-3 overflow-hidden">
            <template x-if="images[activeImage] && images[activeImage].startsWith('http')">
              <img :src="images[activeImage]" :alt="product.title || product.name" class="w-full h-full object-contain" />
            </template>
            <template x-if="!images[activeImage] || !images[activeImage].startsWith('http')">
              <span class="text-6xl font-extrabold text-gray-200 dark:text-gray-700" x-text="(product.title || product.name || '?').substring(0, 2).toUpperCase()"></span>
            </template>
          </div>
          <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar">
            <template x-for="(img, idx) in images" :key="idx">
              <button
                class="w-14 h-14 rounded-lg border-2 flex-shrink-0 flex items-center justify-center transition-all overflow-hidden"
                :class="activeImage === idx ? 'border-brand-500' : 'border-theme-border bg-theme-primary hover:border-brand-300'"
                @click="activeImage = idx">
                <template x-if="img && img.startsWith('http')">
                  <img :src="img" :alt="product.title || product.name" class="w-full h-full object-cover" />
                </template>
                <template x-if="!img || !img.startsWith('http')">
                  <span class="text-sm font-bold text-gray-400" x-text="(product.title || product.name || '?').substring(0, 1)"></span>
                </template>
              </button>
            </template>
          </div>
        </div>

        <!-- RIGHT: Info -->
        <div class="space-y-3">
          <h1 class="text-lg md:text-xl font-bold text-theme-text leading-snug" x-text="product.title || product.name"></h1>

          <div class="flex items-center gap-3 text-xs text-theme-text-sub">
            <div class="flex text-yellow-400">
              <template x-for="i in [1,2,3,4]" :key="i">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
              </template>
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor" fill-opacity="0.3"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            </div>
            <span x-show="product.stock !== undefined">| Terjual: <span x-text="product.sold || '-'"></span></span>
          </div>

          <div class="bg-red-50 dark:bg-red-900/10 border border-red-100 dark:border-red-900/20 rounded-xl p-4 space-y-1">
            <div class="flex items-center gap-2">
              <span class="text-2xl md:text-3xl font-extrabold text-red-600 dark:text-red-400" x-text="formatPrice(product.price)"></span>
              <span x-show="hasDiscount" class="text-xs font-bold bg-red-500 text-white px-1.5 py-0.5 rounded" x-text="'-' + discountPct + '%'"></span>
            </div>
            <div x-show="hasDiscount" class="flex items-center gap-2 text-xs text-theme-text-sub">
              <span class="line-through" x-text="formatPrice(product.compareatprice)"></span>
              <span>Harga Retail</span>
            </div>
          </div>

          <div class="flex items-center gap-2 text-xs text-theme-text-sub bg-theme-primary rounded-lg px-3 py-2">
            <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
            <span>Estimasi sampai dalam 3-7 hari</span>
          </div>

          <div class="flex items-center gap-4">
            <div class="flex items-center border border-theme-border rounded-lg">
              <button class="w-9 h-9 flex items-center justify-center text-theme-text hover:bg-brand-50 dark:hover:bg-brand-900/20 transition-colors" @click="qty = Math.max(1, qty - 1)">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
              <span class="w-11 text-center font-semibold text-theme-text text-sm" x-text="qty"></span>
              <button class="w-9 h-9 flex items-center justify-center text-theme-text hover:bg-brand-50 dark:hover:bg-brand-900/20 transition-colors" @click="qty = Math.min(99, qty + 1)">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
            </div>
            <span class="text-xs text-theme-text-sub"><span class="font-medium" :class="stockColor" x-text="stockLabel"></span></span>
          </div>

          <div class="flex items-center gap-2 pt-1">
            <button class="flex-1 border-2 border-brand-600 text-brand-600 dark:text-brand-400 dark:border-brand-400 font-semibold py-2.5 rounded-lg text-sm flex items-center justify-center gap-2 hover:bg-brand-50 dark:hover:bg-brand-900/20 transition-colors" @click="addToCart()">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
              Masukkan Keranjang
            </button>
            <button class="flex-1 bg-red-500 hover:bg-red-600 text-white font-semibold py-2.5 rounded-lg text-sm flex items-center justify-center gap-2 transition-colors" @click="addToCart(); window.navigate('payment')">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
              Beli Sekarang
            </button>
          </div>
        </div>
      </div>

      <!-- B. Spesifikasi + Voucher -->
      <div class="grid md:grid-cols-[3fr_1fr] gap-6">
        <div class="space-y-6">
          <div class="bg-theme-secondary border border-theme-border rounded-xl p-4 md:p-6">
            <h2 class="text-base font-bold text-theme-text mb-4">Spesifikasi Produk</h2>
            <div class="grid grid-cols-2 gap-x-6 gap-y-3 text-sm">
              <div class="flex items-center gap-2"><span class="text-theme-text-sub">Kategori</span><span class="font-medium text-theme-text" x-text="product.category || '-'"></span></div>
              <div class="flex items-center gap-2"><span class="text-theme-text-sub">Stok</span><span class="font-medium" :class="stockColor" x-text="stockLabel"></span></div>
              <template x-if="product.sku">
                <div class="flex items-center gap-2"><span class="text-theme-text-sub">SKU</span><span class="font-medium text-theme-text" x-text="product.sku"></span></div>
              </template>
              <template x-if="product.weight > 0">
                <div class="flex items-center gap-2"><span class="text-theme-text-sub">Berat</span><span class="font-medium text-theme-text" x-text="product.weight + ' ' + (product.weightunit || 'gram')"></span></div>
              </template>
            </div>
          </div>
          <div class="bg-theme-secondary border border-theme-border rounded-xl p-4 md:p-6">
            <h2 class="text-base font-bold text-theme-text mb-4">Deskripsi Produk</h2>
            <p class="text-sm text-theme-text-sub leading-relaxed whitespace-pre-line" x-text="product.description || 'Deskripsi produk belum tersedia.'"></p>
          </div>
        </div>

        <!-- Voucher -->
        <div x-data="voucherData()" class="space-y-3">
          <h2 class="text-base font-bold text-theme-text">Voucher Toko</h2>
          <template x-for="v in vouchers" :key="v.id">
            <div class="rounded-xl border p-3 space-y-1.5" :class="v.bg">
              <p class="text-xs font-bold text-theme-text uppercase tracking-wide" x-text="v.label"></p>
              <p class="text-base font-extrabold text-red-600 dark:text-red-400" x-text="v.disc"></p>
              <p class="text-[10px] text-theme-text-sub" x-text="v.min"></p>
              <button class="w-full text-[11px] font-bold py-1 rounded-lg transition-colors"
                :class="claimed[v.id] ? 'bg-gray-200 text-gray-500 cursor-default' : 'bg-red-500 hover:bg-red-600 text-white'"
                @click="claimed[v.id] = true"
                x-text="claimed[v.id] ? 'Sudah Diklaim' : 'Klaim'"></button>
            </div>
          </template>
        </div>
      </div>

      <!-- C. Related Products -->
      <div class="mt-8" x-data="relatedProductsData()">
        <h2 class="text-base font-bold text-theme-text mb-4">Produk Terkait</h2>
        <div x-show="isLoadingRelated" class="text-sm text-theme-text-sub py-4">Memuat produk terkait...</div>
        <div x-show="!isLoadingRelated && relatedProducts.length === 0" class="text-sm text-theme-text-sub py-4">Tidak ada produk terkait.</div>
        <div x-show="!isLoadingRelated && relatedProducts.length > 0" class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <template x-for="p in relatedProducts" :key="p.id">
            <div class="bg-theme-secondary border border-theme-border rounded-xl p-4 hover:shadow-md hover:border-brand-200 dark:hover:border-brand-700 transition-all cursor-pointer"
              @click="window.navigate('product', { slug: p.slug, year: window.extractDateParams({ publishedat: p.publishedat }).year, month: window.extractDateParams({ publishedat: p.publishedat }).month, meta: { slug: p.slug, id: p.id, name: p.name, title: p.name, price: p.price, category: p.category, image: p.image, publishedat: p.publishedat, _type: 'product' } })">
              <div class="flex items-center justify-center h-28 bg-gradient-to-br from-gray-100 to-gray-200 dark:from-gray-800 dark:to-gray-900 rounded-lg mb-3 overflow-hidden">
                <template x-if="p.image && p.image.startsWith('http')">
                  <img :src="p.image" :alt="p.name" class="w-full h-full object-cover" />
                </template>
                <template x-if="!p.image || !p.image.startsWith('http')">
                  <span class="text-xl font-extrabold text-gray-300 dark:text-gray-600" x-text="(p.name || '?').substring(0, 2).toUpperCase()"></span>
                </template>
              </div>
              <h4 class="text-sm font-semibold text-theme-text mb-1 truncate" x-text="p.name"></h4>
              <p class="text-sm font-bold text-brand-600 dark:text-brand-400" x-text="formatPrice(p.price)"></p>
            </div>
          </template>
        </div>
      </div>

    </div>
  </template>
</div>

<script>
window.productViewData = function () {
  return {
    product: null,
    qty: 1,
    activeImage: 0,
    images: [],

    init: function () {
      var self = this;
      var meta = window._lastResolvedMeta;
      if (meta) {
        self.product = meta;
        // Gunakan images array jika ada, fallback ke image tunggal, lalu inisial
        self.images = (meta.images && meta.images.length > 0)
          ? meta.images
          : (meta.image ? [meta.image] : [(meta.title || meta.name || '?').substring(0, 2).toUpperCase()]);

        // Jika meta dari feed (tidak punya stock/description lengkap), fetch dari SSR page
        var needsFullData = (meta.stock === undefined || meta.stock === null || !meta.description);
        if (needsFullData && meta.slug) {
          self.fetchFullMeta(meta.slug);
        }
      } else {
        self.product = { title: 'Produk Tidak Ditemukan', name: 'Produk Tidak Ditemukan', price: 0, description: 'Maaf, produk yang Anda cari tidak tersedia.' };
        self.images = ['??'];
      }

      // Update breadcrumb dengan judul produk setelah data siap
      if (window.app && typeof window.app.updateBreadcrumb === 'function') {
        window.app.updateBreadcrumb('product');
      }
    },

    fetchFullMeta: async function (slug) {
      var self = this;
      try {
        // Coba dari slugTypeMap cache untuk tahu URL
        var slugTypeMap = JSON.parse(localStorage.getItem('ezy_slug_type') || '{}');
        // Fetch dari Blogger feed untuk mendapatkan meta lengkap
        var res = await fetch('/feeds/posts/default/-/product?alt=json&maxResults=500');
        if (!res.ok) return;
        var json = await res.json();
        var entries = (json.feed && json.feed.entry) || [];
        for (var i = 0; i < entries.length; i++) {
          try {
            var content = (entries[i].content && entries[i].content.$t) ? entries[i].content.$t : '';
            var doc = new DOMParser().parseFromString(content, 'text/html');
            var el = doc.querySelector('.ezy-meta');
            if (!el) continue;
            var d = JSON.parse((el.getAttribute('data-meta') || '{}').replace(/&apos;/g, "'"));
            if (d.slug !== slug && d.id !== slug) continue;
            // Merge data lengkap ke product yang sudah ada
            Object.assign(self.product, d);
            self.images = (d.images && d.images.length > 0)
              ? d.images
              : (d.image ? [d.image] : [(d.name || '?').substring(0, 2).toUpperCase()]);
            window._lastResolvedMeta = self.product;
            break;
          } catch (e) {}
        }
      } catch (e) { console.warn('[productView] fetchFullMeta failed:', e); }
    },

    formatPrice: function (num) {
      return 'Rp ' + Number(num).toLocaleString('id-ID');
    },

    addToCart: function () {
      if (!this.product) return;
      this.$store.cart.add({
        id: this.product.slug || this.product.id || 'unknown',
        name: this.product.title || this.product.name,
        price: this.product.price || 0,
        imageurl: this.product.image || ''
      }, this.qty);
      this.qty = 1;
    },

    get discountPct() {
      var cp = Number(this.product && this.product.compareatprice) || 0;
      var p = Number(this.product && this.product.price) || 0;
      return (cp > 0 && cp > p) ? Math.round((1 - p / cp) * 100) : 0;
    },
    get hasDiscount() { return this.discountPct > 0; },
    get stockLabel() { return (Number(this.product && this.product.stock) || 0) > 0 ? 'Tersedia' : 'Stok Habis'; },
    get stockColor() { return (Number(this.product && this.product.stock) || 0) > 0 ? 'text-green-600' : 'text-red-600'; }
  };
};

window.voucherData = function () {
  return {
    vouchers: [
      { id: 'v1', label: 'Flash Sale Sparepart', disc: 'Rp25.000', min: 'Min. belanja Rp150.000', bg: 'bg-red-50 dark:bg-red-900/10 border-red-100 dark:border-red-900/20' },
      { id: 'v2', label: 'Diskon Member Baru', disc: '10%', min: 'Min. belanja Rp100.000', bg: 'bg-blue-50 dark:bg-blue-900/10 border-blue-100 dark:border-blue-900/20' },
      { id: 'v3', label: 'Gratis Ongkir', disc: 'Rp0', min: 'Min. belanja Rp200.000', bg: 'bg-green-50 dark:bg-green-900/10 border-green-100 dark:border-green-900/20' }
    ],
    claimed: {}
  };
};

window.relatedProductsData = function () {
  return {
    relatedProducts: [],
    isLoadingRelated: true,
    init: async function () {
      var meta = window._lastResolvedMeta;
      if (!meta || !meta.category) { this.isLoadingRelated = false; return; }
      var currentSlug = meta.slug || meta.id || '';
      try {
        var res = await fetch('/feeds/posts/default/-/product?alt=json&maxResults=500');
        var json = await res.json();
        if (json.feed && json.feed.entry) {
          var parsed = [];
          for (var i = 0; i < json.feed.entry.length; i++) {
            try {
              var entry = json.feed.entry[i];
              var content = (entry.content && entry.content.$t) ? entry.content.$t : '';
              var doc = new DOMParser().parseFromString(content, 'text/html');
              var el = doc.querySelector('.ezy-meta');
              if (!el) continue;
              var d = JSON.parse((el.getAttribute('data-meta') || '{}').replace(/&apos;/g, "'"));
              if (d._type !== 'product' || d.slug === currentSlug || d.id === currentSlug) continue;
              parsed.push({ id: d.id || '', name: d.name || (entry.title ? entry.title.$t : '') || '', slug: d.slug || '', price: Number(d.price) || 0, category: d.category || '', image: d.image || '', publishedat: d.publishedat || '' });
            } catch (e) {}
          }
          this.relatedProducts = parsed.filter(function (p) { return p.category === meta.category; }).slice(0, 4);
        }
      } catch (e) {
        console.warn('Related fetch failed:', e);
      } finally {
        this.isLoadingRelated = false;
      }
    },
    formatPrice: function (num) { return 'Rp ' + Number(num).toLocaleString('id-ID'); }
  };
};
</script>
