<div class="relative z-1 flex min-h-[calc(100vh-120px)] flex-col items-center justify-center overflow-hidden p-6"
    x-data="{}">
    <!-- ===== Common Grid Shape Start ===== -->
    <div class="absolute right-0 top-0 -z-1 w-full max-w-[250px] xl:max-w-[450px]" x-icon="'grid-01'">
    </div>
    <div class="absolute bottom-0 left-0 -z-1 w-full max-w-[250px] rotate-180 xl:max-w-[450px]" x-icon="'grid-01'">
    </div>
    <!-- ===== Common Grid Shape End ===== -->

    <div class="mx-auto w-full max-w-[500px] text-center">
        <!-- Error Code -->
        <div class="relative mb-8">
            <h1 class="text-dark mb-4 text-7xl font-extrabold text-yellow-500 lg:text-9xl dark:text-yellow-400">
                404
            </h1>
            <div
                class="absolute -top-4 left-1/2 -translate-x-1/2 text-xs font-bold uppercase tracking-[0.5em] text-gray-400 dark:text-gray-500">
                Page Not Found
            </div>
        </div>

        <!-- Message -->
        <h2
            class="mb-4 text-3xl font-bold tracking-tight text-balance text-neutral-700 md:text-4xl dark:text-neutral-300">
            Opps! Halaman tidak ditemukan.
        </h2>
        <p class="mb-10 text-base text-gray-500 dark:text-gray-400">
            Halaman yang Anda cari mungkin telah dipindahkan atau dihapus.
        </p>

        <!-- Actions -->
        <button
            class="group inline-flex items-center justify-center gap-x-2 rounded-lg px-4 py-3 text-sm font-bold text-neutral-50 ring-zinc-500 transition duration-300 focus-visible:ring-3 outline-hidden border border-transparent bg-orange-400 hover:bg-orange-500 active:bg-orange-500 dark:focus:outline-hidden disabled:pointer-events-none disabled:opacity-50 2xl:text-base dark:ring-zinc-200"
            id="go-back"> Go Back <svg class="h-4 w-4 shrink-0 transition duration-300 group-hover:translate-x-1"
                height="24" viewBox="0 0 24 24" width="24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <title></title>
                <path d="m9 18 6-6-6-6" class></path>
            </svg> </button>
    </div>

    <!-- Branding Footer -->
    <div class="mt-16 flex flex-col items-center border-t border-gray-100 pt-8 dark:border-gray-800/50">
        <a href="/" class="group flex items-center gap-3 transition-opacity hover:opacity-80">
            <img :src="blogFavicon" alt="Logo" class="h-8 w-8 rounded-lg shadow-sm" />
            <div class="flex flex-col">
                <span class="text-xl font-bold tracking-tight text-gray-900 dark:text-white"
                    x-text="blogTitle || 'EzyCore'"></span>
                <span class="text-[10px] text-gray-400 titlecase tracking-widest font-medium"
                    x-text="blogDescription"></span>
            </div>
        </a>
    </div>

</div>
