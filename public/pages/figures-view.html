<div x-data='figureSearchData()' x-init='init()' class='min-h-[60vh] px-4 py-8 max-w-7xl mx-auto'>

  <div class='flex flex-col lg:flex-row gap-8'>

    <!-- Sidebar: Filter (left, sticky) -->
    <aside class='w-full lg:w-64 flex-shrink-0 order-2 lg:order-1'>
      <div class='lg:sticky lg:top-24 bg-theme-secondary border border-theme-border rounded-2xl p-5 shadow-xl space-y-5'>

        <h2 class='text-xs font-bold text-theme-text-sub uppercase tracking-widest'>Filter</h2>

        <!-- Vehicle Model Dropdown -->
        <div>
          <label class='block text-[11px] font-semibold text-theme-text-sub uppercase tracking-wider mb-1.5'>Model Kendaraan</label>
          <div class='relative'>
            <select x-model='selectedModel' x-on:change='filterResults()'
              class='w-full appearance-none bg-theme-primary border border-theme-border rounded-xl px-4 py-2.5 text-theme-text text-sm focus:outline-none focus:ring-2 focus:ring-brand-600 focus:border-brand-600 transition-colors cursor-pointer'>
              <option value=''>Semua Model</option>
              <template x-for='model in vehicleModels' :key='model'>
                <option :value='model' x-text='model'></option>
              </template>
            </select>
            <svg class='absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-theme-text-sub pointer-events-none'
              viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>
              <polyline points='6 9 12 15 18 9' />
            </svg>
          </div>
        </div>

        <!-- Category Dropdown -->
        <div x-show='categories.length > 0'>
          <label class='block text-[11px] font-semibold text-theme-text-sub uppercase tracking-wider mb-1.5'>Kategori</label>
          <div class='relative'>
            <select x-model='selectedCategory' x-on:change='filterResults()'
              class='w-full appearance-none bg-theme-primary border border-theme-border rounded-xl px-4 py-2.5 text-theme-text text-sm focus:outline-none focus:ring-2 focus:ring-brand-600 focus:border-brand-600 transition-colors cursor-pointer'>
              <option value=''>Semua Kategori</option>
              <template x-for='cat in categories' :key='cat'>
                <option :value='cat' x-text='cat'></option>
              </template>
            </select>
            <svg class='absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-theme-text-sub pointer-events-none'
              viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>
              <polyline points='6 9 12 15 18 9' />
            </svg>
          </div>
        </div>

        <!-- Search by SKU / Part Name -->
        <div>
          <label class='block text-[11px] font-semibold text-theme-text-sub uppercase tracking-wider mb-1.5'>Cari SKU / Nama Produk</label>
          <div class='relative'>
            <svg class='absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-theme-text-sub' viewBox='0 0 24 24' fill='none'
              stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>
              <circle cx='11' cy='11' r='8' />
              <line x1='21' y1='21' x2='16.65' y2='16.65' />
            </svg>
            <input type='text' x-model='searchQuery' x-on:input.debounce.300ms='filterResults()'
              placeholder='09482-61A01, Kanvas Filter...'
              class='w-full bg-theme-primary border border-theme-border rounded-xl pl-10 pr-4 py-2.5 text-theme-text text-sm placeholder-theme-text-sub focus:outline-none focus:ring-2 focus:ring-brand-600 focus:border-brand-600 transition-colors' />
          </div>
        </div>

        <!-- Result Count -->
        <div class='pt-2 border-t border-theme-border'>
          <p class='text-xs text-theme-text-sub' x-text='filteredResults.length + " figure ditemukan"'></p>
        </div>
      </div>
    </aside>

    <!-- Main: Header + Grid (right) -->
    <div class='flex-1 min-w-0 order-1 lg:order-2'>

      <!-- Header -->
      <div class='mb-8'>
        <h1 class='text-3xl md:text-4xl font-extrabold text-theme-text tracking-tight'>Figure & Diagram</h1>
        <p class='mt-2 text-theme-text-sub text-sm md:text-base'>Cari diagram interaktif berdasarkan model kendaraan, nomor parts, atau nama produk.</p>
      </div>

      <!-- Loading -->
      <template x-if='isLoading'>
        <div class='flex flex-col items-center justify-center py-20 gap-3'>
          <div class='w-8 h-8 border-2 border-brand-600 border-t-transparent rounded-full animate-spin'></div>
          <span class='text-sm text-theme-text-sub'>Memuat data figure...</span>
        </div>
      </template>

      <!-- Empty State -->
      <template x-if='!isLoading && filteredResults.length === 0'>
        <div class='text-center py-20'>
          <svg class='mx-auto w-16 h-16 text-theme-text-sub opacity-40 mb-4' viewBox='0 0 24 24' fill='none' stroke='currentColor'
            stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'>
            <circle cx='11' cy='11' r='8' />
            <line x1='21' y1='21' x2='16.65' y2='16.65' />
          </svg>
          <p class='text-theme-text-sub text-sm'>Tidak ada figure yang cocok dengan pencarian Anda.</p>
        </div>
      </template>

      <!-- Results Grid -->
      <template x-if='!isLoading && filteredResults.length > 0'>
        <div>
          <div class='grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5'>
            <template x-for='item in paginatedResults' :key='item.slug'>
              <button type='button' x-on:click='openFigure(item)'
                class='group bg-theme-secondary rounded-xl overflow-hidden shadow-lg border border-theme-border hover:border-brand-600/60 transition-all duration-200 hover:scale-[1.02] hover:shadow-xl text-left cursor-pointer'>

                <!-- Thumbnail -->
                <div class='relative aspect-video bg-gray-800 overflow-hidden'>
                  <img :src='item.thumbnail' :alt='item.title'
                    class='w-full h-full object-cover' loading='lazy'
                    onerror="this.style.display='none'" />
                  <div class='absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent'></div>
                  <div class='absolute bottom-2 left-2'>
                    <span x-show='item.model' x-text='item.model'
                      class='inline-block bg-brand-600/90 text-white text-[10px] font-bold px-2 py-0.5 rounded-md uppercase tracking-wide'></span>
                  </div>
                </div>

                <!-- Info -->
                <div class='p-4'>
                  <h3 class='text-sm font-bold text-theme-text truncate group-hover:text-brand-400 transition-colors'
                    x-text='item.title'></h3>
                  <p class='text-xs text-theme-text-sub mt-1 truncate'
                    x-text='item.description || "Klik untuk melihat diagram interaktif"'></p>
                </div>
              </button>
            </template>
          </div>

          <!-- Pagination -->
          <div x-show='totalPages > 1' class='flex items-center justify-center gap-1.5 mt-8'>
            <button type='button' x-on:click='goToPage(currentPage - 1)' :disabled='currentPage <= 1'
              class='w-9 h-9 flex items-center justify-center rounded-lg border border-theme-border text-theme-text-sub hover:bg-theme-secondary disabled:opacity-30 disabled:cursor-not-allowed transition-colors text-sm font-bold'>
              &lsaquo;
            </button>
            <template x-for='p in totalPages' :key='p'>
              <button type='button' x-on:click='goToPage(p)'
                class='w-9 h-9 flex items-center justify-center rounded-lg text-sm font-bold transition-colors'
                :class='p === currentPage ? "bg-brand-600 text-white shadow-lg shadow-brand-600/25" : "border border-theme-border text-theme-text-sub hover:bg-theme-secondary"'>
                <span x-text='p'></span>
              </button>
            </template>
            <button type='button' x-on:click='goToPage(currentPage + 1)' :disabled='currentPage >= totalPages'
              class='w-9 h-9 flex items-center justify-center rounded-lg border border-theme-border text-theme-text-sub hover:bg-theme-secondary disabled:opacity-30 disabled:cursor-not-allowed transition-colors text-sm font-bold'>
              &rsaquo;
            </button>
          </div>
        </div>
      </template>

    </div>
  </div>

</div>
