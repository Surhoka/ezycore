<div x-data='figureSearchData()' x-init='init()' class='min-h-[60vh] px-4 py-8 max-w-6xl mx-auto'>

  <!-- Header -->
  <div class='text-center mb-10'>
    <h1 class='text-3xl md:text-4xl font-extrabold text-white tracking-tight'>Figure & Diagram</h1>
    <p class='mt-2 text-gray-400 text-sm md:text-base'>Cari diagram interaktif berdasarkan model kendaraan, nomor parts, atau nama produk.</p>
  </div>

  <!-- Search Panel -->
  <div class='bg-[var(--bg-sidebar)] dark:bg-gray-900 rounded-2xl p-5 md:p-8 shadow-xl border border-brand-800/20 dark:border-gray-800 mb-8'>

    <!-- Vehicle Model Dropdown -->
    <div class='mb-5'>
      <label class='block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2'>Model Kendaraan</label>
      <div class='relative'>
        <select
          x-model='selectedModel'
          x-on:change='filterResults()'
          class='w-full appearance-none bg-gray-800 dark:bg-gray-950 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-600 focus:border-brand-600 transition-colors cursor-pointer'>
          <option value=''>Semua Model</option>
          <template x-for='model in vehicleModels' :key='model'>
            <option :value='model' x-text='model'></option>
          </template>
        </select>
        <svg class='absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 pointer-events-none' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>
      </div>
    </div>

    <!-- Search by SKU / Part Name -->
    <div class='relative'>
      <label class='block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2'>Cari berdasarkan SKU / Kode Part / Nama Produk</label>
      <div class='relative'>
        <svg class='absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>
        <input
          type='text'
          x-model='searchQuery'
          x-on:input.debounce.300ms='filterResults()'
          placeholder='Contoh: 09482-61A01, Kanvas Filter, dll.'
          class='w-full bg-gray-800 dark:bg-gray-950 border border-gray-700 rounded-xl pl-10 pr-4 py-3 text-white text-sm placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-600 focus:border-brand-600 transition-colors' />
      </div>
    </div>
  </div>

  <!-- Loading -->
  <template x-if='isLoading'>
    <div class='flex flex-col items-center justify-center py-20 gap-3'>
      <div class='w-8 h-8 border-2 border-brand-600 border-t-transparent rounded-full animate-spin'></div>
      <span class='text-sm text-gray-400'>Memuat data figure...</span>
    </div>
  </template>

  <!-- Empty State -->
  <template x-if='!isLoading && filteredResults.length === 0'>
    <div class='text-center py-20'>
      <svg class='mx-auto w-16 h-16 text-gray-600 mb-4' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>
      <p class='text-gray-400 text-sm'>Tidak ada figure yang cocok dengan pencarian Anda.</p>
    </div>
  </template>

  <!-- Results Grid -->
  <template x-if='!isLoading && filteredResults.length > 0'>
    <div class='grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5'>
      <template x-for='item in filteredResults' :key='item.slug'>
        <button
          type='button'
          x-on:click='openFigure(item)'
          class='group bg-[var(--bg-sidebar)] dark:bg-gray-900 rounded-xl overflow-hidden shadow-lg border border-brand-800/20 dark:border-gray-800 hover:border-brand-600/60 dark:hover:border-brand-600/40 transition-all duration-200 hover:scale-[1.02] hover:shadow-xl text-left cursor-pointer'>

          <!-- Thumbnail -->
          <div class='relative aspect-video bg-gray-800 overflow-hidden'>
            <img
              :src='item.thumbnail'
              :alt='item.title'
              class='w-full h-full object-cover transition-transform duration-300 group-hover:scale-105'
              loading='lazy'
              onerror="this.style.display='none'" />
            <div class='absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent'></div>
            <div class='absolute bottom-2 left-2 right-2'>
              <span x-show='item.model' x-text='item.model' class='inline-block bg-brand-600/90 text-white text-[10px] font-bold px-2 py-0.5 rounded-md uppercase tracking-wide'></span>
            </div>
          </div>

          <!-- Info -->
          <div class='p-4'>
            <h3 class='text-sm font-bold text-white truncate group-hover:text-brand-400 transition-colors' x-text='item.title'></h3>
            <p class='text-xs text-gray-400 mt-1 truncate' x-text='item.description || "Klik untuk melihat diagram interaktif"'></p>
            <div class='flex items-center gap-2 mt-3'>
              <span class='text-[10px] font-semibold bg-gray-800 text-gray-300 px-2 py-0.5 rounded-md' x-text='item.hotspotCount + " titik"'></span>
              <span class='text-[10px] font-semibold bg-gray-800 text-gray-300 px-2 py-0.5 rounded-md' x-text='item.skuCount + " SKU"'></span>
            </div>
          </div>
        </button>
      </template>
    </div>
  </template>

</div>
