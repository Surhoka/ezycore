<div x-data="shopData()" x-init="init()">
  <!-- Header -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
    <div>
      <h1 class="text-2xl font-bold text-theme-text">Katalog Produk</h1>
      <p class="text-sm text-theme-text-sub" x-text="filteredProducts.length + ' produk ditemukan'"></p>
    </div>
    <div class="relative">
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input
        class="w-full md:w-64 pl-9 pr-4 py-2 rounded-lg border border-theme-border bg-theme-primary text-theme-text text-sm focus:ring-2 focus:ring-brand-500 outline-none transition-all placeholder:text-theme-text-sub/50"
        type="text" placeholder="Cari produk..." x-model="search" />
    </div>
  </div>

  <!-- Categories (Pines Badge style) -->
  <div class="flex gap-2 overflow-x-auto pb-2 no-scrollbar mb-6">
    <template x-for="cat in categories" :key="cat">
      <button class="whitespace-nowrap px-3 py-1 rounded-full text-xs font-semibold transition-all"
        :class="activeCategory === cat ? 'bg-brand-500 text-white shadow-sm' : 'bg-theme-secondary border border-theme-border text-theme-text-sub hover:border-brand-300 hover:text-brand-600'"
        x-on:click="activeCategory = cat; currentPage = 1">
        <span x-text="cat"></span>
      </button>
    </template>
  </div>

  <!-- Loading -->
  <div x-show="isLoadingProducts" class="text-center py-16 text-theme-text-sub">
    <div class="wave-loader mx-auto mb-3"><span></span><span></span><span></span><span></span><span></span></div>
    <p>Memuat produk...</p>
  </div>

  <!-- Error -->
  <div x-show="!isLoadingProducts && loadError" class="text-center py-16 text-theme-text-sub">
    <p>Gagal memuat produk. Silakan refresh halaman.</p>
  </div>

  <!-- Empty -->
  <div x-show="!isLoadingProducts && !loadError && filteredProducts.length === 0"
    class="text-center py-16 text-theme-text-sub">
    <p>Tidak ada produk yang sesuai dengan pencarian Anda.</p>
  </div>

  <!-- Product Grid (Pines Card pattern) -->
  <div x-show="!isLoadingProducts && !loadError && filteredProducts.length > 0"
    class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
    <template x-for="product in paginatedProducts" :key="product.id">
      <div
        class="bg-theme-secondary border border-theme-border rounded-lg shadow-sm hover:shadow-md transition-all duration-200 group overflow-hidden cursor-pointer"
        x-on:click="window.navigate('product', { slug: product.slug, year: window.extractDateParams({ publishedat: product.publishedat }).year, month: window.extractDateParams({ publishedat: product.publishedat }).month, meta: { slug: product.slug, id: product.id, name: product.name, title: product.name, price: product.price, category: product.category, image: product.image, images: product.images || [], stock: product.stock, compareatprice: product.compareatprice || 0, description: product.description || '', sku: product.sku || '', weight: product.weight || 0, weightunit: product.weightunit || 'gram', publishedat: product.publishedat, _type: 'product' } })">
        <div class="relative">
          <div
            class="flex items-center justify-center aspect-square bg-gradient-to-br from-gray-100 to-gray-200 dark:from-gray-800 dark:to-gray-900 overflow-hidden">
            <img :src="product.image" :alt="product.name"
              class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
              x-show="product.image && product.image.startsWith('http')" loading="lazy" />
            <span class="text-2xl font-extrabold text-gray-300 dark:text-gray-600"
              x-text="(product.name || '?').substring(0, 2).toUpperCase()"
              x-show="!product.image || !product.image.startsWith('http')"></span>
          </div>
          <!-- Badge (Pines style) -->
          <span x-show="product.category"
            class="absolute top-2 left-2 rounded-full px-2 py-0.5 text-[10px] font-semibold bg-brand-500 text-white shadow-sm"
            x-text="product.category"></span>
        </div>
        <div class="p-3">
          <h4 class="text-xs font-semibold text-theme-text line-clamp-2 mb-1" x-text="product.name"></h4>
          <p class="text-xs font-bold text-brand-600 dark:text-brand-400"
            x-text="'Rp ' + Number(product.price).toLocaleString('id-ID')"></p>
        </div>
      </div>
    </template>
  </div>

  <!-- Pagination (Pines style) -->
  <div x-show="totalPages > 1" class="flex items-center justify-between mt-8 border-t border-theme-border pt-4">
    <p class="text-sm text-theme-text-sub">
      Halaman <span class="font-medium" x-text="currentPage"></span> dari <span class="font-medium" x-text="totalPages"></span>
    </p>
    <nav>
      <ul class="flex items-center text-sm leading-tight bg-theme-secondary border divide-x rounded-lg text-theme-text-sub divide-theme-border border-theme-border">
        <li class="h-9">
          <button class="relative inline-flex items-center h-full px-3 rounded-l-lg hover:text-brand-600 transition-colors disabled:opacity-40 disabled:cursor-not-allowed"
            x-on:click="currentPage = Math.max(1, currentPage - 1)" :disabled="currentPage === 1">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
        </li>
        <template x-for="pg in totalPages" :key="pg">
          <li class="hidden h-9 md:block">
            <button class="relative inline-flex items-center h-full px-3 transition-colors"
              :class="currentPage === pg ? 'text-brand-600 font-semibold bg-brand-50 dark:bg-brand-900/20' : 'hover:text-brand-600'"
              x-on:click="currentPage = pg" x-text="pg"></button>
          </li>
        </template>
        <li class="h-9">
          <button class="relative inline-flex items-center h-full px-3 rounded-r-lg hover:text-brand-600 transition-colors disabled:opacity-40 disabled:cursor-not-allowed"
            x-on:click="currentPage = Math.min(totalPages, currentPage + 1)" :disabled="currentPage === totalPages">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </li>
      </ul>
    </nav>
  </div>
</div>
