<div x-data='shopData()'>
  <!-- Header -->
  <div class='flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6'>
    <div>
      <h1 class='text-2xl font-bold text-theme-text'>Katalog Produk</h1>
      <p class='text-sm text-theme-text-sub' x-text='filteredProducts.length + " produk ditemukan"' />
    </div>
    <div class='relative'>
      <svg class='absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400' viewBox='0 0 24 24' fill='none'
        stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>
        <circle cx='11' cy='11' r='8' />
        <line x1='21' y1='21' x2='16.65' y2='16.65' />
      </svg>
      <input
        class='w-full md:w-64 pl-9 pr-4 py-2 rounded-lg border border-theme-border bg-theme-primary text-theme-text text-sm focus:ring-2 focus:ring-brand-500 outline-none transition-all placeholder:text-theme-text-sub/50'
        type='text' placeholder='Cari produk...' x-model='search' />
    </div>
  </div>

  <!-- Categories -->
  <div class='flex gap-2 overflow-x-auto pb-2 no-scrollbar mb-6'>
    <template x-for='cat in categories' :key='cat'>
      <button class='whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-medium transition-all'
        :class='activeCategory === cat ? &quot;bg-brand-500 text-white&quot; : &quot;bg-theme-secondary border border-theme-border text-theme-text-sub hover:border-brand-300 hover:text-brand-600&quot;'
        x-on:click='activeCategory = cat; currentPage = 1'>
        <span x-text='cat' />
      </button>
    </template>
  </div>

  <!-- Loading -->
  <div x-show='isLoadingProducts' class='text-center py-16 text-theme-text-sub'>
    <p>Memuat produk...</p>
  </div>

  <!-- Error -->
  <div x-show='!isLoadingProducts && loadError' class='text-center py-16 text-theme-text-sub'>
    <p>Gagal memuat produk. Silakan refresh halaman.</p>
  </div>

  <!-- Empty -->
  <div x-show='!isLoadingProducts && !loadError && filteredProducts.length === 0'
    class='text-center py-16 text-theme-text-sub'>
    <p>Tidak ada produk yang sesuai dengan pencarian Anda.</p>
  </div>

  <!-- Product Grid -->
  <div x-show='!isLoadingProducts && !loadError' class='grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3'>
    <template x-for='product in paginatedProducts' :key='product.id'>
      <div class='bg-theme-secondary border border-theme-border rounded-xl hover:shadow-lg hover:border-brand-200 dark:hover:border-brand-700 transition-all duration-300 group overflow-hidden cursor-pointer'
        x-on:click="window.navigate('product', { slug: product.slug, year: window.extractDateParams({ publishedat: product.publishedat }).year, month: window.extractDateParams({ publishedat: product.publishedat }).month, meta: { slug: product.slug, id: product.id, name: product.name, title: product.name, price: product.price, category: product.category, image: product.image, images: product.images || [], stock: product.stock, compareatprice: product.compareatprice || 0, description: product.description || '', sku: product.sku || '', weight: product.weight || 0, weightunit: product.weightunit || 'gram', publishedat: product.publishedat, _type: 'product' } })">
        <div class='relative'>
          <div class='flex items-center justify-center aspect-square bg-gradient-to-br from-gray-100 to-gray-200 dark:from-gray-800 dark:to-gray-900 overflow-hidden'>
            <img :src='product.image' :alt='product.name' class='w-full h-full object-cover' x-show='product.image && product.image.startsWith("http")' />
            <span class='text-2xl font-extrabold text-gray-300 dark:text-gray-600' x-text='(product.name || "?").substring(0, 2).toUpperCase()' x-show='!product.image || !product.image.startsWith("http")' />
          </div>
        </div>
        <div class='p-3 flex items-start justify-between gap-2'>
          <div class='flex-1 min-w-0'>
            <h4 class='text-xs font-semibold text-theme-text line-clamp-2' x-text='product.name' />
            <p class='text-xs font-bold text-brand-600 dark:text-brand-400 mt-0.5' x-text="'Rp ' + Number(product.price).toLocaleString('id-ID')" />
          </div>
          <button class='shrink-0 w-8 h-8 flex items-center justify-center rounded-full bg-brand-500 text-white shadow-sm hover:bg-brand-600 active:scale-95 transition-all duration-200'
            x-on:click.stop='$store.cart.add({ id: product.id, name: product.name, price: product.price, sku: product.sku, imageurl: product.image || &quot;&quot;, images: product.images, weight: product.weight || 0, weightunit: product.weightunit || &quot;gram&quot; }, 1); flyToCart($el, product.image || &quot;&quot;)'>
            <span class='w-3.5 h-3.5' x-icon='"shopping-cart"' />
          </button>
        </div>
      </div>
    </template>
  </div>

  <!-- Pagination -->
  <div x-show='totalPages > 1' class='flex justify-center items-center gap-2 mt-8'>
    <button
      class='w-9 h-9 rounded-lg border border-theme-border flex items-center justify-center text-sm text-theme-text-sub hover:border-brand-300 hover:text-brand-600 transition-colors'
      x-on:click='currentPage = Math.max(1, currentPage - 1)' :disabled='currentPage === 1'>
      <svg class='w-4 h-4' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'>
        <polyline points='15 18 9 12 15 6' />
      </svg>
    </button>
    <template x-for='page in totalPages' :key='page'>
      <button class='w-9 h-9 rounded-lg text-sm font-medium transition-all'
        :class='currentPage === page ? &quot;bg-brand-500 text-white&quot; : &quot;border border-theme-border text-theme-text-sub hover:border-brand-300 hover:text-brand-600&quot;'
        x-on:click='currentPage = page' x-text='page' />
    </template>
    <button
      class='w-9 h-9 rounded-lg border border-theme-border flex items-center justify-center text-sm text-theme-text-sub hover:border-brand-300 hover:text-brand-600 transition-colors'
      x-on:click='currentPage = Math.min(totalPages, currentPage + 1)' :disabled='currentPage === totalPages'>
      <svg class='w-4 h-4' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'>
        <polyline points='9 18 15 12 9 6' />
      </svg>
    </button>
  </div>
</div>
