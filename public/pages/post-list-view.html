<div x-data="postListData()" x-init="init()">
  <!-- Header -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
    <div>
      <h1 class="text-2xl font-bold text-theme-text" x-text="monthLabel ? 'Blog &mdash; ' + monthLabel : 'Blog'"></h1>
      <p class="text-sm text-theme-text-sub" x-text="filteredPosts.length + ' artikel ditemukan'"></p>
    </div>
    <div class="relative">
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input
        class="w-full md:w-64 pl-9 pr-4 py-2 rounded-lg border border-theme-border bg-theme-primary text-theme-text text-sm focus:ring-2 focus:ring-brand-500 outline-none transition-all placeholder:text-theme-text-sub/50"
        type="text" placeholder="Cari artikel..." x-model="search"
        x-on:input.debounce.300ms="applyFilters()" />
    </div>
  </div>

  <!-- Category Filter -->
  <div class="flex gap-2 overflow-x-auto pb-2 no-scrollbar mb-6">
    <template x-for="cat in categories" :key="cat">
      <button class="whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-medium transition-all"
        :class="activeCategory === cat ? 'bg-brand-500 text-white' : 'bg-theme-secondary border border-theme-border text-theme-text-sub hover:border-brand-300 hover:text-brand-600'"
        x-on:click="activeCategory = cat; applyFilters()">
        <span x-text="cat"></span>
      </button>
    </template>
  </div>

  <!-- Loading -->
  <div x-show="isLoading" class="text-center py-16 text-theme-text-sub">
    <div class="wave-loader mb-3">
      <span /><span /><span /><span /><span />
    </div>
    <p class="text-sm">Memuat artikel...</p>
  </div>

  <!-- Error -->
  <div x-show="!isLoading && loadError" class="text-center py-16 text-theme-text-sub">
    <svg class="w-12 h-12 mx-auto mb-3 text-gray-300 dark:text-gray-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" />
    </svg>
    <p class="text-sm">Gagal memuat artikel. Silakan refresh halaman.</p>
  </div>

  <!-- Empty -->
  <div x-show="!isLoading && !loadError && filteredPosts.length === 0"
    class="text-center py-16 text-theme-text-sub">
    <svg class="w-12 h-12 mx-auto mb-3 text-gray-300 dark:text-gray-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" />
    </svg>
    <p class="text-sm">Tidak ada artikel yang sesuai.</p>
  </div>

  <!-- Posts Grid -->
  <div x-show="!isLoading && !loadError && filteredPosts.length > 0"
    class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">

    <!-- Featured Post (First item, larger) -->
    <template x-if="filteredPosts.length > 0" :key="'featured'">
      <div class="md:col-span-2 lg:col-span-3 bg-theme-secondary border border-theme-border rounded-xl overflow-hidden hover:shadow-lg hover:border-brand-200 dark:hover:border-brand-700 transition-all duration-300 cursor-pointer flex flex-col md:flex-row"
        x-on:click="openPost(filteredPosts[0])">
        <!-- Image -->
        <div class="w-full md:w-[380px] flex-shrink-0">
          <div class="aspect-[16/9] md:aspect-auto md:h-full bg-gradient-to-br from-gray-100 to-gray-200 dark:from-gray-800 dark:to-gray-900 flex items-center justify-center overflow-hidden">
            <template x-if="filteredPosts[0].image &amp;&amp; filteredPosts[0].image.startsWith('http')">
              <img :src="filteredPosts[0].image" :alt="filteredPosts[0].title" class="w-full h-full object-cover" loading="lazy" />
            </template>
            <template x-if="!filteredPosts[0].image || !filteredPosts[0].image.startsWith('http')">
              <div class="flex flex-col items-center gap-2 text-gray-300 dark:text-gray-600">
                <svg class="w-10 h-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" />
                </svg>
                <span class="text-xs font-medium">Artikel</span>
              </div>
            </template>
          </div>
        </div>
        <!-- Content -->
        <div class="flex-1 p-5 flex flex-col justify-center">
          <div class="flex items-center gap-2 mb-2">
            <span x-show="filteredPosts[0].category"
              class="inline-block text-[10px] font-bold bg-brand-100 dark:bg-brand-900/30 text-brand-600 dark:text-brand-400 px-2 py-0.5 rounded-full"
              x-text="filteredPosts[0].category"></span>
            <span class="text-xs text-theme-text-sub" x-text="formatDate(filteredPosts[0].publishedat)"></span>
          </div>
          <h2 class="text-lg md:text-xl font-bold text-theme-text line-clamp-2 mb-2" x-text="filteredPosts[0].title"></h2>
          <p class="text-sm text-theme-text-sub line-clamp-3 leading-relaxed" x-text="filteredPosts[0].snippet"></p>
          <div class="mt-3">
            <span class="inline-flex items-center gap-1 text-xs font-semibold text-brand-600 dark:text-brand-400">
              Baca Selengkapnya
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" /></svg>
            </span>
          </div>
        </div>
      </div>
    </template>

    <!-- Regular Post Cards -->
    <template x-for="(post, idx) in filteredPosts.slice(1)" :key="post.slug || idx">
      <div class="bg-theme-secondary border border-theme-border rounded-xl overflow-hidden hover:shadow-lg hover:border-brand-200 dark:hover:border-brand-700 transition-all duration-300 cursor-pointer group"
        x-on:click="openPost(post)">
        <!-- Image -->
        <div class="aspect-[16/10] bg-gradient-to-br from-gray-100 to-gray-200 dark:from-gray-800 dark:to-gray-900 flex items-center justify-center overflow-hidden">
          <template x-if="post.image &amp;&amp; post.image.startsWith('http')">
            <img :src="post.image" :alt="post.title" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy" />
          </template>
          <template x-if="!post.image || !post.image.startsWith('http')">
            <div class="flex flex-col items-center gap-2 text-gray-300 dark:text-gray-600">
              <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" />
              </svg>
              <span class="text-[10px] font-medium">Artikel</span>
            </div>
          </template>
        </div>
        <!-- Content -->
        <div class="p-4">
          <div class="flex items-center gap-2 mb-2">
            <span x-show="post.category"
              class="inline-block text-[10px] font-bold bg-brand-100 dark:bg-brand-900/30 text-brand-600 dark:text-brand-400 px-2 py-0.5 rounded-full"
              x-text="post.category"></span>
            <span class="text-[11px] text-theme-text-sub" x-text="formatDate(post.publishedat)"></span>
          </div>
          <h3 class="text-sm font-bold text-theme-text line-clamp-2 mb-1.5 group-hover:text-brand-600 dark:group-hover:text-brand-400 transition-colors" x-text="post.title"></h3>
          <p class="text-xs text-theme-text-sub line-clamp-2 leading-relaxed" x-text="post.snippet"></p>
          <div class="mt-3 flex items-center justify-between">
            <span class="inline-flex items-center gap-1 text-[11px] font-semibold text-brand-600 dark:text-brand-400">
              Baca
              <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" /></svg>
            </span>
          </div>
        </div>
      </div>
    </template>
  </div>

  <!-- Pagination -->
  <div x-show="totalPages > 1" class="flex justify-center items-center gap-2 mt-8">
    <button
      class="w-9 h-9 rounded-lg border border-theme-border flex items-center justify-center text-sm text-theme-text-sub hover:border-brand-300 hover:text-brand-600 transition-colors"
      x-on:click="currentPage = Math.max(1, currentPage - 1)" :disabled="currentPage === 1">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6" />
      </svg>
    </button>
    <template x-for="page in totalPages" :key="page">
      <button class="w-9 h-9 rounded-lg text-sm font-medium transition-all"
        :class="currentPage === page ? 'bg-brand-500 text-white' : 'border border-theme-border text-theme-text-sub hover:border-brand-300 hover:text-brand-600'"
        x-on:click="currentPage = page" x-text="page"></button>
    </template>
    <button
      class="w-9 h-9 rounded-lg border border-theme-border flex items-center justify-center text-sm text-theme-text-sub hover:border-brand-300 hover:text-brand-600 transition-colors"
      x-on:click="currentPage = Math.min(totalPages, currentPage + 1)" :disabled="currentPage === totalPages">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9 18 15 12 9 6" />
      </svg>
    </button>
  </div>
</div>
