<div x-data="ezyfastSettings" class="w-full px-1 sm:px-0">

  <div class="rounded-2xl border border-primary bg-secondary relative min-h-[500px] shadow-sm overflow-hidden">
    <!-- Loading Overlay -->
    <div x-show="isLoading || loading" x-cloak
      class="absolute inset-0 z-10 flex items-center justify-center bg-secondary/80 backdrop-blur-sm rounded-lg">
      <svg class="h-8 w-8 animate-spin text-brand-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
      </svg>
    </div>

    <div x-show="!loading" class="p-4 md:p-6 transition-opacity duration-500">
      <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90 mb-6">EzyFast Settings</h3>

      <div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03] p-5 lg:p-6">
        <div class="grid grid-cols-1 gap-6 lg:grid-cols-2">

          <!-- Blog ID -->
          <div>
            <label class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-400">Blog ID</label>
            <input type="text" x-model="settings.blogId" placeholder="Blogger blog ID"
              class="w-full h-11 rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-none focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90">
          </div>

          <!-- Blog URL -->
          <div>
            <label class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-400">Blog URL</label>
            <input type="text" x-model="settings.blogUrl" placeholder="https://ezyfast.blogspot.com"
              class="w-full h-11 rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-none focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90">
          </div>

          <!-- System Info (Otomatis) -->
          <div class="lg:col-span-2">
            <div class="rounded-xl border border-gray-200 bg-gray-50 p-4 dark:border-gray-700 dark:bg-gray-800/50">
              <h5 class="text-sm font-semibold text-gray-800 dark:text-white/90 mb-3">System Info (Otomatis)</h5>
              <div class="space-y-2 text-sm">
                <div class="flex items-center gap-2">
                  <span class="text-gray-500 dark:text-gray-400 font-medium min-w-[180px]">WebApp URL :</span>
                  <span class="text-gray-700 dark:text-gray-300 truncate" x-text="settings.webAppUrl || '—'"></span>
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-gray-500 dark:text-gray-400 font-medium min-w-[180px]">SiteKey :</span>
                  <span class="text-gray-700 dark:text-gray-300 truncate" x-text="settings.siteKey || '—'"></span>
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-gray-500 dark:text-gray-400 font-medium min-w-[180px]">System Config Page ID:</span>
                  <span class="text-gray-700 dark:text-gray-300 truncate" x-text="settings.pageIdSystemConfig || '—'"></span>
                </div>

                <div class="mt-3 flex items-center gap-2">
                  <button @click="getBloggerDiagnostics()" :disabled="bloggerDiag.loading || !settings.blogId"
                    class="px-3 py-1.5 text-sm font-medium text-white bg-gray-700 rounded-lg hover:bg-gray-800 disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg x-show="bloggerDiag.loading" x-cloak class="w-4 h-4 animate-spin mr-2 inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                    </svg>
                    <span x-text="bloggerDiag.loading ? 'Mengambil...' : 'Tampilkan Riwayat Sinkron'"></span>
                  </button>

                  <button @click="forceRecreateConfig()" :disabled="bloggerDiag.loading || !settings.blogId"
                    class="px-3 py-1.5 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700 disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg class="w-4 h-4 mr-2 inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                      <path fill="currentColor" d="M12 5v6l4 2"/>
                    </svg>
                    Recreate Page
                  </button>

                  <a class="text-sm text-gray-600 hover:underline ml-2" x-show="settings.pageIdSystemConfig && settings.blogId" :href="'https://draft.blogger.com/blog/page/edit/' + settings.blogId + '/' + settings.pageIdSystemConfig" target="_blank">Buka Halaman di Blogger</a>
                </div>

                <div x-show="bloggerCheck.result || bloggerCheck.error" class="mt-3 text-xs bg-white dark:bg-gray-900 p-3 rounded-lg border border-gray-100 dark:border-gray-800">
                  <template x-if="bloggerCheck.result">
                    <div>
                      <div class="mb-1"><strong>HTTP:</strong> <span x-text="bloggerCheck.result.responseCode"></span></div>
                      <div class="mb-1"><strong>Belongs to Blog:</strong> <span x-text="bloggerCheck.result.belongsToBlog ? 'Yes' : 'No'"></span></div>
                      <div class="mb-1"><strong>Discovery Found:</strong> <span x-text="bloggerCheck.result.discoveryFound ? 'Yes' : 'No'"></span></div>
                      <div class="mb-1" x-show="bloggerCheck.result.discoveryFound"><strong>Discovery Data:</strong>
                        <pre class="text-[11px] mt-1 max-h-48 overflow-auto" x-text="JSON.stringify(bloggerCheck.result.discoveryData, null, 2)"></pre>
                      </div>
                    </div>
                  </template>
                  <template x-if="bloggerCheck.error">
                    <div class="text-red-500">Error: <span x-text="bloggerCheck.error"></span></div>
                  </template>
                </div>

                  <div x-show="bloggerDiag.data || bloggerDiag.error" class="mt-2 text-xs bg-white dark:bg-gray-900 p-3 rounded-lg border border-gray-100 dark:border-gray-800">
                    <template x-if="bloggerDiag.data">
                      <div>
                        <div class="mb-1"><strong>LAST_BLOGGER_SYNC:</strong></div>
                        <pre class="text-[11px] mt-1 max-h-40 overflow-auto" x-text="JSON.stringify(bloggerDiag.data.lastSync || bloggerDiag.data.lastSyncRaw, null, 2)"></pre>
                      </div>
                    </template>
                    <template x-if="bloggerDiag.error">
                      <div class="text-red-500">Error: <span x-text="bloggerDiag.error"></span></div>
                    </template>
                  </div>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>

      <div class="mt-6 flex justify-end gap-3">
        <button @click="saveSettings()" :disabled="isSaving"
          class="px-5 py-2.5 text-sm font-medium text-white bg-brand-500 rounded-lg hover:bg-brand-600 transition-all disabled:opacity-50 disabled:cursor-not-allowed inline-flex items-center gap-2">
          <svg x-show="isSaving" x-cloak class="w-4 h-4 animate-spin text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
          </svg>
          <span x-text="isSaving ? 'Menyimpan...' : 'Simpan Pengaturan'"></span>
        </button>
      </div>
    </div>
  </div>

</div>
