<div x-data="{
    formData: {
        email: '',
        password: ''
    },
    isSubmitting: false,
    
    async login() {
        if (!this.formData.email || !this.formData.password) {
            window.showToast('Email dan Password wajib diisi!', 'error');
            return;
        }

        this.isSubmitting = true;
        
        window.sendDataToGoogle('signin', this.formData, (response) => {
            if (response.status === 'success') {
                window.showToast('Login berhasil! Selamat datang kembali.', 'success');
                
                // Simpan data user ke localStorage sesuai standar EzyCoreAi
                const userData = {
                    ...response.user,
                    isLoggedIn: true,
                    loginDate: new Date().toISOString()
                };
                localStorage.setItem('signedInUser', JSON.stringify(userData));
                
                // Redirect ke dashboard
                setTimeout(() => {
                    window.location.hash = '#dashboard';
                }, 1000);
            } else {
                window.showToast(response.message || 'Login gagal, periksa kredensial Anda.', 'error');
                this.isSubmitting = false;
            }
        }, (err) => {
            window.showToast('Terjadi kesalahan koneksi ke server.', 'error');
            this.isSubmitting = false;
        });
    }
}" class="w-full flex items-center justify-center p-4">
    <div class="auth-card max-w-md">
        <!-- Header -->
        <div class="p-8 text-center border-b border-theme-primary bg-brand-500/5">
            <div class="inline-flex p-3 bg-brand-500 rounded-xl text-white mb-4">
                <span class="w-8 h-8 block" x-icon="'log-in'"></span>
            </div>
            <h2 class="text-2xl font-bold text-theme-primary">Welcome Back</h2>
            <p class="text-theme-secondary text-sm">Masuk untuk mengelola dashboard Anda</p>
        </div>

        <!-- Form Content -->
        <div class="p-8 space-y-5">
            <div>
                <label class="block text-sm font-semibold mb-2 text-theme-primary">Email Address</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" x-icon="'mail'"></span>
                    <input type="email" x-model="formData.email" placeholder="nama@email.com"
                        class="w-full pl-12 pr-4 py-3 rounded-xl border border-theme-primary bg-theme-primary text-theme-primary focus:ring-2 focus:ring-brand-500 outline-none transition-all">
                </div>
            </div>

            <div>
                <div class="flex justify-between mb-2">
                    <label class="text-sm font-semibold text-theme-primary">Password</label>
                    <a href="#" class="text-xs text-brand-500 hover:underline">Lupa Password?</a>
                </div>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" x-icon="'lock'"></span>
                    <input type="password" x-model="formData.password" placeholder="••••••••"
                        class="w-full pl-12 pr-4 py-3 rounded-xl border border-theme-primary bg-theme-primary text-theme-primary focus:ring-2 focus:ring-brand-500 outline-none transition-all">
                </div>
            </div>

            <!-- Submit Button -->
            <button @click="login()" :disabled="isSubmitting"
                class="w-full bg-brand-500 hover:bg-brand-600 disabled:bg-brand-300 text-white font-bold py-4 rounded-xl shadow-lg shadow-brand-500/20 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
                <template x-if="!isSubmitting">
                    <span>Sign In</span>
                </template>
                <template x-if="isSubmitting">
                    <div class="w-6 h-6 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                </template>
            </button>

            <!-- Footer Link -->
            <p class="text-center text-sm text-theme-secondary">
                Belum punya akun?
                <a href="#signup" class="text-brand-500 font-bold hover:underline">Daftar Sekarang</a>
            </p>
        </div>
    </div>
</div>
