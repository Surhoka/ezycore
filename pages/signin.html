<style>
    [x-icon] svg {
        width: 100%;
        height: auto;
        display: block;
    }
</style>

<div x-data="{
    formData: {
        email: '',
        password: ''
    },
    isSubmitting: false,
    
    async login() {
        if (!this.formData.email || !this.formData.password) {
            window.showToast('Email dan Password wajib diisi!', 'error');
            return;
        }

        if (!window.appsScriptUrl) {
            const blogId = window.EZY_BLOG_ID || '';
            const config = JSON.parse(localStorage.getItem('EzycoreConfig_' + blogId) || '{}');
            if (config.webappUrl) window.appsScriptUrl = config.webappUrl;
        }

        this.isSubmitting = true;
        
        window.sendDataToGoogle('SignInUser', this.formData, (response) => {
            if (response.status === 'success') {
                window.showToast('Login berhasil! Selamat datang kembali.', 'success');
                const blogId = window.EZY_BLOG_ID || '';
                const userData = {
                    ...response.user,
                    isLoggedIn: true,
                    loginDate: new Date().toISOString()
                };
                localStorage.setItem('signedInUser_' + blogId, JSON.stringify(userData));
                setTimeout(() => { window.location.hash = '#dashboard'; }, 1000);
            } else {
                window.showToast(response.message || 'Login gagal, periksa kredensial Anda.', 'error');
                this.isSubmitting = false;
            }
        }, (err) => {
            window.showToast('Terjadi kesalahan koneksi ke server.', 'error');
            this.isSubmitting = false;
        });
    }
}" class="auth-card max-w-md animate-slide-up">
    <!-- Form Section -->
    <div class="p-8 flex flex-col justify-center">
        <div class="mb-4 2xl:mb-8">
            <a href="/"
                class="inline-flex items-center text-sm text-gray-500 transition-colors hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300">
                <span class="w-5 h-5 mr-2" x-icon="'arrow-left'"></span>
                <span x-text="$store.i18n ? $store.i18n.t('back_to_dashboard') : 'Back to dashboard'">Back to
                    dashboard</span>
            </a>
        </div>

        <div class="mb-4 2xl:mb-6">
            <h1 class="mb-2 text-2xl font-bold text-gray-800 dark:text-white"
                x-text="$store.i18n ? $store.i18n.t('login_title') : 'Sign In'">
                Sign In
            </h1>
            <p class="text-gray-500 dark:text-gray-400"
                x-text="$store.i18n ? $store.i18n.t('login_subtitle') : 'Enter your email and password to sign in!'">
                Enter your email and password to sign in!
            </p>
        </div>

        <form @submit.prevent="login()">
            <div class="space-y-4 2xl:space-y-5">
                <!-- Email -->
                <div>
                    <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">
                        <span x-text="$store.i18n ? $store.i18n.t('email_label') : 'Email'">Email</span><span
                            class="text-error-500">*</span>
                    </label>
                    <input type="email" x-model="formData.email"
                        :placeholder="$store.i18n ? $store.i18n.t('email_placeholder') : 'Enter your email'" required
                        class="w-full h-11 rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-sm placeholder:text-gray-400 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 dark:border-gray-700 dark:bg-gray-900/50 dark:text-white dark:placeholder:text-white/30 dark:focus:border-brand-500" />
                </div>
                <!-- Password -->
                <div>
                    <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">
                        <span x-text="$store.i18n ? $store.i18n.t('password_label') : 'Password'">Password</span><span
                            class="text-error-500">*</span>
                    </label>
                    <div x-data="{ showPassword: false }" class="relative">
                        <input x-model="formData.password" :type="showPassword ? 'text' : 'password'"
                            :placeholder="$store.i18n ? $store.i18n.t('password_placeholder') : 'Enter your password'"
                            required
                            class="w-full h-11 rounded-lg border border-gray-300 bg-transparent py-2.5 pl-4 pr-11 text-sm text-gray-800 shadow-sm placeholder:text-gray-400 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 dark:border-gray-700 dark:bg-gray-900/50 dark:text-white dark:placeholder:text-white/30 dark:focus:border-brand-500" />
                        <span @click="showPassword = !showPassword"
                            class="absolute z-30 text-gray-500 -translate-y-1/2 cursor-pointer right-4 top-1/2 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200">
                            <span x-show="!showPassword" class="block w-5 h-5" x-icon="'eye-off'"></span>
                            <span x-show="showPassword" class="block w-5 h-5" x-icon="'eye'"></span>
                        </span>
                    </div>
                </div>
                <!-- Checkbox -->
                <div class="flex items-center justify-between">
                    <div x-data="{ checkboxToggle: false }">
                        <label for="checkboxLabelOne"
                            class="flex items-center text-sm font-normal text-gray-700 cursor-pointer select-none dark:text-gray-400">
                            <div class="relative">
                                <input type="checkbox" id="checkboxLabelOne" class="sr-only"
                                    @change="checkboxToggle = !checkboxToggle" />
                                <div :class="checkboxToggle ? 'border-brand-500 bg-brand-500' : 'bg-transparent border-gray-300 dark:border-gray-700'"
                                    class="mr-3 flex h-5 w-5 items-center justify-center rounded-md border-[1.25px]">
                                    <span :class="checkboxToggle ? '' : 'opacity-0'">
                                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"
                                            xmlns="http://www.w3.org/2000/svg">
                                            <path d="M11.6666 3.5L5.24992 9.91667L2.33325 7" stroke="white"
                                                stroke-width="1.94437" stroke-linecap="round" stroke-linejoin="round" />
                                        </svg>
                                    </span>
                                </div>
                            </div>
                            <span x-text="$store.i18n ? $store.i18n.t('keep_logged_in') : 'Keep me logged in'">Keep me
                                logged in</span>
                        </label>
                    </div>
                    <a href="#reset-password" class="text-sm text-brand-500 hover:text-brand-600 dark:text-brand-400"
                        x-text="$store.i18n ? $store.i18n.t('forgot_password') : 'Forgot password?'">Forgot
                        password?</a>
                </div>
                <!-- Button -->
                <div>
                    <button type="submit" :disabled="isSubmitting"
                        class="flex items-center justify-center w-full px-4 py-3 text-sm font-bold text-white transition rounded-lg bg-brand-500 shadow-theme-xs hover:bg-brand-600 focus:outline-none focus:ring-2 focus:ring-brand-500/20">
                        <template x-if="!isSubmitting">
                            <span x-text="$store.i18n ? $store.i18n.t('sign_in') : 'Sign In'">Sign In</span>
                        </template>
                        <template x-if="isSubmitting">
                            <div class="w-6 h-6 border-2 border-white/30 border-t-white rounded-full animate-spin">
                            </div>
                        </template>
                    </button>
                </div>
            </div>
        </form>
        <div class="mt-4 2xl:mt-5">
            <p class="text-sm font-normal text-center text-gray-700 dark:text-gray-400 sm:text-start">
                <span x-text="$store.i18n ? $store.i18n.t('dont_have_account') : 'Don\'t have an account?'">Don't have
                    an account?</span>
                <a href="#signup" class="text-brand-500 hover:text-brand-600 dark:text-brand-400 font-medium"
                    x-text="$store.i18n ? $store.i18n.t('sign_up') : 'Sign Up'">Sign Up</a>
            </p>
        </div>
    </div>
</div>

<div class="fixed z-50 flex items-center gap-3 max-sm:hidden top-6 right-6">
    <button x-show="$store.i18n"
        class="inline-flex items-center justify-center size-10 text-xs font-bold text-white transition-colors rounded-full bg-brand-500 hover:bg-brand-600"
        @click.prevent="$store.i18n.toggle()">
        <span x-text="$store.i18n.locale.toUpperCase()"></span>
    </button>
    <button
        class="inline-flex items-center justify-center text-white transition-colors rounded-full size-10 bg-brand-500 hover:bg-brand-600"
        @click.prevent="darkMode = !darkMode">
        <span class="w-5 h-5" x-icon="'moon'" x-show="darkMode"></span>
        <span class="w-5 h-5" x-icon="'sun'" x-show="!darkMode"></span>
    </button>
</div>
