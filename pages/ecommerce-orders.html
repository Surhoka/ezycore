<div x-data="ecommerceOrders" class="w-full px-1 sm:px-0">

  <div class="rounded-2xl border border-primary bg-secondary relative min-h-[500px] shadow-sm overflow-hidden">
    <!-- Loading Overlay -->
    <div x-show="isLoading" x-cloak
      class="absolute inset-0 z-10 flex items-center justify-center bg-secondary/80 backdrop-blur-sm rounded-lg">
      <svg class="h-8 w-8 animate-spin text-brand-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
      </svg>
    </div>

    <div x-show="!isLoading" class="p-4 md:p-6 transition-opacity duration-500">
      <div class="flex items-center justify-between mb-6">
        <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">Orders</h3>
        <div class="flex gap-2">
          <button @click="filter = 'all'" class="px-3 py-1.5 text-xs font-medium rounded-lg" :class="filter === 'all' ? 'bg-brand-500 text-white' : 'bg-gray-100 text-gray-600 dark:bg-gray-800 dark:text-gray-400'">All</button>
          <button @click="filter = 'pending'" class="px-3 py-1.5 text-xs font-medium rounded-lg" :class="filter === 'pending' ? 'bg-brand-500 text-white' : 'bg-gray-100 text-gray-600 dark:bg-gray-800 dark:text-gray-400'">Pending</button>
          <button @click="filter = 'processing'" class="px-3 py-1.5 text-xs font-medium rounded-lg" :class="filter === 'processing' ? 'bg-brand-500 text-white' : 'bg-gray-100 text-gray-600 dark:bg-gray-800 dark:text-gray-400'">Processing</button>
          <button @click="filter = 'cancelled'" class="px-3 py-1.5 text-xs font-medium rounded-lg" :class="filter === 'cancelled' ? 'bg-brand-500 text-white' : 'bg-gray-100 text-gray-600 dark:bg-gray-800 dark:text-gray-400'">Cancelled</button>
        </div>
      </div>

      <div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03] overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-800/50">
                <th class="text-left py-3 px-4 font-medium text-gray-500">Order ID</th>
                <th class="text-left py-3 px-4 font-medium text-gray-500">Customer</th>
                <th class="text-left py-3 px-4 font-medium text-gray-500">Total</th>
                <th class="text-left py-3 px-4 font-medium text-gray-500">Payment</th>
                <th class="text-left py-3 px-4 font-medium text-gray-500">Status</th>
                <th class="text-left py-3 px-4 font-medium text-gray-500">Date</th>
              </tr>
            </thead>
            <tbody>
              <template x-if="filteredOrders.length === 0">
                <tr><td colspan="6" class="py-8 text-center text-gray-500">No orders found.</td></tr>
              </template>
              <template x-for="order in filteredOrders" :key="order.id">
                <tr class="border-b border-gray-50 dark:border-gray-800/50 hover:bg-gray-50 dark:hover:bg-gray-800/30 cursor-pointer" @click="viewOrder(order)">
                  <td class="py-3 px-4 font-mono text-xs" x-text="order.id"></td>
                  <td class="py-3 px-4" x-text="order.customername || order.customeremail || '-'"></td>
                  <td class="py-3 px-4" x-text="'Rp ' + Number(order.total || 0).toLocaleString()"></td>
                  <td class="py-3 px-4">
                    <span class="px-2 py-1 text-xs rounded-full"
                      :class="order.paymentstatus === 'paid' ? 'bg-green-100 text-green-700' : order.paymentstatus === 'failed' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700'"
                      x-text="order.paymentstatus || 'pending'"></span>
                  </td>
                  <td class="py-3 px-4" x-text="order.status || 'pending'"></td>
                  <td class="py-3 px-4 text-xs text-gray-500" x-text="order.createdat ? new Date(order.createdat).toLocaleDateString() : '-'"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- BEGIN MODAL: ORDER DETAIL -->
  <div :class="{ 'show': selectedOrder }" x-cloak
    class="modal fixed inset-0 p-4 md:p-5 overflow-hidden flex justify-center items-center isolate z-[99999]">
    <div @click="closeDetail()" class="fixed inset-0 h-full w-full bg-gray-900/40 transition-opacity duration-300"></div>
    <div class="modal-dialog">
      <button @click="closeDetail()" class="modal-close-btn">
        <span class="w-6 h-6 block" x-icon="'close'"></span>
      </button>
      <div class="modal-content">
        <div class="modal-header-sticky">
          <h3 class="h3">Order Detail</h3>
          <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">View order information and manage status.</p>
        </div>
        <div class="modal-body-content custom-scrollbar">
          <div>
            <label class="form-label">Order ID</label>
            <div class="text-sm font-mono" x-text="selectedOrder?.id"></div>
          </div>
          <div>
            <label class="form-label">Customer</label>
            <div class="text-sm" x-text="selectedOrder?.customername || '-'"></div>
          </div>
          <div>
            <label class="form-label">Email</label>
            <div class="text-sm" x-text="selectedOrder?.customeremail || '-'"></div>
          </div>
          <div>
            <label class="form-label">Phone</label>
            <div class="text-sm" x-text="selectedOrder?.customerphone || '-'"></div>
          </div>
          <div>
            <label class="form-label">Shipping Address</label>
            <div class="text-sm" x-text="selectedOrder?.shippingaddress || '-'"></div>
          </div>
          <div>
            <label class="form-label">Total</label>
            <div class="text-sm font-semibold" x-text="'Rp ' + Number(selectedOrder?.total || 0).toLocaleString()"></div>
          </div>
          <div>
            <label class="form-label">Payment Method</label>
            <div class="text-sm" x-text="selectedOrder?.paymentmethod || '-'"></div>
          </div>
          <div>
            <label class="form-label">Status</label>
            <div class="text-sm" x-text="selectedOrder?.status || '-'"></div>
          </div>
          <div>
            <label class="form-label">Payment Status</label>
            <div class="text-sm" x-text="selectedOrder?.paymentstatus || '-'"></div>
          </div>
          <div x-show="selectedOrder?.items?.length > 0">
            <label class="form-label">Items</label>
            <div class="space-y-1">
              <template x-for="(item, i) in selectedOrder?.items" :key="i">
                <div class="text-xs bg-gray-50 dark:bg-gray-800 p-2 rounded-lg" x-text="(item.name || item.sku || 'Item') + ' x' + (item.quantity || 1)"></div>
              </template>
            </div>
          </div>
        </div>
        <div class="modal-footer-actions">
          <div class="flex w-full sm:w-auto gap-3 ml-auto">
            <button type="button" @click="closeDetail()" class="btn btn-outline w-full sm:w-auto">Close</button>
            <button type="button" @click="updateStatus(selectedOrder.id, 'processing')" class="btn btn-primary w-full sm:w-auto">Mark Processing</button>
            <button type="button" @click="updateStatus(selectedOrder.id, 'cancelled')" class="btn btn-danger w-full sm:w-auto">Cancel Order</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- END MODAL: ORDER DETAIL -->
</div>
