<div id="comic-detail-view" class="animate-fade-in" x-data="{ 
        comic: null,
        chapters: [],
        isLoading: true,

        init() {
            this.loadComic();
            // Pantau jika ID berubah (misal dari rekomendasi)
            this.$watch('params.id', () => this.loadComic());
        },

        async loadComic() {
            this.isLoading = true;
            const identifier = params.id || params.slug;
            
            if (!identifier) {
                this.isLoading = false;
                return;
            }

            const searchKey = identifier.toLowerCase();

            // Cari data komik utama dengan prioritas:
            // 1. Metadata Hand-off (Sangat penting saat reload)
            if (window._lastResolvedMeta && (
                String(window._lastResolvedMeta.title || '').toLowerCase() === searchKey ||
                String(window._lastResolvedMeta.id || '').toLowerCase() === searchKey ||
                String(window._lastResolvedMeta.slug || '').toLowerCase() === searchKey
            )) {
                this.comic = window._lastResolvedMeta;
            }

            // 2. Cari di array posts global (Jika Hand-off tidak tersedia)
            if (!this.comic) {
                this.comic = (window.posts || []).find(p => String(p.title || '').toLowerCase() === searchKey) ||
                             (window.posts || []).find(p => String(p.id || '').toLowerCase() === searchKey) ||
                             (window.posts || []).find(p => String(p.path || '').toLowerCase().includes(searchKey));
            }
            
            if (this.comic) {
                // Set sinopsis awal dari snippet
                this.comic.summary = this.comic.description || this.comic.snippet || 'Loading synopsis...';

                // 2. Strategi Deep Fetch (Mirip post-view.html)
                if (this.comic.path && (this.comic.summary.length < 100 || this.comic.summary === 'Loading synopsis...')) {
                    try {
                        const res = await fetch(this.comic.path);
                        if (res.ok) {
                            const html = await res.text();
                            if (window.app && typeof window.app.parseMetaFromHTML === 'function') {
                                const deepMeta = window.app.parseMetaFromHTML(html);
                                if (deepMeta && (deepMeta.description || deepMeta.body)) {
                                    this.comic.summary = deepMeta.description || deepMeta.body;
                                }
                            } else {
                                const doc = new DOMParser().parseFromString(html, 'text/html');
                                const bodyNode = doc.querySelector('.ezy-post-body') || doc.querySelector('.post-body') || doc.querySelector('.entry-content');
                                if (bodyNode) this.comic.summary = bodyNode.innerHTML;
                            }
                        }
                    } catch (e) { console.warn('Deep fetch synopsis failed', e); }
                }

                // Ekstrak Judul Seri secara cerdas
                let seriesTitle = this.comic.title.split(' - ')[0];
                if (seriesTitle.includes('-Chapter')) seriesTitle = seriesTitle.split('-Chapter')[0];
                else if (seriesTitle.includes(' Chapter')) seriesTitle = seriesTitle.split(' Chapter')[0];
                else if (seriesTitle.includes(' chapter')) seriesTitle = seriesTitle.split(' chapter')[0];
                seriesTitle = seriesTitle.trim();
                
                // Cari semua postingan yang memiliki judul seri yang sama
                const relatedPosts = (window.posts || []).filter(p => {
                    let pSeries = p.title.split(' - ')[0];
                    if (pSeries.includes('-Chapter')) pSeries = pSeries.split('-Chapter')[0];
                    else if (pSeries.includes(' Chapter')) pSeries = pSeries.split(' Chapter')[0];
                    else if (pSeries.includes(' chapter')) pSeries = pSeries.split(' chapter')[0];
                    return pSeries.trim() === seriesTitle;
                });

                // Map menjadi format chapter yang rapi (Hanya jika bukan postingan utama)
                this.chapters = relatedPosts
                    .filter(p => p.title !== seriesTitle)
                    .map(p => {
                        const chapterLabel = p.title.replace(seriesTitle, '').replace(/^[\s-]*|[\s-]*$/g, '').trim() || 'Chapter 1';
                        return {
                            id: chapterLabel.replace(/[^0-9]/g, '') || '1',
                            title: chapterLabel,
                            date: formatDate(p.publishdate),
                            url: p.path,
                            slug: p.slug
                        };
                    }).sort((a, b) => b.id - a.id);
            }
            
            setTimeout(() => { this.isLoading = false; }, 300);
        },
    }">

    <!-- Error State -->
    <template x-if="!isLoading && !comic">
        <div class="py-20 text-center">
            <div
                class="w-24 h-24 bg-gray-100 dark:bg-gray-800 rounded-full flex items-center justify-center mx-auto mb-6 text-gray-400">
                <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
                        stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
                </svg>
            </div>
            <h2 class="text-2xl font-black text-gray-900 dark:text-white mb-2">Comic Not Found</h2>
            <p class="text-gray-500 mb-8">Maaf, data komik tidak dapat ditemukan atau telah dihapus.</p>
            <a href="#!comic-list"
                class="inline-flex items-center gap-2 px-6 py-3 bg-brand-600 text-white rounded-xl font-bold hover:bg-brand-700 transition-all">
                Back to Collection
            </a>
        </div>
    </template>

    <!-- Loading State -->
    <div x-show="isLoading" class="py-20 text-center">
        <div class="inline-block w-12 h-12 border-4 border-brand-600/20 border-t-brand-600 rounded-full animate-spin">
        </div>
        <p class="mt-4 text-sm font-bold text-gray-500 uppercase tracking-widest">Loading Details...</p>
    </div>

    <!-- Main Content -->
    <template x-if="!isLoading && comic">
        <div class="space-y-8">
            <!-- Hero Header -->
            <div class="relative rounded-3xl overflow-hidden bg-gray-900 shadow-2xl shadow-black/30">
                <!-- Blurred Background Cover -->
                <div class="absolute inset-0 opacity-40 blur-2xl scale-110">
                    <img :src="comic.image" class="w-full h-full object-cover" />
                    <div class="absolute inset-0 bg-gradient-to-t from-gray-900 via-gray-900/60 to-transparent"></div>
                </div>

                <div class="relative z-10 p-6 md:p-10 flex flex-col md:flex-row gap-8 items-start md:items-end">
                    <!-- Cover Image -->
                    <div
                        class="w-48 md:w-64 flex-shrink-0 shadow-2xl shadow-black/50 rounded-2xl overflow-hidden transform md:-mb-16 ring-4 ring-white/10">
                        <img :src="comic.image" class="w-full aspect-[3/4] object-cover" />
                    </div>

                    <!-- Info Info -->
                    <div class="flex-1 text-white pb-4">
                        <div class="flex flex-wrap gap-2 mb-4">
                            <span
                                class="px-3 py-1 bg-brand-600 text-[10px] font-black uppercase rounded-full tracking-wider"
                                x-text="comic.status || 'Ongoing'"></span>
                            <span
                                class="px-3 py-1 bg-white/10 backdrop-blur-md text-[10px] font-black uppercase rounded-full tracking-wider"
                                x-text="comic.type || 'Manga'"></span>
                        </div>
                        <h1 class="text-3xl md:text-5xl font-black mb-4 tracking-tighter leading-none uppercase"
                            x-text="comic.title"></h1>

                        <div class="flex flex-wrap items-center gap-6 text-sm text-gray-300 font-medium italic">
                            <div class="flex items-center gap-2 text-yellow-400">
                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                                    <path
                                        d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                                </svg>
                                <span class="font-bold text-white not-italic">4.8</span>
                                <span>Rating</span>
                            </div>
                            <div>
                                <span class="font-bold text-white not-italic" x-text="comic.author || 'Unknown'"></span>
                                <span>Author</span>
                            </div>
                            <div>
                                <span class="font-bold text-white not-italic">1.2M</span>
                                <span>Views</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Content Body -->
            <div class="flex flex-col lg:flex-row gap-10 pt-4 md:pt-16">
                <!-- Main Info -->
                <div class="flex-1 space-y-10">
                    <!-- Actions -->
                    <div
                        class="flex flex-wrap gap-4 p-6 bg-white dark:bg-gray-900 rounded-3xl border border-gray-100 dark:border-gray-800 shadow-sm"
                        x-show="chapters.length > 0">
                        <button
                            @click="window.navigate('comic-view', { slug: chapters[chapters.length-1].slug, path: chapters[chapters.length-1].url })"
                            class="flex-1 min-w-[200px] bg-brand-600 text-white p-4 rounded-2xl font-black uppercase text-xs tracking-widest text-center hover:bg-brand-700 transition-all shadow-lg shadow-brand-600/20">
                            Read First Chapter
                        </button>
                        <button
                            @click="window.navigate('comic-view', { slug: chapters[0].slug, path: chapters[0].url })"
                            class="flex-1 min-w-[200px] bg-gray-100 dark:bg-gray-800 text-gray-900 dark:text-white p-4 rounded-2xl font-black uppercase text-xs tracking-widest text-center hover:bg-gray-200 dark:hover:bg-gray-700 transition-all">
                            Read Last Chapter
                        </button>
                    </div>

                    <!-- Synopsis -->
                    <section class="space-y-4">
                        <h3
                            class="text-xs font-black text-gray-900 dark:text-white uppercase tracking-widest flex items-center gap-2">
                            <span class="w-1 h-3 bg-brand-500 rounded-full"></span>
                            Synopsis
                        </h3>
                        <div class="bg-white dark:bg-gray-900 p-6 rounded-3xl border border-gray-100 dark:border-gray-800 leading-relaxed text-gray-600 dark:text-gray-400 text-sm italic shadow-sm"
                            x-html="comic.summary">
                        </div>
                    </section>

                    <!-- Chapter List -->
                    <section class="space-y-4">
                        <div class="flex justify-between items-center px-2">
                            <h3
                                class="text-xs font-black text-gray-900 dark:text-white uppercase tracking-widest flex items-center gap-2">
                                <span class="w-1 h-3 bg-brand-500 rounded-full"></span>
                                Chapters
                            </h3>
                            <span class="text-[10px] font-bold text-gray-400 uppercase"
                                x-text="chapters.length + ' Episodes'"></span>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <template x-for="ch in chapters" :key="ch.id">
                                <button
                                    @click="window.navigate('comic-view', { slug: ch.slug, path: ch.url })"
                                    class="group w-full flex items-center justify-between p-4 bg-white dark:bg-gray-900 rounded-2xl border border-gray-100 dark:border-gray-800 hover:border-brand-500 hover:shadow-lg hover:shadow-brand-500/5 transition-all text-left">
                                    <div class="flex items-center gap-4">
                                        <div class="w-10 h-10 rounded-xl bg-gray-50 dark:bg-gray-800 flex items-center justify-center text-xs font-black text-gray-400 group-hover:text-brand-600 transition-colors"
                                            x-text="'#' + ch.id"></div>
                                        <span
                                            class="text-sm font-bold text-gray-700 dark:text-gray-300 group-hover:text-gray-900 dark:group-hover:text-white"
                                            x-text="ch.title"></span>
                                    </div>
                                    <span class="text-[10px] font-medium text-gray-400 italic" x-text="ch.date"></span>
                                </button>
                            </template>
                        </div>
                    </section>
                </div>

                <!-- Sidebar Metadata -->
                <aside class="w-full lg:w-80 space-y-8">
                    <div
                        class="bg-white dark:bg-gray-900 rounded-3xl p-6 border border-gray-100 dark:border-gray-800 shadow-sm">
                        <h3
                            class="text-xs font-black text-gray-900 dark:text-white uppercase tracking-widest mb-6 flex items-center gap-2">
                            <span class="w-1 h-3 bg-brand-500 rounded-full"></span>
                            Information
                        </h3>

                        <div class="space-y-5">
                            <div class="flex justify-between text-xs border-b border-gray-50 dark:border-gray-800 pb-3">
                                <span class="font-bold text-gray-400 uppercase tracking-tighter">Status</span>
                                <span class="font-black text-brand-600 uppercase"
                                    x-text="comic.status || 'Ongoing'"></span>
                            </div>
                            <div class="flex justify-between text-xs border-b border-gray-50 dark:border-gray-800 pb-3">
                                <span class="font-bold text-gray-400 uppercase tracking-tighter">Type</span>
                                <span class="font-black text-gray-700 dark:text-gray-300 uppercase">Manga</span>
                            </div>
                            <div class="flex justify-between text-xs border-b border-gray-50 dark:border-gray-800 pb-3">
                                <span class="font-bold text-gray-400 uppercase tracking-tighter">Released</span>
                                <span class="font-black text-gray-700 dark:text-gray-300 uppercase">2023</span>
                            </div>
                            <div class="flex justify-between text-xs border-b border-gray-50 dark:border-gray-800 pb-3">
                                <span class="font-bold text-gray-400 uppercase tracking-tighter">Last Update</span>
                                <span class="font-black text-gray-700 dark:text-gray-300 uppercase">Today</span>
                            </div>
                        </div>

                        <!-- Genre Tags -->
                        <div class="mt-8">
                            <span
                                class="text-[10px] font-black text-gray-400 uppercase tracking-widest block mb-4">Genres</span>
                            <div class="flex flex-wrap gap-2">
                                <template x-for="tag in (comic.tags || '').split(',')" :key="tag">
                                    <template x-if="tag.trim()">
                                        <a href="#"
                                            class="px-3 py-1.5 bg-gray-50 dark:bg-gray-800 rounded-lg text-[10px] font-bold text-gray-600 dark:text-gray-400 hover:bg-brand-500 hover:text-white transition-all uppercase tracking-wider"
                                            x-text="tag.trim()"></a>
                                    </template>
                                </template>
                            </div>
                        </div>
                    </div>

                    <!-- Ad Space or Recommendation Mini -->
                    <div class="bg-brand-600 rounded-3xl p-6 text-white overflow-hidden relative group">
                        <div class="absolute -right-4 -bottom-4 opacity-10 group-hover:scale-110 transition-transform">
                            <svg class="w-32 h-32" fill="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                            </svg>
                        </div>
                        <h4 class="text-sm font-black uppercase tracking-widest mb-2">Support Us</h4>
                        <p class="text-xs text-brand-100 mb-4 leading-relaxed font-medium">Bantu kami tetap hidup dengan
                            membagikan komik ini ke teman-temanmu!</p>
                        <button
                            class="w-full bg-white text-brand-600 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest shadow-xl">Share
                            Series</button>
                    </div>
                </aside>
            </div>
        </div>
    </template>
</div>
