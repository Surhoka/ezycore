<div x-data="{
    formData: {
        webappUrl: localStorage.getItem('EzycoreConfig_' + (window.EZY_BLOG_ID || '')) ? JSON.parse(localStorage.getItem('EzycoreConfig_' + (window.EZY_BLOG_ID || ''))).webappUrl : '',
        blogId: window.EZY_BLOG_ID || (localStorage.getItem('EzycoreConfig') ? JSON.parse(localStorage.getItem('EzycoreConfig')).blogId : ''),
        email: localStorage.getItem('signedInUser_' + (window.EZY_BLOG_ID || '')) ? JSON.parse(localStorage.getItem('signedInUser_' + (window.EZY_BLOG_ID || ''))).email : '',
        dbName: localStorage.getItem('EzycoreConfig_' + (window.EZY_BLOG_ID || '')) 
                ? (JSON.parse(localStorage.getItem('EzycoreConfig_' + (window.EZY_BLOG_ID || ''))).dbName || '') 
                : '',
        dbSetup: 'use_existing' // Default: Gunakan data yang sudah ada
    },
    isSubmitting: false,
    isSearching: false,
    message: 'Menunggu respon...',

    init() {
        // Otomatis mencari database saat URL WebApp ditempelkan
        this.$watch('formData.webappUrl', value => {
            if (value && value.startsWith('https://script.google.com/macros/s/') && value.endsWith('/exec')) {
                this.discoverDatabase();
            }
        });
    },

    async discoverDatabase() {
        if (!this.formData.webappUrl || !this.formData.webappUrl.startsWith('http')) {
            window.showToast('Harap isi Google Web App URL terlebih dahulu.', 'warning');
            return;
        }

        this.isSearching = true;
        console.log('[EzyCore Debug] Discovering database for BlogID:', this.formData.blogId);
        
        window.sendDataToGoogle('get_config', { 
            blogId: this.formData.blogId,
            email: this.formData.email 
        }, (response) => {
            console.log('[EzyCore Debug] Response received from server:', response);
            
            if (response.status === 'success' && (response.dbId || response.dbName)) {
                // Database ditemukan secara fisik di Drive
                this.formData.dbName = response.dbName || this.formData.dbName;
                this.formData.email = response.email || this.formData.email;
                window.showToast('Database ditemukan di Drive: ' + (response.dbName || 'DB Terdeteksi'), 'success');
            } else if (response.status === 'success') {
                window.showToast('Sistem siap. Silakan tentukan nama database baru.', 'info');
            } else {
                window.showToast('Tidak ditemukan database lama. Masukkan nama manual atau biarkan sistem membuat baru.', 'info');
            }
            this.isSearching = false;
        }, (err) => {
            window.showToast('Gagal terhubung ke Drive.', 'error');
            this.isSearching = false;
        }, this.formData.webappUrl);
    },

    pollSetupStatus() {
        const check = () => {
            if (!this.isSubmitting) return;

            window.sendDataToGoogle('get_setup_status', { 
                blogId: this.formData.blogId 
            }, (res) => {
                // Jika sukses atau DB ID sudah muncul, anggap selesai
                if (res.setupStatus === 'COMPLETED' || (res.dbId && res.dbId.length > 5)) {
                    this.message = 'Setup Selesai!';
                    window.showToast('Sistem berhasil dikonfigurasi!', 'success');
                    
                    // Simpan DB ID terbaru ke form jika ada
                    if (res.dbId) this.formData.dbName = res.dbName || this.formData.dbName;

                    // Finalisasi status di global app
                    if (window.app && typeof window.app.checkInitialSetup === 'function') {
                        window.app.checkInitialSetup().then(() => {
                            setTimeout(() => { window.location.hash = '#dashboard'; }, 1000);
                        });
                    } else {
                        setTimeout(() => { window.location.hash = '#dashboard'; }, 1500);
                    }
                } else if (res.setupStatus === 'ERROR' || res.status === 'error') {
                    this.message = 'Gagal: ' + (res.errorMessage || res.message || 'Unknown Error');
                    window.showToast(this.message, 'error');
                    this.isSubmitting = false;
                } else {
                    // Masih IN_PROGRESS atau status lainnya (IDLE dsb)
                    this.message = res.statusMessage || 'Server sedang menyiapkan database...';
                    
                    // Tambahkan status teknis untuk debug jika statusMessage kosong
                    if (!res.statusMessage && res.setupStatus) {
                        this.message = `Status: ${res.setupStatus}...`;
                    }
                    setTimeout(check, 3000); // Cek lagi setelah 3 detik
                }
            }, (err) => {
                console.warn('Polling error, retrying...', err);
                this.message = 'Koneksi terganggu, mencoba kembali...';
                setTimeout(check, 5000);
            }, this.formData.webappUrl);
        };
        check();
    },

    async saveSetup() {
        if (!this.formData.webappUrl || !this.formData.blogId || !this.formData.email) {
            window.showToast('Semua field harus diisi!', 'error');
            return;
        }

        this.isSubmitting = true;
        this.message = 'Mengirim instruksi setup...';
        
        try {
            // Simpan ke LocalStorage untuk EzyCoreAi
            const config = {
                webappUrl: this.formData.webappUrl,
                blogId: this.formData.blogId,
                role: 'Admin',
                setupDate: new Date().toISOString()
            };
            
            localStorage.setItem('EzycoreConfig_' + this.formData.blogId, JSON.stringify(config));
            window.appsScriptUrl = this.formData.webappUrl;

            // Menjalankan inisialisasi database di Apps Script
            window.sendDataToGoogle('setup', { 
                blogId: this.formData.blogId, 
                email: this.formData.email,
                dbName: this.formData.dbName,
                dbSetup: this.formData.dbSetup, 
                role: 'Admin'
            }, 
            async (response) => {
                if (response.status === 'success') {
                    window.showToast('Setup backend dimulai...', 'info');
                    this.pollSetupStatus(); // Mulai polling status
                } else {
                    window.showToast('Backend Error: ' + (response.message || 'Cek WebApp URL'), 'error');
                    this.isSubmitting = false;
                }
            }, (err) => {
                window.showToast('Terjadi kesalahan jaringan atau URL tidak valid.', 'error');
                this.isSubmitting = false;
            }, this.formData.webappUrl);

        } catch (e) {
            console.error(e);
            window.showToast('Gagal menyimpan konfigurasi.', 'error');
            this.isSubmitting = false;
        }
    }
}" class="w-full flex items-center justify-center p-4">
    <div class="auth-card max-w-lg">
        <!-- Header -->
        <div class="p-8 border-b border-theme-primary bg-brand-500/5">
            <div class="flex items-center gap-4 mb-4">
                <div class="p-3 bg-brand-500 rounded-xl text-white">
                    <span class="w-8 h-8 block" x-icon="'settings'"></span>
                </div>
                <div class="min-w-0">
                    <h2 class="text-2xl font-bold text-theme-text">System Setup</h2>
                    <p class="text-theme-text-sub text-sm">Konfigurasi EzyCore Framework</p>
                </div>
            </div>
        </div>

        <!-- Form Content -->
        <div class="p-8 space-y-6">
            <!-- WebApp URL -->
            <div>
                <label class="block text-sm font-semibold mb-2 text-theme-text">Google Web App URL</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" x-icon="'link'"></span>
                    <input type="url" x-model="formData.webappUrl"
                        placeholder="https://script.google.com/macros/s/.../exec" class="auth-input">
                </div>
                <p class="mt-1 text-xs text-gray-500">URL dari Deployment Google Apps Script Anda.</p>
            </div>

            <!-- Database Name -->
            <div>
                <label class="block text-sm font-semibold mb-2 text-theme-text">Database Name</label>
                <div class="flex gap-2">
                    <div class="relative flex-1">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"
                            x-icon="'file-text'"></span>
                        <input type="text" x-model="formData.dbName" placeholder="Contoh: EzyCore_Database"
                            class="auth-input">
                    </div>
                    <button @click="discoverDatabase()" :disabled="isSearching || !formData.webappUrl"
                        class="px-4 bg-theme-secondary border border-theme-border rounded-xl text-theme-text hover:bg-theme-primary transition-all disabled:opacity-50 flex items-center gap-2"
                        title="Cari database di Drive">
                        <template x-if="!isSearching">
                            <span class="w-5 h-5" x-icon="'search'"></span>
                        </template>
                        <template x-if="isSearching">
                            <div
                                class="w-4 h-4 border-2 border-brand-500/30 border-t-brand-500 rounded-full animate-spin">
                            </div>
                        </template>
                    </button>
                </div>
            </div>

            <!-- Setup Mode -->
            <div class="p-4 rounded-xl bg-theme-primary border border-theme-border">
                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" x-model="formData.dbSetup" x-bind:true-value="'force_new'"
                        x-bind:false-value="'use_existing'"
                        class="w-5 h-5 rounded border-theme-border text-brand-500 focus:ring-brand-500">
                    <span class="text-sm font-medium text-theme-text">Reset / Buat Database Baru</span>
                </label>
                <p class="mt-2 text-xs text-theme-text-sub">Biarkan tidak tercentang jika Anda ingin menghubungkan
                    kembali ke data yang sudah ada di Google Drive.</p>
            </div>

            <!-- Blog ID -->
            <div>
                <label class="block text-sm font-semibold mb-2 text-theme-text">Blogger Blog ID</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"
                        x-icon="'database'"></span>
                    <input type="text" x-model="formData.blogId" placeholder="Masukkan ID Blog Anda" class="auth-input">
                </div>
            </div>

            <!-- Admin Email -->
            <div>
                <label class="block text-sm font-semibold mb-2 text-theme-text">Admin Email</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" x-icon="'user'"></span>
                    <input type="email" x-model="formData.email" placeholder="admin@gmail.com" class="auth-input">
                </div>
            </div>

            <!-- Submit Button -->
            <button @click="saveSetup()" :disabled="isSubmitting"
                class="w-full bg-brand-500 hover:bg-brand-600 disabled:bg-brand-300 text-white font-bold py-4 rounded-xl shadow-lg shadow-brand-500/20 transition-all active:scale-[0.98] flex flex-col items-center justify-center gap-1">
                <template x-if="!isSubmitting"><span>Simpan & Hubungkan</span></template>
                <template x-if="isSubmitting">
                    <div class="flex flex-col items-center gap-2">
                        <div class="w-6 h-6 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                        <span class="text-xs font-normal opacity-90 animate-pulse" x-text="message"></span>
                    </div>
                </template>
            </button>
        </div>
    </div>
</div>
