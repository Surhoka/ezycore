<div x-data="ecommerceAlbums" class="w-full px-1 sm:px-0">

  <div class="rounded-2xl border border-primary bg-secondary relative min-h-[500px] shadow-sm overflow-hidden">
    <!-- Loading Overlay -->
    <div x-show="isLoading" x-cloak
      class="absolute inset-0 z-10 flex items-center justify-center bg-secondary/80 backdrop-blur-sm rounded-lg">
      <svg class="h-8 w-8 animate-spin text-brand-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
      </svg>
    </div>

    <div x-show="!isLoading" class="p-4 md:p-6 transition-opacity duration-500" :class="isLoading ? 'opacity-0' : 'opacity-100'">
      <!-- Album List -->
      <template x-if="!currentAlbum || !currentAlbum.id">
        <div>
          <div class="flex items-center justify-between mb-6">
            <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">Albums</h3>
            <button @click="openAddAlbum()" class="px-4 py-2 text-sm font-medium text-white bg-brand-500 rounded-lg hover:bg-brand-600">Add Album</button>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <template x-if="albums.length === 0">
              <p class="text-sm text-gray-500 col-span-full">No albums yet.</p>
            </template>
            <template x-for="album in albums" :key="album.id">
              <div class="rounded-2xl border border-gray-200 bg-white p-4 dark:border-gray-800 dark:bg-white/[0.03] cursor-pointer hover:shadow-md transition-shadow" @click="selectAlbum(album)">
                <h4 class="font-semibold text-gray-800 dark:text-white/90" x-text="album.name || album.slug"></h4>
                <p class="text-xs text-gray-500 mt-1" x-text="album.description || 'No description'"></p>
                <p class="text-xs text-gray-400 mt-2">Sort: <span x-text="album.sortorder || 0"></span></p>
                <div class="flex gap-2 mt-3">
                  <button @click.stop="openEditAlbum(album)" class="text-xs text-brand-500 font-medium">Edit</button>
                  <button @click.stop="deleteAlbum(album.id)" class="text-xs text-red-500 font-medium">Delete</button>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- Album Detail -->
      <template x-if="currentAlbum && currentAlbum.id">
        <div>
          <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-3">
              <button @click="backToAlbums()" class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">&larr; Back</button>
              <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90" x-text="currentAlbum.name"></h3>
            </div>
            <div class="flex gap-2">
              <button @click="syncMetadata()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-800 dark:text-white/90">Sync Metadata</button>
              <button @click="openAddImage()" class="px-4 py-2 text-sm font-medium text-white bg-brand-500 rounded-lg hover:bg-brand-600">Add Image</button>
            </div>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <template x-if="images.length === 0">
              <p class="text-sm text-gray-500 col-span-full">No images in this album. Add URLs or sync from Blogger.</p>
            </template>
            <template x-for="img in images" :key="img.id">
              <div class="rounded-xl border border-gray-200 bg-white p-2 dark:border-gray-800 dark:bg-white/[0.03] group relative">
                <img :src="img.thumbnailurl || img.fileurl" class="w-full h-28 object-cover rounded-lg">
                <p class="text-xs text-gray-500 mt-1 truncate" x-text="img.filename || 'image'"></p>
                <button @click="deleteImage(img.id)" class="absolute top-1 right-1 w-6 h-6 bg-red-500 text-white rounded-full text-xs hidden group-hover:flex items-center justify-center">&times;</button>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- BEGIN MODAL: ALBUM FORM -->
  <div :class="{ 'show': showForm }" x-cloak
    class="modal fixed inset-0 p-4 md:p-5 overflow-hidden flex justify-center items-center isolate z-[99999]">
    <div @click="closeForm()" class="fixed inset-0 h-full w-full bg-gray-900/40 transition-opacity duration-300"></div>
    <div class="modal-dialog">
      <button @click="closeForm()" class="modal-close-btn">
        <span class="w-6 h-6 block" x-icon="'close'"></span>
      </button>
      <div class="modal-content">
        <div class="modal-header-sticky">
          <h3 class="h3" x-text="editingAlbum && editingAlbum.id ? 'Edit Album' : 'Add Album'"></h3>
          <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">Manage your album collection.</p>
        </div>
        <div class="modal-body-content custom-scrollbar">
          <div>
            <label class="form-label">Name</label>
            <input type="text" x-model="editingAlbum.name" class="form-input" placeholder="Enter album name" />
          </div>
          <div>
            <label class="form-label">Description</label>
            <textarea x-model="editingAlbum.description" rows="3" class="form-input" placeholder="Enter album description"></textarea>
          </div>
          <div>
            <label class="form-label">Parent ID</label>
            <input type="text" x-model="editingAlbum.parentId" class="form-input" placeholder="Optional parent album ID" />
          </div>
          <div>
            <label class="form-label">Sort Order</label>
            <input type="number" x-model="editingAlbum.sortOrder" class="form-input" />
          </div>
          <div class="pt-2">
            <label class="flex items-center">
              <input type="checkbox" x-model="editingAlbum.active"
                class="form-checkbox h-4 w-4 rounded border-gray-300 text-brand-500 focus:ring-brand-500/50">
              <span class="ml-2 text-sm font-medium text-gray-700 dark:text-gray-400">Active</span>
            </label>
          </div>
        </div>
        <div class="modal-footer-actions">
          <div class="flex w-full sm:w-auto gap-3 ml-auto">
            <button type="button" @click="closeForm()" class="btn btn-outline w-full sm:w-auto">Cancel</button>
            <button type="button" @click="saveAlbum()" class="btn btn-primary w-full sm:w-auto">Save Album</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- END MODAL: ALBUM FORM -->

  <!-- BEGIN MODAL: IMAGE FORM -->
  <div :class="{ 'show': showImageForm }" x-cloak
    class="modal fixed inset-0 p-4 md:p-5 overflow-hidden flex justify-center items-center isolate z-[99999]">
    <div @click="closeImageForm()" class="fixed inset-0 h-full w-full bg-gray-900/40 transition-opacity duration-300"></div>
    <div class="modal-dialog">
      <button @click="closeImageForm()" class="modal-close-btn">
        <span class="w-6 h-6 block" x-icon="'close'"></span>
      </button>
      <div class="modal-content">
        <div class="modal-header-sticky">
          <h3 class="h3">Add Image</h3>
          <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">Add a new image to this album.</p>
        </div>
        <div class="modal-body-content custom-scrollbar">
          <div>
            <label class="form-label">File URL</label>
            <input type="text" x-model="editingImage.fileUrl" class="form-input" placeholder="https://blogger.googleusercontent.com/..." />
          </div>
          <div>
            <label class="form-label">File Name</label>
            <input type="text" x-model="editingImage.fileName" class="form-input" placeholder="e.g. sunset-photo.jpg" />
          </div>
          <div>
            <label class="form-label">Content Type</label>
            <select x-model="editingImage.contentType" class="form-input">
              <option value="image">Image</option>
              <option value="youtube">YouTube Video</option>
              <option value="drive">Google Drive Video</option>
              <option value="blogger_video">Blogger Video</option>
            </select>
          </div>
          <div>
            <label class="form-label">Thumbnail URL</label>
            <input type="text" x-model="editingImage.thumbnailUrl" class="form-input" placeholder="Optional thumbnail URL" />
          </div>
        </div>
        <div class="modal-footer-actions">
          <div class="flex w-full sm:w-auto gap-3 ml-auto">
            <button type="button" @click="closeImageForm()" class="btn btn-outline w-full sm:w-auto">Cancel</button>
            <button type="button" @click="saveImage()" class="btn btn-primary w-full sm:w-auto">Save Image</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- END MODAL: IMAGE FORM -->
</div>
