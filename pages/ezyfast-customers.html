<div x-data="ezyfastCustomers" class="w-full px-1 sm:px-0">

  <div class="rounded-2xl border border-primary bg-secondary relative min-h-[500px] shadow-sm overflow-hidden">
    <!-- Loading Overlay -->
    <div x-show="loading" x-cloak
      class="absolute inset-0 z-10 flex items-center justify-center bg-secondary/80 backdrop-blur-sm rounded-lg">
      <svg class="h-8 w-8 animate-spin text-brand-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
      </svg>
    </div>

    <div x-show="!loading" class="p-4 md:p-6 transition-opacity duration-500">
      <div class="flex items-center justify-between mb-6">
        <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">Pelanggan</h3>
        <div class="relative">
          <input type="text" x-model="searchQuery" placeholder="Cari nama, email, telepon..."
            class="h-10 w-full sm:w-64 rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-none focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90">
        </div>
      </div>

      <div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03] overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-800/50">
                <th class="text-left py-3 px-4 font-medium text-gray-500">Nama</th>
                <th class="text-left py-3 px-4 font-medium text-gray-500">Email</th>
                <th class="text-left py-3 px-4 font-medium text-gray-500">Telepon</th>
                <th class="text-left py-3 px-4 font-medium text-gray-500">Total Order</th>
                <th class="text-left py-3 px-4 font-medium text-gray-500">Total Belanja</th>
                <th class="text-left py-3 px-4 font-medium text-gray-500">Bergabung</th>
              </tr>
            </thead>
            <tbody>
              <template x-if="filteredCustomers.length === 0">
                <tr><td colspan="6" class="py-8 text-center text-gray-500">Belum ada pelanggan.</td></tr>
              </template>
              <template x-for="customer in filteredCustomers" :key="customer.id">
                <tr class="border-b border-gray-50 dark:border-gray-800/50 hover:bg-gray-50 dark:hover:bg-gray-800/30">
                  <td class="py-3 px-4 font-medium text-gray-800 dark:text-white/90" x-text="customer.name || '-'"></td>
                  <td class="py-3 px-4 text-gray-600 dark:text-gray-400" x-text="customer.email || '-'"></td>
                  <td class="py-3 px-4 text-gray-600 dark:text-gray-400" x-text="customer.phone || '-'"></td>
                  <td class="py-3 px-4 text-gray-800 dark:text-white/90" x-text="customer.totalorders || 0"></td>
                  <td class="py-3 px-4 text-gray-800 dark:text-white/90" x-text="formatCurrency(customer.totalspent)"></td>
                  <td class="py-3 px-4 text-xs text-gray-500" x-text="customer.createdat ? new Date(customer.createdat).toLocaleDateString('id-ID') : '-'"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

</div>
