<div x-data="ecommerceReports" id="ecommerce-reports-container" class="w-full animate-fade-in">
  <div x-show="isLoading" class="text-center p-10">Loading report...</div>
  <div x-show="!isLoading" x-transition>
    <div class="flex items-center justify-between mb-6">
      <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">Sales Report</h3>
      <div class="flex gap-2">
        <button @click="period = 'today'; loadReport()" class="px-3 py-1.5 text-xs font-medium rounded-lg" :class="period === 'today' ? 'bg-brand-500 text-white' : 'bg-gray-100 text-gray-600 dark:bg-gray-800 dark:text-gray-400'">Today</button>
        <button @click="period = 'month'; loadReport()" class="px-3 py-1.5 text-xs font-medium rounded-lg" :class="period === 'month' ? 'bg-brand-500 text-white' : 'bg-gray-100 text-gray-600 dark:bg-gray-800 dark:text-gray-400'">This Month</button>
        <button @click="period = 'all'; loadReport()" class="px-3 py-1.5 text-xs font-medium rounded-lg" :class="period === 'all' ? 'bg-brand-500 text-white' : 'bg-gray-100 text-gray-600 dark:bg-gray-800 dark:text-gray-400'">All Time</button>
      </div>
    </div>

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-3 mb-6" x-show="report">
      <div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03]">
        <p class="text-sm text-gray-500 dark:text-gray-400">Total Orders</p>
        <p class="text-2xl font-bold text-gray-800 dark:text-white/90 mt-1" x-text="report.totalOrders"></p>
      </div>
      <div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03]">
        <p class="text-sm text-gray-500 dark:text-gray-400">Paid Orders</p>
        <p class="text-2xl font-bold text-green-600 mt-1" x-text="report.paidOrders"></p>
      </div>
      <div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03]">
        <p class="text-sm text-gray-500 dark:text-gray-400">Revenue</p>
        <p class="text-2xl font-bold text-gray-800 dark:text-white/90 mt-1" x-text="'Rp ' + Number(report.totalRevenue).toLocaleString()"></p>
      </div>
    </div>

    <div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03] overflow-hidden">
      <div class="px-5 py-4 border-b border-gray-100 dark:border-gray-800">
        <h4 class="text-sm font-semibold text-gray-800 dark:text-white/90">Order List</h4>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm" x-show="report && report.orders && report.orders.length > 0">
          <thead>
            <tr class="border-b border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-800/50">
              <th class="text-left py-3 px-4 font-medium text-gray-500">Order</th>
              <th class="text-left py-3 px-4 font-medium text-gray-500">Customer</th>
              <th class="text-left py-3 px-4 font-medium text-gray-500">Total</th>
              <th class="text-left py-3 px-4 font-medium text-gray-500">Payment</th>
              <th class="text-left py-3 px-4 font-medium text-gray-500">Date</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="order in report.orders" :key="order.id">
              <tr class="border-b border-gray-50 dark:border-gray-800/50">
                <td class="py-3 px-4 font-mono text-xs" x-text="order.id"></td>
                <td class="py-3 px-4" x-text="order.customername || '-'"></td>
                <td class="py-3 px-4" x-text="'Rp ' + Number(order.total || 0).toLocaleString()"></td>
                <td class="py-3 px-4">
                  <span class="px-2 py-1 text-xs rounded-full"
                    :class="order.paymentstatus === 'paid' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'"
                    x-text="order.paymentstatus || 'pending'"></span>
                </td>
                <td class="py-3 px-4 text-xs text-gray-500" x-text="order.createdat ? new Date(order.createdat).toLocaleDateString() : '-'"></td>
              </tr>
            </template>
          </tbody>
        </table>
        <p x-show="report && report.orders && report.orders.length === 0" class="py-8 text-center text-gray-500">No orders in this period.</p>
      </div>
    </div>
  </div>
</div>
