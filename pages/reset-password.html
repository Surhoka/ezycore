<style>
    [x-icon] svg {
        width: 100%;
        height: auto;
        display: block;
    }
</style>

<div x-data="{
    email: '',
    isSubmitting: false,

    async requestReset() {
        if (!this.email) {
            window.showToast('Masukkan email Anda!', 'error');
            return;
        }

        if (typeof firebase === 'undefined' || !firebase.apps.length) {
            window.showToast('Firebase not configured.', 'error');
            return;
        }

        this.isSubmitting = true;

        try {
            await firebase.auth().sendPasswordResetEmail(this.email);
            window.showToast('Password reset link has been sent to your email.', 'success');
            this.isSubmitting = false;
            this.email = '';
        } catch (e) {
            var msg = 'Failed to send reset email.';
            if (e.code === 'auth/user-not-found') msg = 'Email is not registered.';
            else if (e.code === 'auth/invalid-email') msg = 'Invalid email format.';
            else if (e.code === 'auth/too-many-requests') msg = 'Too many requests. Try again later.';
            else msg = e.message || 'Failed to send reset email.';
            window.showToast(msg, 'error');
            this.isSubmitting = false;
        }
    }
}" class="auth-card max-w-md animate-slide-up">
    <div class="p-8 flex flex-col justify-center">
        <div class="mb-4 2xl:mb-8">
            <a href="/"
                class="inline-flex items-center text-sm text-gray-500 transition-colors hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300">
                <span class="w-5 h-5 mr-2" x-icon="'arrow-left'"></span>
                <span>Back to dashboard</span>
            </a>
        </div>

        <div class="mb-4 2xl:mb-6">
            <h1 class="mb-2 text-2xl font-bold text-gray-800 dark:text-white">Forgot Password</h1>
            <p class="text-gray-500 dark:text-gray-400">Enter your email to receive a password reset link.</p>
        </div>

        <form @submit.prevent="requestReset()">
            <div class="space-y-4 2xl:space-y-5">
                <div>
                    <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">
                        Email<span class="text-error-500">*</span>
                    </label>
                    <input type="email" x-model="email" placeholder="admin@email.com" required
                        class="w-full h-11 rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-sm placeholder:text-gray-400 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 dark:border-gray-700 dark:bg-gray-900/50 dark:text-white dark:placeholder:text-white/30 dark:focus:border-brand-500" />
                </div>

                <div>
                    <button type="submit" :disabled="isSubmitting"
                        class="flex items-center justify-center w-full px-4 py-3 text-sm font-bold text-white transition rounded-lg bg-brand-500 shadow-theme-xs hover:bg-brand-600 focus:outline-none focus:ring-2 focus:ring-brand-500/20">
                        <template x-if="!isSubmitting">
                            <span>Send Reset Link</span>
                        </template>
                        <template x-if="isSubmitting">
                            <svg class="w-6 h-6 animate-spin text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
                                viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                                    stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor"
                                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                </path>
                            </svg>
                        </template>
                    </button>
                </div>
            </div>
        </form>

        <div class="mt-4 2xl:mt-5">
            <p class="text-sm font-normal text-center text-gray-700 dark:text-gray-400 sm:text-start">
                <a href="#signin" class="text-brand-500 hover:text-brand-600 dark:text-brand-400 font-medium">Back to
                    Sign In</a>
            </p>
        </div>
    </div>
</div>

<div class="fixed z-50 flex items-center gap-3 max-sm:hidden top-6 right-6">
    <button
        class="inline-flex items-center justify-center text-white transition-colors rounded-full size-10 bg-brand-500 hover:bg-brand-600"
        @click.prevent="darkMode = !darkMode">
        <span class="w-5 h-5" x-icon="'moon'" x-show="darkMode"></span>
        <span class="w-5 h-5" x-icon="'sun'" x-show="!darkMode"></span>
    </button>
</div>
