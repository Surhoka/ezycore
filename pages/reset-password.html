<style>
    [x-icon] svg {
        width: 100%;
        height: auto;
        display: block;
    }
</style>

<div x-data="{
    mode: 'request',
    token: '',
    formData: {
        email: '',
        password: '',
        confirmPassword: ''
    },
    isSubmitting: false,
    message: '',

    init() {
        const hash = window.location.hash;
        const state = window.decodeState(hash);
        this.token = (state && state.params && state.params.token) || '';
        this.mode = this.token ? 'reset' : 'request';
    },

    async requestReset() {
        if (!this.formData.email) {
            window.showToast('Masukkan email Anda!', 'error');
            return;
        }
        this.isSubmitting = true;
        this.message = 'Mengirim link reset...';

        const adminUrl = window.location.href.split('#')[0];
        window.sendDataToGoogle('requestPasswordReset', { email: this.formData.email, adminUrl: adminUrl }, (response) => {
            this.isSubmitting = false;
            if (response.status === 'success') {
                window.showToast('Link reset telah dikirim ke email Anda.', 'success');
                this.message = '';
                this.formData.email = '';
            } else {
                window.showToast(response.message || 'Gagal mengirim link reset.', 'error');
                this.message = '';
            }
        }, (err) => {
            this.isSubmitting = false;
            window.showToast('Kesalahan jaringan.', 'error');
            this.message = '';
        });
    },

    async doReset() {
        if (!this.formData.password || !this.formData.confirmPassword) {
            window.showToast('Lengkapi password dan konfirmasi!', 'error');
            return;
        }
        if (this.formData.password !== this.formData.confirmPassword) {
            window.showToast('Konfirmasi password tidak cocok!', 'error');
            return;
        }
        if (this.formData.password.length < 6) {
            window.showToast('Password minimal 6 karakter!', 'error');
            return;
        }
        this.isSubmitting = true;
        this.message = 'Mereset password...';

        window.sendDataToGoogle('resetPassword', { token: this.token, password: this.formData.password }, (response) => {
            this.isSubmitting = false;
            if (response.status === 'success') {
                window.showToast('Password berhasil direset! Silakan login.', 'success');
                this.message = '';
                this.formData = { email: '', password: '', confirmPassword: '' };
                setTimeout(() => {
                    window.location.hash = '#signin';
                }, 1500);
            } else {
                window.showToast(response.message || 'Gagal reset password.', 'error');
                this.message = '';
            }
        }, (err) => {
            this.isSubmitting = false;
            window.showToast('Kesalahan jaringan.', 'error');
            this.message = '';
        });
    }
}" class="auth-card max-w-md animate-slide-up">
    <div class="p-8 flex flex-col justify-center">
        <div class="mb-4 2xl:mb-8">
            <a href="/"
                class="inline-flex items-center text-sm text-gray-500 transition-colors hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300">
                <span class="w-5 h-5 mr-2" x-icon="'arrow-left'"></span>
                <span>Back to dashboard</span>
            </a>
        </div>

        <!-- Request Mode -->
        <template x-if="mode === 'request'">
            <div>
                <div class="mb-4 2xl:mb-6">
                    <h1 class="mb-2 text-2xl font-bold text-gray-800 dark:text-white">Lupa Password</h1>
                    <p class="text-gray-500 dark:text-gray-400">Masukkan email Anda untuk menerima link reset password.</p>
                </div>

                <form @submit.prevent="requestReset()">
                    <div class="space-y-4 2xl:space-y-5">
                        <div>
                            <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">
                                Email<span class="text-error-500">*</span>
                            </label>
                            <input type="email" x-model="formData.email" placeholder="admin@email.com" required
                                class="w-full h-11 rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-sm placeholder:text-gray-400 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 dark:border-gray-700 dark:bg-gray-900/50 dark:text-white dark:placeholder:text-white/30 dark:focus:border-brand-500" />
                        </div>

                        <div>
                            <button type="submit" :disabled="isSubmitting"
                                class="flex items-center justify-center w-full px-4 py-3 text-sm font-bold text-white transition rounded-lg bg-brand-500 shadow-theme-xs hover:bg-brand-600 focus:outline-none focus:ring-2 focus:ring-brand-500/20">
                                <template x-if="!isSubmitting">
                                    <span>Kirim Link Reset</span>
                                </template>
                                <template x-if="isSubmitting">
                                    <svg class="w-6 h-6 animate-spin text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                    </svg>
                                </template>
                            </button>
                        </div>
                    </div>
                </form>

                <div class="mt-4 2xl:mt-5">
                    <p class="text-sm font-normal text-center text-gray-700 dark:text-gray-400 sm:text-start">
                        <a href="#signin" class="text-brand-500 hover:text-brand-600 dark:text-brand-400 font-medium">Kembali ke Login</a>
                    </p>
                </div>
            </div>
        </template>

        <!-- Reset Mode -->
        <template x-if="mode === 'reset'">
            <div>
                <div class="mb-4 2xl:mb-6">
                    <h1 class="mb-2 text-2xl font-bold text-gray-800 dark:text-white">Reset Password</h1>
                    <p class="text-gray-500 dark:text-gray-400">Masukkan password baru Anda.</p>
                </div>

                <form @submit.prevent="doReset()">
                    <div class="space-y-4 2xl:space-y-5">
                        <div class="grid grid-cols-1 gap-4 2xl:gap-5 sm:grid-cols-2">
                            <div>
                                <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">
                                    Password Baru<span class="text-error-500">*</span>
                                </label>
                                <div x-data="{ showPassword: false }" class="relative">
                                    <input x-model="formData.password" :type="showPassword ? 'text' : 'password'" placeholder="••••••••" required minlength="6"
                                        class="w-full h-11 rounded-lg border border-gray-300 bg-transparent py-2.5 pl-4 pr-11 text-sm text-gray-800 shadow-sm placeholder:text-gray-400 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 dark:border-gray-700 dark:bg-gray-900/50 dark:text-white dark:placeholder:text-white/30 dark:focus:border-brand-500" />
                                    <span @click="showPassword = !showPassword"
                                        class="absolute z-30 text-gray-500 -translate-y-1/2 cursor-pointer right-4 top-1/2 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200">
                                        <span x-show="!showPassword" class="block w-5 h-5" x-icon="'eye-off'"></span>
                                        <span x-show="showPassword" class="block w-5 h-5" x-icon="'eye'"></span>
                                    </span>
                                </div>
                            </div>
                            <div>
                                <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">
                                    Konfirmasi<span class="text-error-500">*</span>
                                </label>
                                <div x-data="{ showPassword: false }" class="relative">
                                    <input x-model="formData.confirmPassword" :type="showPassword ? 'text' : 'password'" placeholder="••••••••" required
                                        class="w-full h-11 rounded-lg border border-gray-300 bg-transparent py-2.5 pl-4 pr-11 text-sm text-gray-800 shadow-sm placeholder:text-gray-400 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 dark:border-gray-700 dark:bg-gray-900/50 dark:text-white dark:placeholder:text-white/30 dark:focus:border-brand-500" />
                                    <span @click="showPassword = !showPassword"
                                        class="absolute z-30 text-gray-500 -translate-y-1/2 cursor-pointer right-4 top-1/2 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200">
                                        <span x-show="!showPassword" class="block w-5 h-5" x-icon="'eye-off'"></span>
                                        <span x-show="showPassword" class="block w-5 h-5" x-icon="'eye'"></span>
                                    </span>
                                </div>
                            </div>
                        </div>

                        <div>
                            <button type="submit" :disabled="isSubmitting"
                                class="flex items-center justify-center w-full px-4 py-3 text-sm font-bold text-white transition rounded-lg bg-brand-500 shadow-theme-xs hover:bg-brand-600 focus:outline-none focus:ring-2 focus:ring-brand-500/20">
                                <template x-if="!isSubmitting">
                                    <span>Reset Password</span>
                                </template>
                                <template x-if="isSubmitting">
                                    <svg class="w-6 h-6 animate-spin text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                    </svg>
                                </template>
                            </button>
                        </div>
                    </div>
                </form>

                <div class="mt-4 2xl:mt-5">
                    <p class="text-sm font-normal text-center text-gray-700 dark:text-gray-400 sm:text-start">
                        <a href="#signin" class="text-brand-500 hover:text-brand-600 dark:text-brand-400 font-medium">Kembali ke Login</a>
                    </p>
                </div>
            </div>
        </template>
    </div>
</div>

<div class="fixed z-50 flex items-center gap-3 max-sm:hidden top-6 right-6">
    <button
        class="inline-flex items-center justify-center text-white transition-colors rounded-full size-10 bg-brand-500 hover:bg-brand-600"
        @click.prevent="darkMode = !darkMode">
        <span class="w-5 h-5" x-icon="'moon'" x-show="darkMode"></span>
        <span class="w-5 h-5" x-icon="'sun'" x-show="!darkMode"></span>
    </button>
</div>
