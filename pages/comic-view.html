<!-- COMIC_VIEW_TEMPLATE -->
<div x-data="comicView()" x-init="init()" class="comic-reader-container animate-fade-in" x-cloak>
    <!-- Top Navigation & Title Bar -->
    <div
        class="bg-white dark:bg-gray-900 border-b border-gray-100 dark:border-gray-800 sticky top-0 left-0 right-0 z-50 transition-colors duration-300 shadow-sm w-full block">
        <div class="w-full px-4 md:px-6 h-[60px] md:h-[85px] flex items-center">
            <div class="flex flex-row items-center justify-between gap-3 md:gap-4 w-full">
                <div class="min-w-0 flex-1">
                    <h1 class="text-[11px] md:text-lg font-black text-gray-900 dark:text-white truncate"
                        x-text="meta?.title || 'Loading Chapter...'"></h1>
                    <div class="flex items-center gap-1 md:gap-2 mt-0.5 md:mt-1">
                        <span
                            class="text-[8px] md:text-xs font-black text-brand-600 uppercase tracking-widest truncate max-w-[50px] md:max-w-none"
                            x-text="meta?.category || 'Comic'"></span>
                        <span class="text-gray-300 dark:text-gray-700 text-[10px]">•</span>
                        <span class="text-[8px] md:text-xs font-bold text-gray-500 dark:text-gray-400 truncate"
                            x-text="formatDate(meta?.publishdate)"></span>
                    </div>
                </div>

                <!-- Navigation Buttons -->
                <div class="flex items-center gap-1 md:gap-2 flex-none">
                    <!-- Language Toggle -->
                    <div class="flex bg-gray-100 dark:bg-gray-800 rounded-lg p-0.5 md:p-1 shrink-0">
                        <button @click="currentLang = 'id'"
                            :class="currentLang === 'id' ? 'bg-white dark:bg-gray-700 shadow-sm text-brand-600' : 'text-gray-500'"
                            class="px-1.5 md:px-2 py-1 text-[8px] md:text-[10px] font-bold rounded-md transition-all cursor-pointer whitespace-nowrap">ID</button>
                        <button @click="currentLang = 'en'"
                            :class="currentLang === 'en' ? 'bg-white dark:bg-gray-700 shadow-sm text-brand-600' : 'text-gray-500'"
                            class="px-1.5 md:px-2 py-1 text-[8px] md:text-[10px] font-bold rounded-md transition-all cursor-pointer whitespace-nowrap">EN</button>
                    </div>

                    <button @click="navigateChapter('prev')"
                        class="flex-none inline-flex items-center justify-center w-8 h-8 md:w-auto md:px-4 md:py-2 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 text-xs font-bold rounded-lg transition-all active:scale-95 disabled:opacity-30 disabled:cursor-not-allowed"
                        :disabled="!hasPrev" title="Previous">
                        <svg class="w-4 h-4 md:w-3.5 md:h-3.5" fill="none" stroke="currentColor" stroke-width="3"
                            viewBox="0 0 24 24">
                            <path d="M15 19l-7-7 7-7" />
                        </svg>
                        <span class="hidden md:inline md:ml-2">Prev</span>
                    </button>
                    <button @click="navigateChapter('next')"
                        class="flex-none inline-flex items-center justify-center w-8 h-8 md:w-auto md:px-6 md:py-2 bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold rounded-lg transition-all shadow-lg shadow-brand-500/20 active:scale-95 disabled:opacity-30 disabled:cursor-not-allowed"
                        :disabled="!hasNext" title="Next">
                        <span class="hidden md:inline md:mr-2">Next</span>
                        <svg class="w-4 h-4 md:w-3.5 md:h-3.5" fill="none" stroke="currentColor" stroke-width="3"
                            viewBox="0 0 24 24">
                            <path d="M9 5l7 7-7 7" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Reader Container -->
    <div class="max-w-4xl mx-auto min-h-screen bg-[#f4f4f4] dark:bg-black flex flex-col items-center">
        <!-- Loading State -->
        <template x-if="isLoading">
            <div class="w-full space-y-4 px-4">
                <div class="aspect-[2/3] w-full bg-gray-200 dark:bg-gray-800 animate-pulse rounded-lg"></div>
                <div class="aspect-[2/3] w-full bg-gray-200 dark:bg-gray-800 animate-pulse rounded-lg"></div>
            </div>
        </template>

        <!-- Images List -->
        <div class="w-full flex flex-col items-center" id="comic-pages-list" :class="'lang-mode-' + currentLang"
            style="container-type: inline-size; position: relative;">

            <!-- Render Text Bubbles as Overlay -->
            <template x-for="(bubble, index) in bubbles" :key="'bubble-'+index">
                <div x-html="bubble" class="comic-bubble-overlay"></div>
            </template>

            <template x-for="(src, index) in pages" :key="index">
                <div class="relative w-full group">
                    <!-- Lapisan Pelindung Transparan -->
                    <div class="absolute inset-0 z-10 pointer-events-auto" @contextmenu.prevent="" @mousedown.prevent=""
                        @touchstart.prevent=""></div>

                    <img :src="src" class="w-full h-auto block select-none bg-gray-200 dark:bg-gray-900"
                        @contextmenu.prevent="" loading="lazy" :alt="'Page ' + (index + 1)">

                    <!-- Floating Page Count (Z-index dinaikkan agar di atas shield) -->
                    <div class="absolute bottom-4 right-4 z-20 bg-black/60 backdrop-blur-md text-white text-[10px] font-bold px-3 py-1.5 rounded-full opacity-0 group-hover:opacity-100 transition-opacity duration-300"
                        x-text="(index + 1) + ' / ' + pages.length"></div>
                </div>
            </template>
        </div>

        <!-- Footer Navigation -->
        <div x-show="!isLoading && pages.length > 0"
            class="w-full py-16 px-4 text-center bg-white dark:bg-gray-950 border-t border-gray-100 dark:border-gray-900 mt-0 shadow-inner">
            <div class="mb-8">
                <h3 class="text-sm font-black text-gray-400 dark:text-gray-600 uppercase tracking-[0.3em]">End of
                    Chapter</h3>
            </div>

            <div class="flex flex-col items-center gap-4">
                <button @click="navigateChapter('next')" x-show="hasNext"
                    class="inline-flex items-center gap-3 px-12 py-4 bg-brand-600 hover:bg-brand-700 text-white font-black rounded-2xl shadow-xl shadow-brand-500/30 transition-all active:scale-95 uppercase tracking-widest text-sm">
                    Next Chapter
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                        <path d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                    </svg>
                </button>

                <div class="flex items-center gap-6 mt-4">
                    <a x-on:click.prevent="window.navigate('home')" href="/"
                        class="text-xs font-bold text-gray-400 hover:text-brand-600 transition-colors uppercase tracking-widest">Home</a>
                    <span class="w-1 h-1 rounded-full bg-gray-300 dark:bg-gray-800"></span>
                    <a href="#header"
                        class="text-xs font-bold text-gray-400 hover:text-brand-600 transition-colors uppercase tracking-widest">Top</a>
                </div>
            </div>
        </div>

        <!-- Error/Empty State -->
        <div x-show="!isLoading && pages.length === 0" class="py-32 text-center px-6">
            <div
                class="w-20 h-20 bg-gray-100 dark:bg-gray-900 rounded-full flex items-center justify-center mx-auto mb-6 text-gray-300">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path
                        d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
            </div>
            <h2 class="text-xl font-bold text-gray-900 dark:text-white mb-2">No Pages Found</h2>
            <p class="text-gray-500 dark:text-gray-400 text-sm max-w-xs mx-auto">This chapter might be empty or still
                being processed. Please check back later.</p>
        </div>
    </div>
</div>

<script>
    window.comicView = function () {
        return {
            meta: null,
            pages: [],
            bubbles: [], // Menyimpan elemen speech-bubble
            isLoading: true,
            currentLang: (window.app?.language || 'id').startsWith('en') ? 'en' : 'id',
            hasNext: false,
            hasPrev: false,

            async init() {
                this.loadChapter();
                this.$watch('params.slug', () => this.loadChapter());
            },

            async loadChapter() {
                const slug = window.app?.params?.slug;
                if (!slug) {
                    this.isLoading = false;
                    return;
                }

                this.isLoading = true;
                const searchKey = slug.toLowerCase();

                // === STRATEGY 1: Metadata Hand-off (Fast Path) ===
                if (window._lastResolvedMeta && (
                    String(window._lastResolvedMeta.slug || '').toLowerCase() === searchKey ||
                    String(window._lastResolvedMeta.id || '').toLowerCase() === searchKey
                )) {
                    console.log('[ComicView] Using Hand-off Meta');
                    this.meta = this.normalizeMeta(window._lastResolvedMeta);
                    this.renderComic();
                    this.isLoading = false;
                }

                // === STRATEGY 2: Search in Global Posts ===
                const findInPosts = () => {
                    const allPosts = window.app?.posts || window.posts || [];
                    if (allPosts.length === 0) return null;
                    return allPosts.find(p =>
                        String(p.slug || '').toLowerCase() === searchKey ||
                        String(p.id || '').toLowerCase() === searchKey ||
                        String(p.path || '').toLowerCase().includes(searchKey)
                    );
                };

                const found = findInPosts();
                if (found) {
                    console.log('[ComicView] Found in Global Posts');
                    this.meta = this.normalizeMeta(found);
                    this.renderComic();
                    this.isLoading = false;
                }

                // === STRATEGY 3: Specialized Chapter Feed Filter ===
                // Jika tidak ada di cache, tarik feed khusus label 'Chapter'
                if (!this.meta || (window.app?.posts || []).length === 0) {
                    console.log('[ComicView] Fetching specialized Chapter feed...');
                    await this.fetchChapterFeed();

                    const lateFound = findInPosts();
                    if (lateFound) {
                        this.meta = this.normalizeMeta(lateFound);
                        this.renderComic();
                        this.isLoading = false;
                    }
                }

                if (!this.meta) {
                    // === STRATEGY 4: Deep Fetch (Direct from URL) ===
                    try {
                        const path = window.app?.params?.path || window.location.pathname;
                        if (path && path.includes('/20')) {
                            console.log('[ComicView] Performing Deep Fetch from:', path);
                            const res = await fetch(path);
                            if (res.ok) {
                                const html = await res.text();
                                if (window.app?.parseMetaFromHTML) {
                                    const deepMeta = window.app.parseMetaFromHTML(html);
                                    if (deepMeta) {
                                        this.meta = this.normalizeMeta(deepMeta);
                                        this.renderComic();
                                    }
                                }
                            }
                        }
                    } catch (e) { console.error('[ComicView] Deep fetch failed', e); }
                }

                this.checkNavigation();
                setTimeout(() => { this.isLoading = false; }, 500);
            },

            async fetchChapterFeed() {
                try {
                    // Filter feed khusus untuk label 'Chapter'
                    const res = await fetch('/feeds/posts/default/-/Chapter?alt=json&max-results=500');
                    if (res.ok) {
                        const json = await res.json();
                        const entries = json.feed?.entry || [];
                        const chapterPosts = entries.map(entry => {
                            const altLink = (entry.link || []).find(l => l.rel === 'alternate');
                            const html = entry.content?.$t || '';
                            let meta = null;
                            if (window.app?.parseMetaFromHTML) meta = window.app.parseMetaFromHTML(html, entry);

                            return {
                                id: entry.id?.$t?.split('post-').pop(),
                                title: entry.title?.$t,
                                slug: altLink?.href.split('/').pop().replace('.html', ''),
                                path: altLink?.href ? new URL(altLink.href).pathname : '#',
                                publishdate: entry.published?.$t,
                                category: 'Chapter',
                                description: html,
                                ...meta
                            };
                        });

                        if (window.app) {
                            // Gabungkan dengan posts yang sudah ada tanpa duplikasi
                            const existingIds = new Set(window.app.posts.map(p => p.id));
                            chapterPosts.forEach(p => {
                                if (!existingIds.has(p.id)) window.app.posts.push(p);
                            });
                            // Urutkan berdasarkan tanggal rilis terbaru
                            window.app.posts.sort((a, b) => new Date(b.publishdate) - new Date(a.publishdate));
                        }
                    }
                } catch (e) { console.warn('[ComicView] Chapter feed fetch failed', e); }
            },

            normalizeMeta(raw) {
                return {
                    title: raw.title || '',
                    description: raw.body || raw.description || raw.content || '',
                    pages: raw.pages || raw.images || raw.comicImages || [],
                    image: raw.image || raw.imageurl || raw.imageUrl || '',
                    publishdate: raw.publishdate || '',
                    category: Array.isArray(raw.category) ? raw.category[0] : (raw.category || 'Comic'),
                    slug: raw.slug || '',
                    path: raw.path || '#'
                };
            },

            renderComic() {
                console.log('[ComicView] Menjalankan renderComic...');

                if (!this.meta?.description) {
                    console.error('[ComicView] Gagal: deskripsi konten kosong.');
                    this.isLoading = false;
                    return;
                }

                const parser = new DOMParser();
                const doc = parser.parseFromString(this.meta.description, 'text/html');

                // 1. Ekstrak Bubble (PENTING: Harus di luar blok gambar agar selalu jalan)
                const bubbleNodes = Array.from(doc.querySelectorAll('.speech-bubble'));
                this.bubbles = bubbleNodes.map(bubble => {
                    // Clean editor controls and prevent editability in storefront
                    bubble.querySelectorAll('.drag-handle').forEach(el => el.remove());
                    bubble.querySelectorAll('button').forEach(el => el.remove());
                    bubble.setAttribute('contenteditable', 'false');
                    bubble.querySelectorAll('[contenteditable]').forEach(el => {
                        el.setAttribute('contenteditable', 'false');
                    });

                    // Bersihkan gaya inline namun konversi font-size px ke cqi (responsive)
                    // Ini memastikan teks yang diatur kecil di editor tetap kecil (bisikan) 
                    // dan teks besar tetap besar, namun semuanya mengecil di mobile secara proporsional.
                    const cleanStyles = (el) => {
                        const fs = el.style.fontSize;
                        el.style.removeProperty('display');

                        if (fs && fs.includes('px')) {
                            const px = parseFloat(fs);
                            // Anggap 22px adalah ukuran standar editor yang setara dengan 2.8cqi standar di template
                            const scale = px / 22;
                            const responsiveSize = `calc(${(2.8 * scale).toFixed(2)}cqi + 3px)`;
                            el.style.setProperty('font-size', responsiveSize, 'important');
                        } else {
                            el.style.removeProperty('font-size');
                        }

                        el.style.removeProperty('line-height');
                        el.style.cursor = 'default';
                    };

                    const contentBox = bubble.querySelector('.bubble-content') || bubble.querySelector('.comic-text-box');
                    if (contentBox) {
                        contentBox.setAttribute('contenteditable', 'false');
                        contentBox.style.cursor = 'default';
                        contentBox.style.resize = 'none';

                        const langElems = contentBox.querySelectorAll('.lang-id, .lang-en, .lang-in');
                        if (langElems.length === 0) {
                            const originalContent = contentBox.innerHTML;
                            contentBox.innerHTML = `<div class="lang-id">${originalContent}</div>`;
                        } else {
                            langElems.forEach(el => cleanStyles(el));
                        }

                        const langEn = contentBox.querySelector('.lang-en');
                        const langId = contentBox.querySelector('.lang-id') || contentBox.querySelector('.lang-in');

                        // === SINKRONISASI TYPOGRAPHY (BOLD/ITALIC) ===
                        if (langId) {
                            const stylesToSync = ['fontWeight', 'fontStyle', 'textDecoration', 'textAlign', 'color'];
                            stylesToSync.forEach(prop => {
                                if (langId.style[prop]) {
                                    contentBox.style[prop] = langId.style[prop];
                                }
                            });

                            // Bersihkan sisa gaya sinkronisasi di semua child agar mewarisi dari contentBox
                            contentBox.querySelectorAll('.lang-id, .lang-en, .lang-in').forEach(el => {
                                stylesToSync.forEach(p => el.style.removeProperty(p.replace(/[A-Z]/g, m => "-" + m.toLowerCase())));
                            });
                        }

                        if (langEn && langId) {
                            const txtEnClean = langEn.textContent.trim().toLowerCase().replace(/[\s\u00a0]+/g, ' ');
                            if (!txtEnClean || txtEnClean.includes('type english text') || txtEnClean === 'type english text...') {
                                langEn.innerHTML = langId.innerHTML;
                            }
                        } else if (!langEn && langId) {
                            // Fallback jika naskah EN tidak ada sama sekali di bubble
                            const newEn = document.createElement('div');
                            newEn.className = 'lang-en';
                            newEn.innerHTML = langId.innerHTML;
                            contentBox.appendChild(newEn);
                        }
                    }
                    return bubble.outerHTML;
                });
                console.log(`[ComicView] Ditemukan ${this.bubbles.length} teks dialog komik.`);

                // 2. Ekstrak Halaman Gambar
                let foundPages = [];

                // Strategi A: Dari data 'pages' JSON (Prioritas)
                if (this.meta.pages && (Array.isArray(this.meta.pages) && this.meta.pages.length > 0)) {
                    foundPages = this.meta.pages;
                } else if (typeof this.meta.pages === 'string' && this.meta.pages.includes('http')) {
                    foundPages = this.meta.pages.split(',').map(s => s.trim());
                }

                // Strategi B: Jika JSON kosong, ambil dari tag <img> di HTML
                if (foundPages.length === 0) {
                    console.log('[ComicView] JSON Pages kosong, mengekstrak dari HTML...');
                    const imgNodes = Array.from(doc.querySelectorAll('img')).filter(img => !img.closest('.ezy-meta'));
                    foundPages = imgNodes.map(img => {
                        const parentLink = img.closest('a');
                        if (parentLink && parentLink.href.match(/\.(jpg|jpeg|png|gif|webp)/i)) {
                            return parentLink.href;
                        }
                        return img.src;
                    });
                }

                // Strategi C: Tambahkan Cover jika tidak ada halaman sama sekali dalam list
                if (foundPages.length === 0 && this.meta.image) {
                    foundPages.push(this.meta.image);
                }

                // Bersihkan URL dan simpan ke state
                this.pages = foundPages.filter(src => src && !src.includes('clear.gif') && !src.includes('pixel.gif'));
                console.log(`[ComicView] Berhasil memuat ${this.pages.length} halaman komik.`);

                this.isLoading = false;
            },

            checkNavigation() {
                const currentSlug = window.app?.params?.slug;
                const seriesPosts = this.getSeriesPosts();

                if (seriesPosts.length > 0 && currentSlug) {
                    const idx = seriesPosts.findIndex(p => p.slug === currentSlug);
                    if (idx !== -1) {
                        // Dalam urutan ASC (Ch 1, Ch 2, Ch 3):
                        // Next adalah index + 1
                        // Prev adalah index - 1
                        this.hasNext = idx < seriesPosts.length - 1;
                        this.hasPrev = idx > 0;
                    }
                }
            },

            navigateChapter(dir) {
                const seriesPosts = this.getSeriesPosts();
                const currentSlug = window.app?.params?.slug;
                const idx = seriesPosts.findIndex(p => p.slug === currentSlug);

                if (idx !== -1) {
                    const targetIdx = dir === 'next' ? idx + 1 : idx - 1;
                    const target = seriesPosts[targetIdx];
                    if (target) {
                        window.navigate('comic', { slug: target.slug, path: target.path });
                    }
                }
            },

            getSeriesPosts() {
                if (!this.meta?.title) return [];

                // 1. Ekstrak Judul Seri (Induk)
                let seriesTitle = this.meta.title.split(' - ')[0];
                if (seriesTitle.includes('-Chapter')) seriesTitle = seriesTitle.split('-Chapter')[0];
                else if (seriesTitle.includes(' Chapter')) seriesTitle = seriesTitle.split(' Chapter')[0];
                seriesTitle = seriesTitle.trim();

                // 2. Filter posts yang satu grup
                const allPosts = window.app?.posts || [];
                return allPosts.filter(p => {
                    let pSeries = (p.title || '').split(' - ')[0];
                    if (pSeries.includes('-Chapter')) pSeries = pSeries.split('-Chapter')[0];
                    else if (pSeries.includes(' Chapter')) pSeries = pSeries.split(' Chapter')[0];
                    return pSeries.trim() === seriesTitle;
                }).sort((a, b) => {
                    // Sorting Numerik Chapter (ASC: 1, 2, 3...)
                    const getNum = (t) => {
                        const m = t.match(/Chapter\s*(\d+)/i) || t.match(/-(\d+)$/);
                        return m ? parseInt(m[1]) : 0;
                    };
                    return getNum(a.title) - getNum(b.title);
                });
            },

            formatDate(d) {
                if (!d) return '';
                return new Date(d).toLocaleDateString('id-ID', {
                    day: 'numeric', month: 'long', year: 'numeric'
                });
            }
        }
    };

    // Hook for XML fetchPage mechanism
    window.initComicPage = function () {
        console.log('[ComicView] Hook Initialized');
    };
</script>

<style>
    .comic-reader-container img {
        -webkit-user-drag: none;
        user-select: none;
    }

    .animate-fade-in {
        animation: fadeIn 0.4s ease-out both;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(8px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Smooth transition for dark mode theme colors */
    .comic-reader-container {
        transition-property: background-color, border-color, color;
        transition-duration: 300ms;
    }

    /* Language Display Logic for Comic Bubbles */
    .lang-mode-id .lang-en {
        display: none !important;
    }

    .lang-mode-id .lang-id,
    .lang-mode-id .lang-in {
        display: block !important;
    }

    .lang-mode-en .lang-id,
    .lang-mode-en .lang-in {
        display: none !important;
    }

    .lang-mode-en .lang-en {
        display: block !important;
    }
</style>
