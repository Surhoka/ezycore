<div x-data="ecommerceSettings" class="w-full px-1 sm:px-0">

  <div class="rounded-2xl border border-primary bg-secondary relative min-h-[500px] shadow-sm overflow-hidden">
    <!-- Loading Overlay -->
    <div x-show="isLoading" x-cloak
      class="absolute inset-0 z-10 flex items-center justify-center bg-secondary/80 backdrop-blur-sm rounded-lg">
      <svg class="h-8 w-8 animate-spin text-brand-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
      </svg>
    </div>

    <div x-show="!isLoading" class="p-4 md:p-6 transition-opacity duration-500">
      <div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03] p-5 lg:p-6">

        <!-- Tabs -->
        <div class="tab-nav-container tab-nav-borderless mb-6">
          <button @click="activeTab = 'general'" :class="{ 'active': activeTab === 'general' }" class="tab-nav-btn">General</button>
          <button @click="activeTab = 'storefront'" :class="{ 'active': activeTab === 'storefront' }" class="tab-nav-btn">Storefront</button>
        </div>

        <!-- General Tab -->
        <div x-show="activeTab === 'general'" x-cloak>
          <h4 class="text-lg font-semibold text-gray-800 dark:text-white/90 mb-6">General Settings</h4>
          <div class="grid grid-cols-1 gap-6 lg:grid-cols-2">
            <div>
              <label class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-400">Currency</label>
              <input type="text" x-model="settings.currency" placeholder="IDR"
                class="w-full h-11 rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-none focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90">
            </div>
            <div>
              <label class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-400">Tax Rate (%)</label>
              <input type="number" x-model="settings.taxRate" step="0.1"
                class="w-full h-11 rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-none focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90">
            </div>
            <div>
              <label class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-400">Midtrans Client Key</label>
              <input type="text" x-model="settings.midtransClientKey" placeholder="SB-Mid-client-xxxxx"
                class="w-full h-11 rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-none focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90">
              <p class="mt-1 text-xs text-gray-500">Server key di-set manual di Apps Script Properties > ECOMMERCE_MIDTRANS_SERVER_KEY</p>
            </div>
          </div>
        </div>

        <!-- Storefront Tab -->
        <div x-show="activeTab === 'storefront'" x-cloak>
          <h4 class="text-lg font-semibold text-gray-800 dark:text-white/90 mb-6">Storefront Settings</h4>
          <div class="grid grid-cols-1 gap-6 lg:grid-cols-2">
            <div>
              <label class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-400">Blog ID</label>
              <input type="text" x-model="settings.blogId" placeholder="Blogger blog ID"
                class="w-full h-11 rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-none focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90">
            </div>
            <div>
              <label class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-400">Blog URL</label>
              <input type="text" x-model="settings.blogUrl" placeholder="https://tokoku.blogspot.com"
                class="w-full h-11 rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-none focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90">
            </div>
            <div>
              <label class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-400">Shop Page ID</label>
              <input type="text" x-model="settings.pageIdShop" placeholder="Blogger page ID for /p/shop.html"
                class="w-full h-11 rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-none focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90">
            </div>
            <div>
              <label class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-400">Home Data Page ID</label>
              <input type="text" x-model="settings.pageIdHomeData" placeholder="Blogger page ID for /p/home-data.html"
                class="w-full h-11 rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-none focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90">
            </div>
            <div>
              <label class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-400">WebApp URL</label>
              <input type="text" :value="settings.webAppUrl" readonly
                class="w-full h-11 rounded-lg border border-gray-200 bg-gray-50 px-4 py-2.5 text-sm text-gray-500 cursor-not-allowed dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400">
              <p class="mt-1 text-xs text-gray-500">Otomatis dari pengaturan WebApp URL</p>
            </div>
            <div>
              <label class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-400">SiteKey</label>
              <input type="text" :value="settings.siteKey" readonly
                class="w-full h-11 rounded-lg border border-gray-200 bg-gray-50 px-4 py-2.5 text-sm text-gray-500 cursor-not-allowed dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400">
              <p class="mt-1 text-xs text-gray-500">Otomatis dari pengaturan SiteKey</p>
            </div>
          </div>
        </div>

        <div class="mt-6 flex justify-end">
          <button @click="saveSettings()"
            class="px-5 py-2.5 text-sm font-medium text-white bg-brand-500 rounded-lg hover:bg-brand-600 transition-all">
            Save Settings
          </button>
        </div>
      </div>
    </div>
  </div>

</div>
