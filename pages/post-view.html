            <!-- RIGHT: SIDEBAR -->
            <aside class="lg:col-span-4 space-y-12">

                <!-- Popular Posts Section -->
                <section>
                    <div class="flex items-center gap-3 mb-8">

                    <div class="bg-gray-50 dark:bg-gray-900 p-6 rounded-xl">
                        <div class="space-y-10">
                            <!-- Top Featured Popular -->
                            <template x-if="window.app && window.app.posts && window.app.posts[0]">

                                    </div>
                                </div>
                            </template>

                            <!-- Small Popular List -->
                            <div class="space-y-8">
                                <template x-for="(pop, index) in (window.app ? window.app.posts : []).slice(1, 5)">
                                    <div class="flex gap-4 group cursor-pointer" @click="viewDetail(pop)">
                                        <span
                                            class="text-lg font-black text-gray-200 dark:text-gray-800 transition-colors group-hover:text-brand-600"

                <!-- Labels Section -->
                <section>
                    <div class="flex items-center gap-3 mb-8">
                        <h3 class="font-black text-gray-900 dark:text-white text-sm uppercase tracking-widest">Labels
                        </h3>
                        <div class="h-px w-8 bg-gray-100 dark:bg-gray-800"></div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <template x-for="cat in (window.app ? window.app.categories : []).slice(0, 8)">
                            <a href="#"
                                @click.prevent="window.navigate('post-list', { category: cat.slug || cat.name })"
                                class="flex items-center justify-between p-3.5 rounded-lg border border-gray-100 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-900 transition-all group">
                                <span
                                    class="text-xs font-bold text-gray-600 dark:text-gray-400 group-hover:text-brand-600"
                                    x-text="cat.name"></span>
                                <div class="flex items-center gap-1 text-[10px] font-black text-gray-300">
                                    <span x-text="cat.count || 1"></span>
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                        stroke-width="2">
                                        <path
                                            d="M7.5 8.25h9m-9 3h9m-9 3h4.5M2.25 12a10 10 0 1 1 20 0 10 10 0 0 1-20 0z" />
                                    </svg>

                            </a>
                        </template>
                    </div>
                    <button class="mt-6 text-xs font-bold text-brand-600 hover:underline">Show all (+25)</button>
                </section>

                <!-- Ad Placeholder -->
                <div
                    class="h-32 bg-gray-50 dark:bg-gray-900/50 rounded-lg border border-dashed border-gray-200 dark:border-gray-800 flex items-center justify-center">
                    <span class="text-xs font-bold text-gray-400 tracking-widest uppercase">Ads go here</span>
                </div>

                <!-- Legal Links -->
                <div class='mt-10 pt-8 border-t border-gray-100 dark:border-gray-800 text-center'>
                    <div class='flex flex-wrap justify-center gap-x-4 gap-y-2 mb-4'>
                        <a class='text-gray-400 hover:text-brand-600 dark:hover:text-white transition-colors text-xs font-bold titlecase tracking-wider'
                            href='/p/privacy-policy.html'>Privacy Policy</a>
                        <a class='text-gray-400 hover:text-brand-600 dark:hover:text-white transition-colors text-xs font-bold titlecase tracking-wider'
                            href='/p/terms-of-service.html'>Terms of Service</a>
                        <a class='text-gray-400 hover:text-brand-600 dark:hover:text-white transition-colors text-xs font-bold titlecase tracking-wider'
                            href='/p/cookie-policy.html'>Cookie</a>
                    </div>
                </div>
            </aside>
        </div>
    </template>
</div>

<script>
    function initPostPage() {
        return {
            isLoading: true,
            error: false,
            content: {},

            async init() {
                // [FIX] Reset state segera agar konten lama hilang saat loading artikel baru
                this.content = {};
                this.isLoading = true;
                this.error = false;

                const app = window.app;
                if (!app) {
                    this.error = true;
                    this.isLoading = false;
                    return;
                }

                const params = app.params || {};
                const slug = params.slug || params.id;

                if (!slug) {
                    this.error = true;
                    this.isLoading = false;
                    return;
                }

                try {
                    // === STRATEGY 1: Metadata Hand-off (Fast Path) ===
                    // Pastikan metadata yang ada cocok dengan slug yang sedang diakses
                    if (window._lastResolvedMeta && (window._lastResolvedMeta.slug === slug || window._lastResolvedMeta.id === slug)) {
                        if (window._lastResolvedMeta.title) {
                            console.log('[PostView] Metadata Hand-off Success:', window._lastResolvedMeta.title);
                            this.content = this.normalizePost(window._lastResolvedMeta);
                            this.updateBreadcrumb();

                            // Penting: Hapus metadata setelah dikonsumsi agar tidak tertukar di navigasi berikutnya
                            window._lastResolvedMeta = null;
                            this.isLoading = false;
                            return;
                        }
                    }

                    // === STRATEGY 2: Fetch from Blogger Post Feed by slug ===
                    console.log('[PostView] Fetching from Feed for slug:', slug);
                    const feedUrl = '/feeds/posts/default?alt=json&max-results=500';
                    const res = await fetch(feedUrl).catch(() => null);

                    if (res && res.ok) {
                        const json = await res.json();
                        const entries = json.feed?.entry || [];

                        for (const entry of entries) {
                            const altLink = (entry.link || []).find(l => l.rel === 'alternate');
                            const entryHref = altLink?.href || '';
                            const entrySlug = entryHref.split('/').pop().replace('.html', '');

                            if (entrySlug === slug) {
                                // Try parsing ezy-meta from content
                                const html = entry.content ? entry.content.$t : '';
                                let meta = null;
                                if (typeof app.parseMetaFromHTML === 'function') {
                                    meta = app.parseMetaFromHTML(html, entry);
                                }

                                if (meta && meta.title) {
                                    // Deep body extraction
                                    if (!meta.body && !meta.description) {
                                        meta.body = html;
                                    }
                                    this.content = this.normalizePost(meta);
                                } else {
                                    // Build from raw Blogger feed entry
                                    const rawThumb = entry.media$thumbnail?.url || '';
                                    const thumb = rawThumb ? rawThumb.replace(/\/s\d+(-c)?\//, '/s800/') : '';
                                    const labels = (entry.category || []).map(c => c.term);

                                    this.content = this.normalizePost({
                                        title: entry.title?.$t || '',
                                        image: thumb,
                                        body: html,
                                        category: labels[0] || 'Artikel',
                                        publishdate: entry.published?.$t || '',
                                        author: entry.author?.[0]?.name?.$t || '',
                                        slug: entrySlug
                                    });
                                }
                                this.updateBreadcrumb();
                                this.isLoading = false;
                                return;
                            }
                        }
                    }

                    // === STRATEGY 3: Direct Fetch from path (Pjax-style) ===
                    const directPath = params.path || `/p/${slug}.html`;
                    console.log('[PostView] Attempting direct fetch:', directPath);
                    const directRes = await fetch(directPath).catch(() => null);

                    if (directRes && directRes.ok) {
                        const directHtml = await directRes.text();
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(directHtml, 'text/html');

                        let meta = null;
                        if (typeof app.parseMetaFromHTML === 'function') {
                            meta = app.parseMetaFromHTML(directHtml);
                        }

                        // Extract body from various Blogger content containers
                        const bodyNode = doc.querySelector('.ezy-post-body') || doc.querySelector('.post-body') || doc.querySelector('.entry-content');
                        const bodyHtml = bodyNode ? bodyNode.innerHTML : '';

                        if (meta && meta.title) {
                            if (!meta.body && !meta.description) meta.body = bodyHtml;
                            this.content = this.normalizePost(meta);
                        } else {
                            // Fallback: extract title from page
                            const titleEl = doc.querySelector('h1') || doc.querySelector('.post-title') || doc.querySelector('title');
                            this.content = this.normalizePost({
                                title: titleEl?.textContent?.trim() || slug.replace(/-/g, ' '),
                                body: bodyHtml || directHtml,
                                slug: slug
                            });
                        }
                        this.updateBreadcrumb();
                        this.isLoading = false;
                        return;
                    }

                    // All strategies exhausted
                    console.error('[PostView] All fetch strategies failed for:', slug);
                    this.error = true;

                } catch (e) {
                    console.error('[PostView] Critical error:', e);
                    this.error = true;
                } finally {
                    this.isLoading = false;
                }
            },

            normalizePost(raw) {
                return {
                    title: raw.title || '',
                    image: raw.image || raw.imageurl || raw.imageUrl || '',
                    body: raw.body || raw.description || raw.content || '',
                    description: raw.description || '',
                    content: raw.content || '',
                    category: Array.isArray(raw.category) ? raw.category[0] : (raw.category || 'Artikel'),
                    publishdate: raw.publishdate || raw.publishDate || '',
                    author: raw.author || '',
                    slug: raw.slug || ''
                };
            },

            share(platform) {
                const url = window.location.href;
                const title = this.content.title || '';

                if (platform === 'whatsapp') {
                    window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(title + ' ' + url), '_blank');
                } else if (platform === 'facebook') {
                    window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url), '_blank');
                } else if (platform === 'twitter') {
                    window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(title) + '&url=' + encodeURIComponent(url), '_blank');
                } else if (platform === 'copy') {
                    navigator.clipboard.writeText(url).then(() => {
                        // Simple visual feedback without dependency
                        const btn = event.currentTarget;
                        const original = btn.innerHTML;
                        btn.innerHTML = '<svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>';
                        setTimeout(() => { btn.innerHTML = original; }, 2000);
                    });
                }
            },

            getSnippet(html) {
                if (window.app?.getSnippet) return window.app.getSnippet(html);
                if (!html) return '';
                const text = html.replace(/<[^>]*>?/gm, ' ').trim();
                return text.length > 160 ? text.substring(0, 160) + '...' : text;
            },

            updateBreadcrumb() {
                if (window.renderBreadcrumb) {
                    window.renderBreadcrumb(this.content.title || 'Artikel');
                }
            }
        }
    }
</script>
