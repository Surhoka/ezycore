<div id='comic-list-view' class='animate-fade-in' 
    x-data='{ 
        selectedStatus: "All",
        selectedGenre: "",
        searchQuery: "",
        selectedChar: "all",

        init() {
            // Sinkronisasi dengan parameter dari URL/Router
            if (params.id) this.selectedChar = params.id;
            if (params.char) this.selectedChar = params.char;
            if (params.category) this.selectedGenre = params.category;
            if (params.status) this.selectedStatus = params.status;
            if (params.q) this.searchQuery = params.q;
            
            console.log("[ComicView] Initialized with:", { char: this.selectedChar, genre: this.selectedGenre });
        },

        get filteredComics() {
            return posts.filter(item => {
                // Filter by Search Query
                if (this.searchQuery && !item.title.toLowerCase().includes(this.searchQuery.toLowerCase())) return false;
                
                // Filter by Status
                if (this.selectedStatus !== "All") {
                    // Logika status bisa disesuaikan dengan data post (misal dari tags atau metadata)
                    const isCompleted = (item.tags || "").toLowerCase().includes("completed");
                    if (this.selectedStatus === "Completed" && !isCompleted) return false;
                    if (this.selectedStatus === "Ongoing" && isCompleted) return false;
                }

                // Filter by Genre
                if (this.selectedGenre && !(item.tags || "").includes(this.selectedGenre)) return false;

                // Filter by Alphabet (A-Z)
                if (this.selectedChar !== "all") {
                    const firstChar = item.title.trim().charAt(0).toUpperCase();
                    if (this.selectedChar === "0-9") {
                        if (!/[0-9]/.test(firstChar)) return false;
                    } else {
                        if (firstChar !== this.selectedChar) return false;
                    }
                }

                return true;
            });
        }
    }'>
    <!-- Page Header & Search -->
    <div class='relative py-12 mb-8 bg-gray-900 rounded-3xl overflow-hidden shadow-2xl shadow-black/20'>
        <div class='absolute inset-0 opacity-20'>
            <div class='absolute inset-0 bg-gradient-to-r from-brand-600 to-blue-600 mix-blend-multiply'></div>
            <img src='https://images.unsplash.com/photo-1578632738908-4521c626ef48?auto=format&fit=crop&q=80' class='w-full h-full object-cover' />
        </div>
        
        <div class='relative z-10 max-w-4xl mx-auto px-6 text-center'>
            <h1 class='text-3xl md:text-5xl font-black text-white mb-4 tracking-tighter uppercase'>Comic Collection</h1>
            <p class='text-gray-300 text-sm md:text-base font-medium mb-8 max-w-2xl mx-auto'>Temukan ribuan koleksi komik favorit Anda dari berbagai genre dan author terbaik.</p>
            
            <!-- Search Bar -->
            <div class='relative max-w-xl mx-auto'>
                <input 
                    type='text' 
                    x-model='searchQuery'
                    placeholder='Cari judul komik...'
                    class='w-full bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl py-4 pl-12 pr-6 text-white placeholder-white/50 focus:ring-4 focus:ring-brand-500/20 focus:border-brand-500 outline-none transition-all'
                />
                <div class='absolute left-4 top-1/2 -translate-y-1/2 text-white/50'>
                    <svg class='w-5 h-5' fill='none' stroke='currentColor' viewBox='0 0 24 24'><path d='M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z' stroke-linecap='round' stroke-linejoin='round' stroke-width='2.5'/></svg>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content Layout -->
    <div class='flex flex-col lg:flex-row gap-10'>
        
        <!-- Sidebar Filters -->
        <aside class='w-full lg:w-72 space-y-8'>
            <!-- Status Filter -->
            <div class='bg-white dark:bg-gray-900 rounded-2xl p-6 border border-gray-100 dark:border-gray-800 shadow-sm'>
                <h3 class='text-xs font-black text-gray-900 dark:text-white uppercase tracking-widest mb-4 flex items-center gap-2'>
                    <span class='w-1 h-3 bg-brand-500 rounded-full'></span>
                    Status
                </h3>
                <div class='flex flex-col gap-2'>
                    <template x-for='stat in ["All", "Ongoing", "Completed"]'>
                        <label class='flex items-center gap-3 p-2 rounded-xl cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors group'>
                            <input type='radio' name='status' :value='stat' x-model='selectedStatus' class='w-4 h-4 text-brand-600 border-gray-300 focus:ring-brand-500 dark:border-gray-700 dark:bg-gray-800' />
                            <span class='text-sm font-bold text-gray-600 dark:text-gray-400 group-hover:text-gray-900 dark:group-hover:text-white transition-colors' x-text='stat'></span>
                        </label>
                    </template>
                </div>
            </div>

            <!-- Genre Filter (Dynamic) -->
            <div class='bg-white dark:bg-gray-900 rounded-2xl p-6 border border-gray-100 dark:border-gray-800 shadow-sm'>
                <h3 class='text-xs font-black text-gray-900 dark:text-white uppercase tracking-widest mb-4 flex items-center gap-2'>
                    <span class='w-1 h-3 bg-brand-500 rounded-full'></span>
                    Genre Popular
                </h3>
                <div class='flex flex-wrap gap-2'>
                    <template x-for='genre in allGenres.slice(0, 15)' :key='genre'>
                        <button 
                            @click='selectedGenre = genre'
                            :class='selectedGenre === genre ? "bg-brand-600 text-white shadow-lg shadow-brand-500/20" : "bg-gray-50 dark:bg-gray-800 text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-700"'
                            class='px-3 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-wider transition-all'
                            x-text='genre'>
                        </button>
                    </template>
                </div>
            </div>
        </aside>

        <!-- Comic Grid Section -->
        <div class='flex-1'>
            <!-- Toolbar: Sort & A-Z -->
            <div class='bg-white dark:bg-gray-900 rounded-2xl p-4 border border-gray-100 dark:border-gray-800 shadow-sm mb-8'>
                <div class='flex flex-col md:flex-row justify-between items-center gap-4'>
                    <!-- A-Z Navigation Mini -->
                    <div class='flex flex-wrap gap-1 justify-center'>
                        <button 
                            @click='selectedChar = "all"'
                            :class='selectedChar === "all" ? "bg-brand-600 text-white shadow-sm" : "bg-gray-50 dark:bg-gray-800 text-gray-500"'
                            class='w-8 h-8 flex items-center justify-center text-[10px] font-bold rounded-lg transition-all'>ALL</button>
                        <template x-for='char in "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("")' :key='char'>
                            <button 
                                @click='selectedChar = char'
                                :class='selectedChar === char ? "bg-brand-600 text-white shadow-sm" : "bg-gray-50 dark:bg-gray-800 text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-700"'
                                class='w-8 h-8 flex items-center justify-center text-[10px] font-bold rounded-lg transition-colors' 
                                x-text='char'></button>
                        </template>
                    </div>

                    <!-- Sort Dropdown -->
                    <div class='flex items-center gap-3'>
                        <span class='text-[10px] font-black text-gray-400 uppercase tracking-widest'>Sort By:</span>
                        <select class='bg-gray-50 dark:bg-gray-800 border-none rounded-xl px-4 py-2 text-xs font-bold text-gray-700 dark:text-gray-300 focus:ring-2 focus:ring-brand-500/20 outline-none cursor-pointer'>
                            <option>Latest Updates</option>
                            <option>Title A-Z</option>
                            <option>Popularity</option>
                            <option>Rating</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Grid -->
            <div class='grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-6' x-show='!isLoading'>
                <template x-for='(item, index) in filteredComics' :key='index'>
                    <div class='group cursor-pointer' @click='window.navigate("post", { slug: item.slug, path: item.path })'>
                        <div class='relative aspect-[3/4] rounded-2xl overflow-hidden mb-4 shadow-lg border border-gray-100 dark:border-gray-800'>
                            <img :src='item.image || "https://dummyimage.com/300x400/374151/9ca3af&text=."' class='w-full h-full object-cover transition-transform duration-500 group-hover:scale-110' />
                            
                            <!-- Rating Overlay -->
                            <div class='absolute top-3 left-3 bg-black/50 backdrop-blur-md px-2 py-1 rounded-lg flex items-center gap-1.5 border border-white/10'>
                                <svg class='w-3 h-3 text-yellow-500' fill='currentColor' viewBox='0 0 20 20'><path d='M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z'></path></svg>
                                <span class='text-[10px] font-black text-white'>9.5</span>
                            </div>

                            <!-- Type Badge -->
                            <div class='absolute top-3 right-3 bg-brand-600 text-white text-[9px] font-black px-2 py-1 rounded-lg uppercase tracking-tighter shadow-lg shadow-brand-600/30'>Manhwa</div>

                            <!-- Hover Details -->
                            <div class='absolute inset-0 bg-gradient-to-t from-gray-950 via-gray-950/20 to-transparent opacity-0 group-hover:opacity-100 transition-all duration-300 p-4 flex flex-col justify-end'>
                                <p class='text-white text-xs font-bold line-clamp-2 mb-2' x-text='item.title'></p>
                                <div class='flex flex-wrap gap-1'>
                                    <template x-for='tag in (item.tags || "").split(",").slice(0, 2)'>
                                        <span class='text-[8px] bg-white/20 backdrop-blur-md text-white px-1.5 py-0.5 rounded font-bold' x-text='tag.trim()'></span>
                                    </template>
                                </div>
                            </div>
                        </div>
                        <h4 class='text-[13px] font-black text-gray-900 dark:text-white line-clamp-2 leading-tight group-hover:text-brand-600 transition-colors' x-text='item.title'></h4>
                        <p class='text-[11px] text-gray-500 dark:text-gray-400 font-bold mt-1'>Chapter 124</p>
                    </div>
                </template>
            </div>

            <!-- Pagination -->
            <div class='mt-12 flex justify-center items-center gap-3'>
                <button class='w-10 h-10 rounded-xl bg-white dark:bg-gray-900 border border-gray-100 dark:border-gray-800 text-gray-400 flex items-center justify-center hover:bg-gray-50 dark:hover:bg-gray-800 transition-all'>
                    <svg class='w-5 h-5' fill='none' stroke='currentColor' viewBox='0 0 24 24'><path d='M15 19l-7-7 7-7' stroke-linecap='round' stroke-linejoin='round' stroke-width='2.5'/></svg>
                </button>
                <div class='flex items-center gap-1.5'>
                    <button class='w-10 h-10 rounded-xl bg-brand-600 text-white font-black text-xs shadow-lg shadow-brand-500/20'>1</button>
                    <button class='w-10 h-10 rounded-xl bg-white dark:bg-gray-900 border border-gray-100 dark:border-gray-800 text-gray-500 font-black text-xs hover:bg-gray-50 dark:hover:bg-gray-800 transition-all'>2</button>
                    <button class='w-10 h-10 rounded-xl bg-white dark:bg-gray-900 border border-gray-100 dark:border-gray-800 text-gray-500 font-black text-xs hover:bg-gray-50 dark:hover:bg-gray-800 transition-all'>3</button>
                </div>
                <button class='w-10 h-10 rounded-xl bg-white dark:bg-gray-900 border border-gray-100 dark:border-gray-800 text-gray-400 flex items-center justify-center hover:bg-gray-50 dark:hover:bg-gray-800 transition-all'>
                    <svg class='w-5 h-5' fill='none' stroke='currentColor' viewBox='0 0 24 24'><path d='M9 5l7 7-7 7' stroke-linecap='round' stroke-linejoin='round' stroke-width='2.5'/></svg>
                </button>
            </div>
        </div>
    </div>
</div>
