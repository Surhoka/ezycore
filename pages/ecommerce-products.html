<div x-data="ecommerceProducts" class="w-full px-1 sm:px-0">
    <div class="rounded-2xl border border-primary bg-secondary relative min-h-[500px] shadow-sm overflow-hidden">
        <!-- Loading Overlay -->
        <div x-show="isLoading" x-cloak
            class="absolute inset-0 z-10 flex items-center justify-center bg-secondary/80 backdrop-blur-sm rounded-lg">
            <svg class="h-8 w-8 animate-spin text-brand-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
            </svg>
        </div>

        <div x-show="!isLoading" class="p-4 md:p-6 transition-opacity duration-500">
            <div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Products</h1>
                    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Manage your ecommerce products.</p>
                </div>
                <div class="flex gap-2">
                    <button @click="syncAllToBlogger()" :disabled="isSyncing"
                        class="flex items-center gap-2 rounded-lg border border-gray-200 bg-white px-4 py-2 text-sm font-medium text-blue-600 hover:bg-blue-50 dark:border-gray-700 dark:bg-gray-800 dark:text-blue-400 transition-colors disabled:opacity-50">
                        <span class="w-4 h-4" :class="isSyncing ? 'animate-spin' : ''" x-icon="'refresh'"></span>
                        <span x-text="isSyncing ? 'Syncing...' : 'Sync to Blogger'"></span>
                    </button>
                    <button @click="openAddModal()"
                        class="flex items-center gap-2 rounded-lg bg-brand-500 px-4 py-2 text-sm font-bold text-white shadow-sm hover:bg-brand-600 transition-all active:scale-95">
                        <span class="w-4 h-4" x-icon="'plus'"></span> Add Product
                    </button>
                </div>
            </div>

            <div class="mb-6 flex items-center justify-between">
                <p class="text-sm text-gray-500 dark:text-gray-400">
                    <span class="font-bold text-brand-600 dark:text-brand-400" x-text="products.length"></span> products registered
                </p>
            </div>

        <div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03] overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead>
                    <tr class="border-b border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-800/50">
                        <th class="text-left py-3 px-4 font-medium text-gray-500">Product</th>
                        <th class="text-left py-3 px-4 font-medium text-gray-500">Category</th>
                        <th class="text-left py-3 px-4 font-medium text-gray-500">Price</th>
                        <th class="text-left py-3 px-4 font-medium text-gray-500">Stock</th>
                        <th class="text-left py-3 px-4 font-medium text-gray-500">Status</th>
                        <th class="text-left py-3 px-4 font-medium text-gray-500">Created</th>
                        <th class="text-left py-3 px-4 font-medium text-gray-500">Updated</th>
                        <th class="text-right py-3 px-4 font-medium text-gray-500">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-50 dark:divide-gray-800/50">
                    <template x-for="product in products" :key="product.id">
                        <tr class="group hover:bg-gray-50/50 dark:hover:bg-gray-800/30 transition-colors">
                            <td class="px-6 py-4">
                                <div class="flex items-center gap-4">
                                    <div class="h-12 w-12 shrink-0 overflow-hidden rounded-lg bg-gray-100 dark:bg-gray-800">
                                        <template x-if="getFirstImage(product)">
                                            <img :src="getFirstImage(product)" class="h-full w-full object-cover">
                                        </template>
                                        <template x-if="!getFirstImage(product)">
                                            <div class="flex h-full items-center justify-center text-gray-300">
                                                <span class="w-5 h-5 block" x-icon="'shopping-bag'"></span>
                                            </div>
                                        </template>
                                    </div>
                                    <div class="flex flex-col min-w-0">
                                        <div class="font-bold text-gray-900 dark:text-white truncate max-w-[200px]" x-text="product.name"></div>
                                        <div x-show="product.sku" class="text-[10px] font-mono text-gray-400 truncate max-w-[200px]" x-text="product.sku"></div>
                                    </div>
                                </div>
                            </td>
                            <td class="px-6 py-4 text-gray-500 dark:text-gray-400" x-text="product.category || '—'"></td>
                            <td class="px-6 py-4">
                                <div class="flex flex-col">
                                    <span class="font-black text-brand-600" x-text="formatPrice(product.price)"></span>
                                    <template x-if="product.compareatprice && Number(product.compareatprice) > Number(product.price)">
                                        <span class="text-[10px] text-gray-400 line-through" x-text="formatPrice(product.compareatprice)"></span>
                                    </template>
                                </div>
                            </td>
                            <td class="px-6 py-4 text-gray-500 dark:text-gray-400" x-text="product.stock || '0'"></td>
                            <td class="px-6 py-4">
                                <span class="inline-flex rounded-full px-2 py-0.5 text-[10px] font-bold"
                                    :class="(product.status === 'published' || product.status === 'active') ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'"
                                    x-text="(product.status === 'published' || product.status === 'active') ? 'Active' : 'Draft'"></span>
                            </td>
                            <td class="px-6 py-4 text-[11px] text-gray-400 whitespace-nowrap" x-text="formatDate(product.createdat)"></td>
                            <td class="px-6 py-4 text-[11px] text-gray-400 whitespace-nowrap" x-text="formatDate(product.updatedat)"></td>
                            <td class="px-6 py-4">
                                <div class="flex items-center justify-center gap-2">
                                    <button @click="editProduct(product)"
                                        class="rounded-lg border border-gray-200 p-2 text-gray-500 hover:bg-gray-50 hover:text-brand-600 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-800 transition-colors">
                                        <span class="w-4 h-4 block" x-icon="'pencil'"></span>
                                    </button>
                                    <button @click="deleteProduct(product.id)"
                                        class="rounded-lg border border-red-500/10 p-2 text-red-500/60 hover:bg-red-500 hover:text-white dark:border-red-500/20 dark:hover:bg-red-500 transition-all">
                                        <span class="w-4 h-4 block" x-icon="'trash'"></span>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>

            <template x-if="products.length === 0">
                <div class="flex flex-col items-center justify-center py-16">
                    <span class="w-12 h-12 text-gray-300" x-icon="'shopping-bag'"></span>
                    <p class="mt-4 font-bold text-gray-500">No products yet</p>
                    <button @click="openAddModal()"
                        class="mt-4 rounded-lg bg-brand-500 px-5 py-2 text-sm font-bold text-white hover:bg-brand-600 shadow-lg shadow-brand-500/20 transition-all active:scale-95">Add First Product</button>
                </div>
            </template>
        </div>
        </div>
    </div>

    <!-- Product Modal -->
    <template x-teleport="body">
        <div :class="{ 'show': showModal }" x-trap="showModal" x-cloak
            class="modal fixed inset-0 p-4 md:p-5 overflow-hidden flex justify-center items-center isolate z-[99999]">
            <div @click="showModal = false" class="fixed inset-0 h-full w-full bg-gray-900/40 transition-opacity duration-300"></div>

            <div class="modal-dialog">
                <button @click="showModal = false" class="modal-close-btn">
                    <span class="w-6 h-6 block" x-icon="'close'"></span>
                </button>

                <div class="modal-content">
                    <div class="modal-header-sticky">
                        <h3 class="h3" x-text="isEditing ? 'Edit Product' : 'Add Product'"></h3>
                        <p class="mt-2 text-sm text-theme-secondary">Configure your product details.</p>
                    </div>

                    <div class="modal-body-content custom-scrollbar">
                        <div>
                            <label class="form-label">Product Images</label>
                            <template x-if="editingItem.images && editingItem.images.length > 0">
                                <div class="grid grid-cols-3 gap-2 mb-3">
                                    <template x-for="(url, idx) in editingItem.images" :key="idx">
                                        <div class="relative group aspect-square overflow-hidden rounded-lg bg-gray-100 dark:bg-gray-800">
                                            <img :src="url" class="h-full w-full object-cover" @error="$el.classList.add('hidden'); $el.nextElementSibling.classList.remove('hidden')">
                                            <div class="hidden absolute inset-0 flex items-center justify-center text-gray-400 text-[10px] font-bold">Broken</div>
                                            <div class="absolute inset-0 flex items-start justify-between p-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                                <button @click="setPrimaryImage(idx)" :class="idx === 0 ? 'bg-brand-500 text-white' : 'bg-white/90 text-gray-500 hover:text-brand-600'" class="rounded p-1.5 shadow-sm transition-colors" :title="idx === 0 ? 'Thumbnail Utama' : 'Atur sebagai Thumbnail Utama'">
                                                    <span class="w-3.5 h-3.5 block" x-icon="'star'"></span>
                                                </button>
                                                <div class="flex gap-1">
                                                    <button @click="copyImageUrl(url)" class="rounded bg-white/90 p-1.5 text-gray-600 hover:text-brand-600 shadow-sm" title="Copy URL">
                                                        <span class="w-3.5 h-3.5 block" x-icon="'copy'"></span>
                                                    </button>
                                                    <button @click="removeImage(idx)" class="rounded bg-white/90 p-1.5 text-red-500 hover:bg-red-500 hover:text-white shadow-sm" title="Remove">
                                                        <span class="w-3.5 h-3.5 block" x-icon="'close'"></span>
                                                    </button>
                                                </div>
                                            </div>
                                            <template x-if="idx === 0">
                                                <span class="absolute bottom-1 left-1 rounded bg-brand-500 px-1 py-px text-[8px] font-bold text-white shadow">UTAMA</span>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>
                            <div class="flex gap-2">
                                <input type="url" x-model="newImageUrl" @keyup.enter="addImageUrl()" class="form-input" placeholder="https://example.com/image.jpg">
                                <button @click="addImageUrl()" class="btn btn-primary btn-sm shrink-0">Add</button>
                            </div>
                        </div>
                        <div>
                            <label class="form-label">Primary Thumbnail</label>
                            <div class="flex items-center gap-3">
                                <template x-if="editingItem.images && editingItem.images.length > 0">
                                    <div class="relative h-20 w-20 shrink-0 overflow-hidden rounded-lg bg-gray-100 dark:bg-gray-800 border-2 border-brand-500">
                                        <img :src="editingItem.images[0]" class="h-full w-full object-cover" @error="$el.classList.add('hidden'); $el.nextElementSibling.classList.remove('hidden')">
                                        <div class="hidden absolute inset-0 flex items-center justify-center text-gray-400 text-[10px] font-bold">N/A</div>
                                        <span class="absolute top-0.5 left-0.5 rounded bg-brand-500 px-1 py-px text-[8px] font-bold text-white shadow">UTAMA</span>
                                    </div>
                                </template>
                                <template x-if="!editingItem.images || editingItem.images.length === 0">
                                    <div class="flex h-20 w-20 shrink-0 items-center justify-center rounded-lg border-2 border-dashed border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-800/50">
                                        <span class="w-6 h-6 text-gray-300" x-icon="'image'"></span>
                                    </div>
                                </template>
                                <p class="text-[11px] text-gray-400">Klik ikon bintang pada gambar di atas untuk mengatur thumbnail utama produk.</p>
                            </div>
                        </div>
                        <div>
                            <label class="form-label">Product Name *</label>
                            <input type="text" x-model="editingItem.name" class="form-input" placeholder="Product name">
                        </div>
                        <div>
                            <label class="form-label">SKU</label>
                            <input type="text" x-model="editingItem.sku" class="form-input" placeholder="e.g. PROD-001">
                        </div>
                        <div>
                            <label class="form-label">Description</label>
                            <textarea x-model="editingItem.description" rows="2" class="form-input" placeholder="Short product description"></textarea>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="form-label">Sale Price (IDR)</label>
                                <input type="number" x-model.number="editingItem.price" class="form-input">
                            </div>
                            <div>
                                <label class="form-label">Compare at Price (IDR)</label>
                                <input type="number" x-model.number="editingItem.compareatprice" class="form-input">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="form-label">Category</label>
                                <select x-model="editingItem.category" class="form-input">
                                    <option value="">— Uncategorized —</option>
                                    <template x-for="cat in categories" :key="cat.id">
                                        <option :value="cat.name" x-text="cat.name"></option>
                                    </template>
                                </select>
                            </div>
                            <div>
                                <label class="form-label">Stock</label>
                                <input type="number" x-model.number="editingItem.stock" class="form-input">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="form-label">Weight (gram)</label>
                                <input type="number" x-model.number="editingItem.weight" class="form-input">
                            </div>
                            <div class="flex items-end pb-1">
                                <label class="flex cursor-pointer items-center gap-2">
                                    <input type="checkbox" x-model="editingItem.active" class="peer sr-only">
                                    <div class="relative h-6 w-11 rounded-full bg-gray-200 after:absolute after:left-[2px] after:top-[2px] after:h-5 after:w-5 after:rounded-full after:bg-white after:transition-all peer-checked:bg-brand-600 peer-checked:after:translate-x-full dark:bg-gray-700"></div>
                                    <span class="text-sm font-bold text-gray-700 dark:text-gray-300">Active</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer-actions">
                        <div class="flex w-full sm:w-auto gap-3 ml-auto items-center">
                            <button @click="showModal = false" class="btn btn-outline w-full sm:w-auto">Cancel</button>
                            <button id="save-product-btn" @click="saveProduct()" :disabled="isSaving"
                                class="btn btn-primary w-full sm:w-auto">
                                <template x-if="!isSaving">
                                    <span class="w-4 h-4 mr-1" x-icon="'check'"></span>
                                </template>
                                <template x-if="isSaving">
                                    <span class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin mr-1"></span>
                                </template>
                                <span x-text="isSaving ? 'Saving...' : 'Save Product'"></span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>
</div>
