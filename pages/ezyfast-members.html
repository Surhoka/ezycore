<div x-data="ezyfastMembers" class="w-full px-1 sm:px-0">

  <div class="rounded-2xl border border-primary bg-secondary relative min-h-[500px] shadow-sm overflow-hidden">
    <!-- Loading Overlay -->
    <div x-show="loading" x-cloak
      class="absolute inset-0 z-10 flex items-center justify-center bg-secondary/80 backdrop-blur-sm rounded-lg">
      <svg class="h-8 w-8 animate-spin text-brand-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
      </svg>
    </div>

    <!-- ===================== TAMPILAN DAFTAR ===================== -->
    <div x-show="!selectedMember && !loading" class="p-4 md:p-6 transition-opacity duration-500">
      <!-- Header & Search -->
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
        <div>
          <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">Data Member</h3>
          <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5" x-text="'Total: ' + members.length + ' member terdaftar'"></p>
        </div>
        <div class="flex items-center gap-3">
          <div class="relative w-full sm:w-72">
            <input type="text" x-model="searchQuery" placeholder="Cari nama, email, WA, kota, perusahaan..."
              class="h-10 w-full rounded-lg border border-gray-300 bg-transparent pl-9 pr-4 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-none focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90" />
            <svg class="w-4 h-4 text-gray-400 absolute left-3 top-3 pointer-events-none" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
            </svg>
          </div>
          <button @click="loadMembers()" class="p-2.5 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-100 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-800 transition-colors" title="Muat Ulang">
            <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Table Container -->
      <div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03] overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-800/50 text-xs font-semibold text-gray-500 uppercase">
                <th class="text-left py-3.5 px-4">Member</th>
                <th class="text-left py-3.5 px-4">Kontak</th>
                <th class="text-left py-3.5 px-4 hidden md:table-cell">Perusahaan &amp; Jabatan</th>
                <th class="text-left py-3.5 px-4 hidden lg:table-cell">Alamat &amp; Kota</th>
                <th class="text-left py-3.5 px-4 hidden sm:table-cell">Terdaftar</th>
                <th class="text-right py-3.5 px-4">Aksi</th>
              </tr>
            </thead>
            <tbody>
              <template x-if="filteredMembers.length === 0">
                <tr><td colspan="6" class="py-12 text-center text-gray-500">Tidak ada data member yang sesuai.</td></tr>
              </template>
              <template x-for="member in filteredMembers" :key="member.id || member.uid || member.email">
                <tr class="border-b border-gray-50 dark:border-gray-800/50 hover:bg-gray-50 dark:hover:bg-white/[0.02] transition-colors">
                  <!-- Member Info -->
                  <td class="py-3.5 px-4">
                    <div class="flex items-center gap-3">
                      <img :src="member.avatarUrl || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(member.name || member.email || 'Member') + '&background=f97316&color=fff&size=80'"
                        :alt="member.name || 'Member'" class="h-9 w-9 rounded-full object-cover shrink-0 ring-1 ring-gray-200 dark:ring-gray-700" />
                      <div class="min-w-0">
                        <div class="font-semibold text-gray-800 dark:text-white/90 truncate" x-text="member.name || 'Member'"></div>
                        <span class="inline-block px-1.5 py-0.5 rounded text-[10px] font-mono bg-orange-100 text-orange-700 dark:bg-orange-950/40 dark:text-orange-300"
                          x-text="member.memberId || member.id || '-'"></span>
                      </div>
                    </div>
                  </td>

                  <!-- Kontak -->
                  <td class="py-3.5 px-4">
                    <div class="text-gray-800 dark:text-white/90 font-medium" x-text="member.email || '-'"></div>
                    <div class="text-xs text-gray-500 dark:text-gray-400 mt-0.5 flex items-center gap-1.5">
                      <svg class="w-3.5 h-3.5 text-green-600 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 0 1-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 0 0-1.091-.852H4.5A2.25 2.25 0 0 0 2.25 4.5v2.25Z"/>
                      </svg>
                      <span x-text="member.phone || '-'"></span>
                    </div>
                  </td>

                  <!-- Perusahaan & Jabatan -->
                  <td class="py-3.5 px-4 hidden md:table-cell">
                    <div class="text-gray-700 dark:text-gray-300 font-medium" x-text="member.company || '-'"></div>
                    <div class="text-xs text-gray-500 dark:text-gray-400" x-text="member.role || '-'"></div>
                  </td>

                  <!-- Alamat & Kota -->
                  <td class="py-3.5 px-4 hidden lg:table-cell">
                    <div class="text-gray-700 dark:text-gray-300 text-xs" x-text="member.city || member.province ? (member.city || '') + (member.city && member.province ? ', ' : '') + (member.province || '') : (member.address || '-')"></div>
                  </td>

                  <!-- Terdaftar -->
                  <td class="py-3.5 px-4 text-xs text-gray-500 hidden sm:table-cell" x-text="formatDate(member.createdat || member.createdAt)"></td>

                  <!-- Aksi -->
                  <td class="py-3.5 px-4 text-right">
                    <div class="flex items-center justify-end gap-1.5">
                      <button @click="viewDetail(member)"
                        class="p-1.5 rounded-lg text-gray-500 hover:text-brand-500 hover:bg-brand-50 dark:hover:bg-brand-500/10 transition-colors"
                        title="Lihat Detail Profil">
                        <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
                          <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7Z"/>
                        </svg>
                      </button>
                      <button @click="openEdit(member)"
                        class="p-1.5 rounded-lg text-gray-500 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-500/10 transition-colors"
                        title="Edit Profil Member">
                        <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                          <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10"/>
                        </svg>
                      </button>
                      <template x-if="member.phone">
                        <a :href="'https://wa.me/' + member.phone.replace(/[^0-9]/g, '')" target="_blank"
                          class="p-1.5 rounded-lg text-gray-500 hover:text-green-600 hover:bg-green-50 dark:hover:bg-green-500/10 transition-colors"
                          title="Hubungi via WhatsApp">
                          <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H8.25m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H12m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 0 1-2.555-.337A5.972 5.972 0 0 1 5.41 20.97a.75.75 0 0 1-.774-.942l.534-2.138A7.734 7.734 0 0 1 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25Z"/>
                          </svg>
                        </a>
                      </template>
                    </div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ===================== TAMPILAN DETAIL (TAB) ===================== -->
    <div x-show="selectedMember && !loading" x-cloak class="p-4 md:p-6 transition-opacity duration-500">
      <template x-if="selectedMember">
        <div>
          <!-- Header Detail: Tombol kembali & identitas singkat -->
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
            <div class="flex items-center gap-3 min-w-0">
              <button @click="closeDetail()"
                class="p-2 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-100 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-800 transition-colors shrink-0"
                title="Kembali ke Daftar">
                <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/>
                </svg>
              </button>
              <div class="min-w-0">
                <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90 truncate">Detail Profil Member</h3>
                <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5 truncate">
                  <span x-text="selectedMember.name || 'Member'"></span>
                  <span class="ml-1 font-mono" x-text="'(' + (selectedMember.memberId || selectedMember.id || '-') + ')'"></span>
                </p>
              </div>
            </div>
            <div class="flex gap-2 shrink-0">
              <template x-if="selectedMember.phone">
                <a :href="'https://wa.me/' + selectedMember.phone.replace(/[^0-9]/g, '')" target="_blank"
                  class="inline-flex items-center gap-1.5 px-4 py-2 text-sm font-medium text-green-700 bg-green-100 rounded-lg hover:bg-green-200 dark:bg-green-900/40 dark:text-green-300 dark:hover:bg-green-900/60 transition-colors">
                  WhatsApp
                </a>
              </template>
              <button @click="openEdit(selectedMember)"
                class="inline-flex items-center gap-1.5 px-4 py-2 text-sm font-medium text-white bg-brand-500 rounded-lg hover:bg-brand-600 transition-colors">
                Edit Profil
              </button>
            </div>
          </div>

          <!-- Kartu Identitas Member -->
          <div class="flex items-center gap-4 p-4 mb-6 rounded-xl bg-orange-50/60 dark:bg-orange-950/20 border border-orange-100 dark:border-orange-900/30">
            <img :src="selectedMember.avatarUrl || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(selectedMember.name || selectedMember.email || 'Member') + '&background=f97316&color=fff&size=96'"
              :alt="selectedMember.name" class="h-16 w-16 rounded-2xl object-cover ring-2 ring-orange-200 dark:ring-orange-800 shrink-0" />
            <div class="grow min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="text-lg font-bold text-gray-800 dark:text-white/90" x-text="selectedMember.name || 'Member'"></span>
                <span class="px-2 py-0.5 rounded-full text-xs font-mono font-semibold bg-orange-500 text-white" x-text="selectedMember.memberId || selectedMember.id || '-'"></span>
              </div>
              <div class="text-sm text-gray-600 dark:text-gray-300 mt-0.5" x-text="selectedMember.role ? selectedMember.role + (selectedMember.company ? ' di ' + selectedMember.company : '') : (selectedMember.company || '-')"></div>
              <div class="text-xs text-gray-400 dark:text-gray-500 mt-1" x-text="'Bergabung: ' + formatDate(selectedMember.createdat || selectedMember.createdAt)"></div>
            </div>
          </div>

          <!-- Navigasi Tab -->
          <div class="flex flex-wrap items-center gap-1 mb-5">
            <button @click="detailTab = 'profil'" :class="{ 'active': detailTab === 'profil' }" class="tab-nav-btn">Profil</button>
            <button @click="detailTab = 'alamat'" :class="{ 'active': detailTab === 'alamat' }" class="tab-nav-btn">Alamat</button>
            <button @click="detailTab = 'catatan'" :class="{ 'active': detailTab === 'catatan' }" class="tab-nav-btn">Catatan</button>
          </div>

          <!-- Konten Tab: Profil -->
          <div x-show="detailTab === 'profil'" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 text-sm">
              <div class="p-3 rounded-xl border border-gray-100 dark:border-gray-800 bg-gray-50/50 dark:bg-white/[0.02]">
                <span class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Email</span>
                <span class="font-medium text-gray-800 dark:text-white/90 break-all" x-text="selectedMember.email || '-'"></span>
              </div>
              <div class="p-3 rounded-xl border border-gray-100 dark:border-gray-800 bg-gray-50/50 dark:bg-white/[0.02]">
                <span class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">No. WhatsApp / Telepon</span>
                <span class="font-medium text-gray-800 dark:text-white/90" x-text="selectedMember.phone || '-'"></span>
              </div>
              <div class="p-3 rounded-xl border border-gray-100 dark:border-gray-800 bg-gray-50/50 dark:bg-white/[0.02]">
                <span class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Perusahaan</span>
                <span class="font-medium text-gray-800 dark:text-white/90" x-text="selectedMember.company || '-'"></span>
              </div>
              <div class="p-3 rounded-xl border border-gray-100 dark:border-gray-800 bg-gray-50/50 dark:bg-white/[0.02]">
                <span class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Jabatan</span>
                <span class="font-medium text-gray-800 dark:text-white/90" x-text="selectedMember.role || '-'"></span>
              </div>
            </div>

            <!-- Ringkasan Transaksi -->
            <div class="grid grid-cols-2 gap-3.5 text-sm">
              <div class="p-3.5 rounded-xl border border-gray-100 dark:border-gray-800 bg-gray-50/50 dark:bg-white/[0.02]">
                <span class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Total Order</span>
                <span class="text-lg font-bold text-gray-800 dark:text-white/90" x-text="(selectedMember.totalorders || 0) + ' Order'"></span>
              </div>
              <div class="p-3.5 rounded-xl border border-gray-100 dark:border-gray-800 bg-gray-50/50 dark:bg-white/[0.02]">
                <span class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Total Belanja</span>
                <span class="text-lg font-bold text-gray-800 dark:text-white/90" x-text="formatCurrency(selectedMember.totalspent)"></span>
              </div>
            </div>
          </div>

          <!-- Konten Tab: Alamat -->
          <div x-show="detailTab === 'alamat'" x-cloak class="space-y-4">
            <div class="p-3.5 rounded-xl border border-gray-100 dark:border-gray-800 bg-gray-50/50 dark:bg-white/[0.02] text-sm">
              <span class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Alamat Pengiriman / Domisili</span>
              <p class="text-gray-700 dark:text-gray-300 leading-relaxed" x-text="selectedMember.address || 'Belum mengisi alamat'"></p>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3.5 text-sm">
              <div class="p-3 rounded-xl border border-gray-100 dark:border-gray-800 bg-gray-50/50 dark:bg-white/[0.02]">
                <span class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Kota</span>
                <span class="font-medium text-gray-800 dark:text-white/90" x-text="selectedMember.city || '-'"></span>
              </div>
              <div class="p-3 rounded-xl border border-gray-100 dark:border-gray-800 bg-gray-50/50 dark:bg-white/[0.02]">
                <span class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Provinsi</span>
                <span class="font-medium text-gray-800 dark:text-white/90" x-text="selectedMember.province || '-'"></span>
              </div>
              <div class="p-3 rounded-xl border border-gray-100 dark:border-gray-800 bg-gray-50/50 dark:bg-white/[0.02]">
                <span class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Kode Pos</span>
                <span class="font-medium text-gray-800 dark:text-white/90" x-text="selectedMember.postalCode || '-'"></span>
              </div>
            </div>
          </div>

          <!-- Konten Tab: Catatan -->
          <div x-show="detailTab === 'catatan'" x-cloak class="space-y-4">
            <div class="p-3.5 rounded-xl border border-gray-100 dark:border-gray-800 bg-gray-50/50 dark:bg-white/[0.02] text-sm">
              <span class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Bio / Catatan</span>
              <p class="text-gray-700 dark:text-gray-300 italic leading-relaxed" x-text="selectedMember.bio || 'Belum ada catatan untuk member ini.'"></p>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 text-sm">
              <div class="p-3 rounded-xl border border-gray-100 dark:border-gray-800 bg-gray-50/50 dark:bg-white/[0.02]">
                <span class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Bergabung</span>
                <span class="font-medium text-gray-800 dark:text-white/90" x-text="formatDate(selectedMember.createdat || selectedMember.createdAt)"></span>
              </div>
              <div class="p-3 rounded-xl border border-gray-100 dark:border-gray-800 bg-gray-50/50 dark:bg-white/[0.02]">
                <span class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Update Terakhir</span>
                <span class="font-medium text-gray-800 dark:text-white/90" x-text="formatDate(selectedMember.updatedAt)"></span>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- Edit Member Modal -->
  <div x-show="editOpen" x-cloak x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
    class="fixed inset-0 z-[99999] flex items-center justify-center p-4 md:p-5 bg-black/50 backdrop-blur-sm overflow-y-auto"
    @click.self="closeEdit()">
    <div x-show="editOpen" x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
      class="relative z-10 w-full max-w-xl rounded-2xl border border-gray-200 bg-white p-6 shadow-xl dark:border-gray-700 dark:bg-gray-900 my-auto">

      <!-- Modal Header -->
      <div class="flex items-start justify-between pb-4 border-b border-gray-100 dark:border-gray-800 mb-5">
        <div>
          <h4 class="text-lg font-semibold text-gray-800 dark:text-white/90">Edit Profil Member</h4>
          <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">
            Email: <span class="font-mono" x-text="editForm.email || '-'"></span>
            <span x-show="editForm.memberId" class="ml-1 font-mono" x-text="'(' + editForm.memberId + ')'"></span>
          </p>
        </div>
        <button @click="closeEdit()" class="p-1 rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-100 dark:hover:bg-gray-800">
          <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Form Edit -->
      <form @submit.prevent="saveMember()" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
          <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Nama Lengkap</label>
            <input type="text" x-model="editForm.name" placeholder="Nama member"
              class="h-10 w-full rounded-lg border border-gray-300 bg-transparent px-3 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-none focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">No. WhatsApp / Telepon</label>
            <input type="text" x-model="editForm.phone" placeholder="08xxxxxxxxxx"
              class="h-10 w-full rounded-lg border border-gray-300 bg-transparent px-3 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-none focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Perusahaan</label>
            <input type="text" x-model="editForm.company" placeholder="Nama perusahaan"
              class="h-10 w-full rounded-lg border border-gray-300 bg-transparent px-3 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-none focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Jabatan</label>
            <input type="text" x-model="editForm.role" placeholder="Jabatan member"
              class="h-10 w-full rounded-lg border border-gray-300 bg-transparent px-3 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-none focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Alamat Lengkap</label>
          <textarea x-model="editForm.address" rows="2" placeholder="Alamat pengiriman / domisili"
            class="w-full rounded-lg border border-gray-300 bg-transparent px-3 py-2 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-none focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90"></textarea>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3.5">
          <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Kota</label>
            <input type="text" x-model="editForm.city" placeholder="Kota"
              class="h-10 w-full rounded-lg border border-gray-300 bg-transparent px-3 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-none focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Provinsi</label>
            <input type="text" x-model="editForm.province" placeholder="Provinsi"
              class="h-10 w-full rounded-lg border border-gray-300 bg-transparent px-3 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-none focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Kode Pos</label>
            <input type="text" x-model="editForm.postalCode" placeholder="Kode pos"
              class="h-10 w-full rounded-lg border border-gray-300 bg-transparent px-3 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-none focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Bio / Catatan Admin</label>
          <textarea x-model="editForm.bio" rows="2" placeholder="Catatan tambahan tentang member ini"
            class="w-full rounded-lg border border-gray-300 bg-transparent px-3 py-2 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-none focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90"></textarea>
        </div>

        <!-- Footer Actions -->
        <div class="flex items-center justify-end gap-2 pt-4 border-t border-gray-100 dark:border-gray-800">
          <button type="button" @click="closeEdit()"
            class="px-4 py-2 text-sm font-medium text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700 transition-colors">
            Batal
          </button>
          <button type="submit" :disabled="isSaving"
            class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-white bg-brand-500 rounded-lg hover:bg-brand-600 disabled:opacity-60 disabled:cursor-not-allowed transition-colors">
            <svg x-show="isSaving" class="h-4 w-4 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
            </svg>
            <span x-text="isSaving ? 'Menyimpan...' : 'Simpan Perubahan'"></span>
          </button>
        </div>
      </form>
    </div>
  </div>

</div>
