<div x-data="ezyfastMembers" class="w-full px-1 sm:px-0">

  <div class="rounded-2xl border border-primary bg-secondary relative min-h-[500px] shadow-sm overflow-hidden">
    <!-- Loading Overlay -->
    <div x-show="loading" x-cloak
      class="absolute inset-0 z-10 flex items-center justify-center bg-secondary/80 backdrop-blur-sm rounded-lg">
      <svg class="h-8 w-8 animate-spin text-brand-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
      </svg>
    </div>

    <!-- ===================== TAMPILAN DAFTAR ===================== -->
    <div x-show="!selectedMember && !loading" class="p-4 md:p-6 transition-opacity duration-500">
      <!-- Header & Search -->
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
        <div>
          <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">Data Member</h3>
          <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5" x-text="'Total: ' + members.length + ' member terdaftar'"></p>
        </div>
        <div class="flex items-center gap-3">
          <div class="relative w-full sm:w-72">
            <input type="text" x-model="searchQuery" placeholder="Cari nama, email, WA, kota, perusahaan..."
              class="h-10 w-full rounded-lg border border-gray-300 bg-transparent pl-9 pr-4 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-none focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90" />
            <svg class="w-4 h-4 text-gray-400 absolute left-3 top-3 pointer-events-none" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
            </svg>
          </div>
          <button @click="loadMembers()" class="p-2.5 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-100 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-800 transition-colors" title="Muat Ulang">
            <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Table Container -->
      <div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03] overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-800/50 text-xs font-semibold text-gray-500 uppercase">
                <th class="text-left py-3.5 px-4">Member</th>
                <th class="text-left py-3.5 px-4">Kontak</th>
                <th class="text-left py-3.5 px-4 hidden md:table-cell">Perusahaan &amp; Jabatan</th>
                <th class="text-left py-3.5 px-4 hidden lg:table-cell">Alamat &amp; Kota</th>
                <th class="text-left py-3.5 px-4 hidden sm:table-cell">Terdaftar</th>
                <th class="text-right py-3.5 px-4">Aksi</th>
              </tr>
            </thead>
            <tbody>
              <template x-if="filteredMembers.length === 0">
                <tr><td colspan="6" class="py-12 text-center text-gray-500">Tidak ada data member yang sesuai.</td></tr>
              </template>
              <template x-for="member in filteredMembers" :key="member.id || member.uid || member.email">
                <tr class="border-b border-gray-50 dark:border-gray-800/50 hover:bg-gray-50 dark:hover:bg-white/[0.02] transition-colors">
                  <!-- Member Info -->
                  <td class="py-3.5 px-4">
                    <div class="flex items-center gap-3">
                      <img :src="member.avatarUrl || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(member.name || member.email || 'Member') + '&background=f97316&color=fff&size=80'"
                        :alt="member.name || 'Member'" class="h-9 w-9 rounded-full object-cover shrink-0 ring-1 ring-gray-200 dark:ring-gray-700" />
                      <div class="min-w-0">
                        <div class="font-semibold text-gray-800 dark:text-white/90 truncate" x-text="member.name || 'Member'"></div>
                        <span class="inline-block px-1.5 py-0.5 rounded text-[10px] font-mono bg-orange-100 text-orange-700 dark:bg-orange-950/40 dark:text-orange-300"
                          x-text="member.memberId || member.id || '-'"></span>
                      </div>
                    </div>
                  </td>

                  <!-- Kontak -->
                  <td class="py-3.5 px-4">
                    <div class="text-gray-800 dark:text-white/90 font-medium" x-text="member.email || '-'"></div>
                    <div class="text-xs text-gray-500 dark:text-gray-400 mt-0.5 flex items-center gap-1.5">
                      <svg class="w-3.5 h-3.5 text-green-600 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 0 1-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 0 0-1.091-.852H4.5A2.25 2.25 0 0 0 2.25 4.5v2.25Z"/>
                      </svg>
                      <span x-text="member.phone || '-'"></span>
                    </div>
                  </td>

                  <!-- Perusahaan & Jabatan -->
                  <td class="py-3.5 px-4 hidden md:table-cell">
                    <div class="text-gray-700 dark:text-gray-300 font-medium" x-text="member.company || '-'"></div>
                    <div class="text-xs text-gray-500 dark:text-gray-400" x-text="member.role || '-'"></div>
                  </td>

                  <!-- Alamat & Kota -->
                  <td class="py-3.5 px-4 hidden lg:table-cell">
                    <div class="text-gray-700 dark:text-gray-300 text-xs" x-text="member.city || member.province ? (member.city || '') + (member.city && member.province ? ', ' : '') + (member.province || '') : (member.address || '-')"></div>
                  </td>

                  <!-- Terdaftar -->
                  <td class="py-3.5 px-4 text-xs text-gray-500 hidden sm:table-cell" x-text="formatDate(member.createdat || member.createdAt)"></td>

                  <!-- Aksi -->
                  <td class="py-3.5 px-4 text-right">
                    <div class="flex items-center justify-end gap-1.5">
                      <button @click="viewDetail(member)"
                        class="p-1.5 rounded-lg text-gray-500 hover:text-brand-500 hover:bg-brand-50 dark:hover:bg-brand-500/10 transition-colors"
                        title="Lihat Detail Profil">
                        <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
                          <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7Z"/>
                        </svg>
                      </button>
                    </div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ===================== TAMPILAN DETAIL (GAYA PROFIL) ===================== -->
    <div x-show="selectedMember && !loading" x-cloak class="p-4 md:p-6 transition-opacity duration-500">
      <template x-if="selectedMember">
        <div class="animate-fade-in">
          <!-- Header Detail: Tombol kembali & aksi cepat -->
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
            <div class="flex items-center gap-3 min-w-0">
              <button @click="closeDetail()" class="btn btn-outline w-10 h-10 !p-0 shrink-0" title="Kembali ke Daftar">
                <span class="w-4 h-4 block" x-icon="'arrow-left'"></span>
              </button>
              <div class="min-w-0">
                <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90 truncate">Detail Profil Member</h3>
                <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5 truncate" x-text="selectedMember.email || '-'"></p>
              </div>
            </div>
            <div class="flex items-center gap-3 shrink-0">
              <button @click="openEdit(selectedMember)" class="btn btn-primary">
                <span class="w-4 h-4 block" x-icon="'pencil'"></span> Edit Profil
              </button>
            </div>
          </div>

          <!-- Kontainer putih mengikuti gaya halaman Profil -->
          <div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03] lg:p-6">

            <!-- Kartu Identitas Member -->
            <div class="p-5 mb-6 border border-gray-200 rounded-2xl dark:border-gray-800 lg:p-6">
              <div class="flex flex-col items-center gap-5 text-center xl:flex-row xl:items-center xl:justify-between xl:text-left">
                <div class="flex flex-col items-center gap-6 xl:flex-row min-w-0">
                  <div class="w-20 h-20 overflow-hidden border border-gray-200 rounded-full dark:border-gray-800 shrink-0">
                    <img :src="selectedMember.avatarUrl || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(selectedMember.name || selectedMember.email || 'Member') + '&background=f97316&color=fff&size=128'"
                      :alt="selectedMember.name || 'Member'" class="w-full h-full object-cover" />
                  </div>
                  <div class="min-w-0">
                    <h4 class="mb-2 text-lg font-semibold text-gray-800 dark:text-white/90 flex flex-wrap items-center justify-center xl:justify-start gap-2">
                      <span x-text="selectedMember.name || 'Member'"></span>
                      <span class="px-2 py-0.5 rounded-full text-xs font-mono font-semibold bg-orange-500 text-white" x-text="selectedMember.memberId || selectedMember.id || '-'"></span>
                    </h4>
                    <div class="flex flex-col items-center gap-1 text-sm text-gray-500 dark:text-gray-400 xl:flex-row xl:gap-3 xl:text-left">
                      <p x-text="selectedMember.role ? selectedMember.role + (selectedMember.company ? ' di ' + selectedMember.company : '') : (selectedMember.company || 'Tanpa jabatan')"></p>
                      <div class="hidden h-3.5 w-px bg-gray-300 dark:bg-gray-700 xl:block"></div>
                      <p x-text="'Bergabung: ' + formatDate(selectedMember.createdat || selectedMember.createdAt)"></p>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Kartu Informasi Pribadi -->
            <div class="p-5 mb-6 border border-gray-200 rounded-2xl dark:border-gray-800 lg:p-6">
              <div class="flex flex-col gap-6 lg:flex-row lg:items-start lg:justify-between">
                <div class="min-w-0">
                  <h4 class="h4 mb-6">Informasi Pribadi</h4>
                  <div class="grid grid-cols-1 gap-4 lg:grid-cols-2 lg:gap-7 2xl:gap-x-32">
                    <div>
                      <p class="mb-2 text-xs leading-normal text-gray-500 dark:text-gray-400">Email</p>
                      <p x-text="selectedMember.email || '-'" class="text-sm font-medium text-gray-800 dark:text-white/90 break-all"></p>
                    </div>
                    <div>
                      <p class="mb-2 text-xs leading-normal text-gray-500 dark:text-gray-400">No. WhatsApp / Telepon</p>
                      <p x-text="selectedMember.phone || '-'" class="text-sm font-medium text-gray-800 dark:text-white/90"></p>
                    </div>
                    <div>
                      <p class="mb-2 text-xs leading-normal text-gray-500 dark:text-gray-400">Perusahaan</p>
                      <p x-text="selectedMember.company || '-'" class="text-sm font-medium text-gray-800 dark:text-white/90"></p>
                    </div>
                    <div>
                      <p class="mb-2 text-xs leading-normal text-gray-500 dark:text-gray-400">Jabatan</p>
                      <p x-text="selectedMember.role || '-'" class="text-sm font-medium text-gray-800 dark:text-white/90"></p>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Kartu Alamat -->
            <div class="p-5 mb-6 border border-gray-200 rounded-2xl dark:border-gray-800 lg:p-6">
              <div class="flex flex-col gap-6 lg:flex-row lg:items-start lg:justify-between">
                <div class="min-w-0">
                  <h4 class="h4 mb-6">Alamat</h4>
                  <div class="grid grid-cols-1 gap-4 lg:grid-cols-2 lg:gap-7 2xl:gap-x-32">
                    <div class="lg:col-span-2">
                      <p class="mb-2 text-xs leading-normal text-gray-500 dark:text-gray-400">Alamat Pengiriman / Domisili</p>
                      <p x-text="selectedMember.address || 'Belum mengisi alamat'" class="text-sm font-medium text-gray-800 dark:text-white/90"></p>
                    </div>
                    <div>
                      <p class="mb-2 text-xs leading-normal text-gray-500 dark:text-gray-400">Kota</p>
                      <p x-text="selectedMember.city || '-'" class="text-sm font-medium text-gray-800 dark:text-white/90"></p>
                    </div>
                    <div>
                      <p class="mb-2 text-xs leading-normal text-gray-500 dark:text-gray-400">Provinsi</p>
                      <p x-text="selectedMember.province || '-'" class="text-sm font-medium text-gray-800 dark:text-white/90"></p>
                    </div>
                    <div>
                      <p class="mb-2 text-xs leading-normal text-gray-500 dark:text-gray-400">Kode Pos</p>
                      <p x-text="selectedMember.postalCode || '-'" class="text-sm font-medium text-gray-800 dark:text-white/90"></p>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Kartu Ringkasan Transaksi -->
            <div class="p-5 mb-6 border border-gray-200 rounded-2xl dark:border-gray-800 lg:p-6">
              <h4 class="h4 mb-6">Ringkasan Transaksi</h4>
              <div class="grid grid-cols-1 gap-4 lg:grid-cols-2 lg:gap-7 2xl:gap-x-32">
                <div>
                  <p class="mb-2 text-xs leading-normal text-gray-500 dark:text-gray-400">Total Order</p>
                  <p x-text="(selectedMember.totalorders || 0) + ' Order'" class="text-lg font-semibold text-gray-800 dark:text-white/90"></p>
                </div>
                <div>
                  <p class="mb-2 text-xs leading-normal text-gray-500 dark:text-gray-400">Total Belanja</p>
                  <p x-text="formatCurrency(selectedMember.totalspent)" class="text-lg font-semibold text-gray-800 dark:text-white/90"></p>
                </div>
              </div>
            </div>

            <!-- Kartu Catatan -->
            <div class="p-5 border border-gray-200 rounded-2xl dark:border-gray-800 lg:p-6">
              <h4 class="h4 mb-6">Catatan</h4>
              <div class="grid grid-cols-1 gap-4 lg:grid-cols-2 lg:gap-7 2xl:gap-x-32">
                <div class="lg:col-span-2">
                  <p class="mb-2 text-xs leading-normal text-gray-500 dark:text-gray-400">Bio / Catatan</p>
                  <p x-text="selectedMember.bio || 'Belum ada catatan untuk member ini.'" class="text-sm font-medium italic text-gray-800 dark:text-white/90"></p>
                </div>
                <div>
                  <p class="mb-2 text-xs leading-normal text-gray-500 dark:text-gray-400">Update Terakhir</p>
                  <p x-text="formatDate(selectedMember.updatedAt)" class="text-sm font-medium text-gray-800 dark:text-white/90"></p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- Edit Member Modal -->
  <div :class="{ 'show': editOpen }" x-cloak
    class="fixed inset-0 flex justify-center items-center p-4 md:p-5 overflow-hidden modal"
    data-lenis-prevent>
    <div class="fixed inset-0 h-full w-full bg-gray-900/40 backdrop-blur-xl transition-opacity duration-300"
      x-on:click="closeEdit()"></div>
    <div class="modal-dialog rounded-2xl">
      <!-- close btn -->
      <button x-on:click="closeEdit()" class="modal-close-btn">
        <span class="w-6 h-6 block" x-icon="'close'"></span>
      </button>

      <div class="modal-content">
        <div class="modal-header-sticky">
          <h3 class="h3">
            Edit Profil Member
          </h3>
          <p class="mt-2 text-sm text-theme-secondary">
            Email: <span class="font-mono" x-text="editForm.email || '-'"></span>
            <span x-show="editForm.memberId" class="ml-1 font-mono" x-text="'(' + editForm.memberId + ')'"></span>
          </p>
        </div>
        <form @submit.prevent="saveMember()" class="flex flex-col">
          <div class="modal-body-content custom-scrollbar">
            <div>
              <h5 class="h5 mb-4">Informasi Pribadi</h5>
              <div class="grid grid-cols-1 gap-x-6 gap-y-5 lg:grid-cols-2">
                <div>
                  <label class="form-label">Nama Lengkap</label>
                  <input type="text" x-model="editForm.name" placeholder="Nama member" class="form-input" />
                </div>
                <div>
                  <label class="form-label">No. WhatsApp / Telepon</label>
                  <input type="text" x-model="editForm.phone" placeholder="08xxxxxxxxxx" class="form-input" />
                </div>
                <div>
                  <label class="form-label">Perusahaan</label>
                  <input type="text" x-model="editForm.company" placeholder="Nama perusahaan" class="form-input" />
                </div>
                <div>
                  <label class="form-label">Jabatan</label>
                  <input type="text" x-model="editForm.role" placeholder="Jabatan member" class="form-input" />
                </div>
              </div>
            </div>

            <div>
              <h5 class="h5 mb-4">Alamat</h5>
              <div class="grid grid-cols-1 gap-x-6 gap-y-5 lg:grid-cols-2">
                <div class="col-span-2 lg:col-span-1">
                  <label class="form-label">Alamat Lengkap</label>
                  <textarea x-model="editForm.address" rows="2" placeholder="Alamat pengiriman / domisili"
                    class="form-input"></textarea>
                </div>
                <div>
                  <label class="form-label">Kota</label>
                  <input type="text" x-model="editForm.city" placeholder="Kota" class="form-input" />
                </div>
                <div>
                  <label class="form-label">Provinsi</label>
                  <input type="text" x-model="editForm.province" placeholder="Provinsi" class="form-input" />
                </div>
                <div>
                  <label class="form-label">Kode Pos</label>
                  <input type="text" x-model="editForm.postalCode" placeholder="Kode pos" class="form-input" />
                </div>
              </div>
            </div>

            <div>
              <h5 class="h5 mb-4">Bio / Catatan Admin</h5>
              <textarea x-model="editForm.bio" rows="2" placeholder="Catatan tambahan tentang member ini"
                class="form-input"></textarea>
            </div>
          </div>
          <div class="modal-footer-actions">
            <button type="button" x-on:click="closeEdit()" class="btn btn-outline w-full sm:w-auto min-w-[110px]">
              Batal
            </button>
            <div class="flex w-full sm:w-auto gap-3 ml-auto">
              <button type="submit" :disabled="isSaving"
                class="btn btn-primary w-full sm:w-auto min-w-[150px]">
                <template x-if="!isSaving">
                  <span>Simpan Perubahan</span>
                </template>
                <template x-if="isSaving">
                  <span class="inline-flex items-center gap-2">
                    <svg class="w-4 h-4 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none"
                      viewBox="0 0 24 24">
                      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                      <path class="opacity-75" fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                      </path>
                    </svg>
                    <span>Menyimpan...</span>
                  </span>
                </template>
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

</div>
